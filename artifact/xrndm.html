<title>XRNDM</title>
<meta name="description" content="XRNDM: a bag-building roguelite about reading the odds.">
<style>
:root {
  --bg: #05070d; --panel: rgba(10, 16, 28, 0.86); --panel2: rgba(20, 30, 50, 0.9); --line: #24324d;
  --ink: #e8f4ff; --dim: #8fa3bf; --a: #7cf7ff; --b: #ffcf6e; --d: #ff5fa2; --good: #8cff8c; --bad: #ff5c5c; --blk: #5cb8ff;
  --font: "Courier New", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#scan { position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
#app { position: fixed; inset: 0; z-index: 2; overflow: hidden; display: flex; flex-direction: column; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.flash { position: fixed; inset: 0; pointer-events: none; z-index: 45; animation: flash .5s ease-out forwards; }
@keyframes flash { from { opacity: .75 } to { opacity: 0 } }
.shake { animation: shake .35s linear; }
@keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-7px,3px)} 40%{transform:translate(6px,-4px)} 60%{transform:translate(-4px,-2px)} 80%{transform:translate(4px,3px)} }
.float { position: fixed; font-weight: 900; font-size: 28px; text-shadow: 0 0 8px currentColor, 0 2px 0 #000; animation: float 1s ease-out forwards; white-space: nowrap; transform: translate(-50%, -50%); }
@keyframes float { from { opacity: 1; margin-top: 0 } to { opacity: 0; margin-top: -60px } }

button, .btn { font-family: var(--font); font-size: 16px; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); border-radius: 6px; padding: 10px 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: border-color .12s, transform .08s, box-shadow .12s; }
button:hover:not(:disabled) { border-color: var(--a); box-shadow: 0 0 12px rgba(124,247,255,.35); }
button:active:not(:disabled) { transform: translateY(1px) scale(.99); }
button:disabled { opacity: .4; cursor: default; }
button.primary { border-color: var(--a); color: var(--a); }
button.warn { border-color: var(--d); color: var(--d); }
button.big { font-size: 20px; padding: 14px 22px; min-width: 150px; }
button:focus-visible { outline: 2px solid var(--b); outline-offset: 2px; }
body.pad :focus { outline: 3px solid var(--b); outline-offset: 3px; box-shadow: 0 0 18px rgba(255,207,110,.45); }
body.pad .card:focus { transform: translateY(-3px); border-color: var(--b); }
body.pad g.node:focus { outline: none; box-shadow: none; }
body.pad g.node:focus circle.ring { stroke: var(--b); stroke-width: 5; }
body.pad input[type=range]:focus { outline-offset: 6px; }
.card:focus-visible, g.node:focus-visible { outline: 2px solid var(--b); outline-offset: 2px; }
h1, h2, h3 { margin: 0 0 10px; letter-spacing: 2px; }
h2 { color: var(--a); font-size: 22px; text-transform: uppercase; }
p { line-height: 1.5; }
.dim { color: var(--dim); }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.menu { display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
.menu button { width: 100%; }
.logo { width: min(720px, 92vw); height: min(180px, 24vw); }
.tag { color: var(--b); letter-spacing: 3px; font-size: 14px; text-transform: uppercase; }
.blink { animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0 } }
.wrap { max-width: 980px; width: 100%; margin: 0 auto; }

/* HUD */
.hud { display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: rgba(5,8,14,.85); border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 15px; z-index: 3; }
.hud .stat { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.hud .hp { color: var(--bad); } .hud .bits { color: var(--b); } .hud .sight { color: var(--a); } .hud .lim { color: #c9d1db; }
.hud .where { margin-left: auto; color: var(--dim); }
.hud .relics { display: flex; gap: 3px; flex-wrap: wrap; }
.hud .relics img { width: 28px; height: 28px; cursor: help; }
.hud button { padding: 5px 9px; font-size: 13px; }
.bar { position: relative; height: 14px; background: #1a0d12; border: 1px solid #3a1b26; border-radius: 4px; overflow: hidden; min-width: 90px; }
.bar > i { position: absolute; inset: 0; right: auto; background: linear-gradient(90deg, #ff3d5c, #ff8a5c); transition: width .35s; }
.bar > b { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 13px; color: #fff; text-shadow: 0 1px 0 #000; }

/* tokens */
.tok { position: relative; display: inline-flex; flex-direction: column; align-items: center; width: 64px; font-size: 11px; text-align: center; gap: 2px; user-select: none; }
.tok img { width: 52px; height: 52px; }
.tok.up span::after { content: '+'; color: var(--b); }
.tok.dead { opacity: .3; }
.tok .mult { position: absolute; top: -4px; right: 2px; background: var(--d); color: #fff; font-size: 11px; border-radius: 8px; padding: 0 4px; }
.tok.new { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.3) translateY(-30px); opacity: 0 } to { transform: none; opacity: 1 } }
.tok.face { filter: drop-shadow(0 0 6px rgba(124,247,255,.5)); }
.tok.danger img { filter: drop-shadow(0 0 8px #ff5c5c); }
.tok.back img { filter: grayscale(1) brightness(.4); }
.card { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 12px; width: 170px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; cursor: pointer; transition: transform .1s, border-color .1s; }
.card:hover { transform: translateY(-3px); border-color: var(--a); }
.card.sel { border-color: var(--b); box-shadow: 0 0 16px rgba(255,207,110,.4); }
.card.sold, .card.off { opacity: .35; pointer-events: none; }
.card img { width: 64px; height: 64px; }
.card .nm { font-weight: 700; font-size: 15px; }
.card .ds { font-size: 13px; color: var(--dim); min-height: 34px; }
.card .pr { color: var(--b); font-weight: 700; }
.card .tok span { display: none; }
.rar1 { color: var(--a); } .rar2 { color: var(--d); }

/* fight */
.fight { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; gap: 10px; padding: 10px 14px; }
.foebox, .ixbox { display: flex; align-items: center; gap: 10px; position: relative; }
.foebox { grid-column: 2; grid-row: 1 / 3; flex-direction: column; justify-content: center; }
.ixbox { grid-column: 1; grid-row: 1; }
.foebox canvas { width: min(300px, 36vh); height: min(300px, 36vh); }
.ixbox canvas { width: 130px; height: 130px; }
.intent { background: rgba(40,10,20,.85); border: 2px solid var(--d); border-radius: 10px; padding: 8px 12px; font-size: 15px; text-align: center; max-width: 320px; }
.intent .dmg { color: var(--bad); font-weight: 900; font-size: 20px; }
.foename { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
.shield { color: var(--blk); font-weight: 700; }
.strength { color: var(--d); font-weight: 700; }
.table { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.line { min-height: 96px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; background: rgba(0,0,0,.25); }
.line:empty::before { content: 'Your line is empty. Draw a token.'; color: var(--dim); font-size: 13px; padding: 8px; }
.totals { display: flex; gap: 14px; font-size: 16px; flex-wrap: wrap; }
.totals .d { color: var(--bad); } .totals .k { color: var(--blk); } .totals .c { color: var(--b); } .totals .h { color: var(--good); }
.noise { display: flex; gap: 4px; align-items: center; }
.noise i { width: 26px; height: 16px; border: 1px solid #55606e; border-radius: 3px; background: #10151d; }
.noise i.on { background: #c9d1db; box-shadow: 0 0 8px #c9d1db; }
.noise i.over { background: var(--bad); border-color: var(--bad); }
.noise i.limit { border-style: dashed; border-color: var(--bad); background: transparent; }
.sightrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.next { display: flex; gap: 2px; padding: 6px; border-radius: 8px; border: 1px solid rgba(124,247,255,.4); background: rgba(10,40,50,.35); min-height: 80px; min-width: 80px; }
.odds { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.3); font-size: 13px; min-width: 190px; }
.odds .risk { font-size: 22px; font-weight: 900; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: #121a28; border-radius: 12px; padding: 1px 6px 1px 1px; font-size: 12px; }
.chip img { width: 20px; height: 20px; }
.controls { grid-column: 1 / 3; grid-row: 3; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.controls .hint { color: var(--dim); font-size: 12px; }
.controls button small { display: block; font-size: 12px; letter-spacing: 0; text-transform: none; margin-top: 2px; }
.drawbtn small.safe, .risk.safe { color: var(--good); } .drawbtn small.warn, .risk.warn { color: var(--b); } .drawbtn small.hot, .risk.hot { color: var(--bad); }
.stance[data-a=strike] { border-color: #ff6a5c; } .stance[data-a=brace] { border-color: var(--blk); }
.intent .sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
.coach { flex: 1 1 100%; order: -1; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: rgba(40, 32, 10, .92); border: 2px solid var(--b); border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; animation: pop .3s ease-out; }
.coach button { flex: none; padding: 6px 10px; font-size: 13px; }
.coach.lock { box-shadow: 0 0 0 9999px rgba(2, 4, 8, .55); position: relative; z-index: 5; }
.coach.info { border-color: var(--a); background: rgba(8, 30, 40, .92); justify-content: flex-start; }
.coach.info img { width: 34px; height: 34px; flex: none; }
.controls { align-items: flex-end; }
.stancecol { display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.stancecol .take { text-align: center; font-size: 12px; color: var(--bad); }
.tok.flip img { animation: flip .45s ease-out; }
@keyframes flip { 0% { transform: rotateY(90deg); filter: brightness(.2); } 60% { filter: brightness(1.6); } 100% { transform: none; filter: none; } }
.pbar { width: 140px; }
.label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

/* map */
.mapwrap { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 10px 14px; }
.mapscroll { flex: 1; min-height: 0; overflow-y: auto; border-radius: 12px; background: rgba(0,0,0,.3); border: 1px solid var(--line); }
.mapscroll svg { display: block; width: 100%; max-width: 560px; margin: 0 auto; }
.mapside { width: 250px; display: flex; flex-direction: column; gap: 10px; }
.node { cursor: default; }
.node.can { cursor: pointer; }
.node.can circle.ring { animation: ring 1.1s ease-in-out infinite; }
@keyframes ring { 50% { stroke-width: 5; } }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 3px 0; }

/* scenes */
.scene { width: min(960px, 96vw); aspect-ratio: 16 / 9; max-height: 56vh; border-radius: 12px; border: 1px solid var(--line); background: #000; }
.cut { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
.textbox { width: min(960px, 96vw); min-height: 120px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; font-size: 18px; line-height: 1.5; cursor: pointer; }
.speaker { color: var(--b); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
.modal { position: fixed; inset: 0; background: rgba(2,4,8,.8); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal .panel { max-width: 760px; width: 100%; max-height: 86vh; display: flex; flex-direction: column; gap: 10px; }
.grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 60; background: var(--panel2); border: 2px solid var(--b); border-radius: 10px; padding: 10px 16px; animation: toast 3.2s ease-in-out forwards; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -20px) } 10%, 85% { opacity: 1; transform: translate(-50%, 0) } 100% { opacity: 0; transform: translate(-50%, -10px) } }
input[type=text] { font-family: var(--font); font-size: 18px; background: #0b111c; color: var(--ink); border: 2px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 220px; }
input[type=range] { width: 200px; }
.opt { display: flex; gap: 8px; }
.opt button.on { border-color: var(--b); color: var(--b); }
.goal { display: flex; gap: 10px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
.goal .st { width: 26px; text-align: center; font-size: 18px; }
.goal.got .st { color: var(--good); }
.goal:not(.got) { color: var(--dim); }
.stats { display: grid; grid-template-columns: auto auto; gap: 4px 18px; text-align: left; }
kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-family: var(--font); font-size: 12px; }

@media (max-width: 760px) {
  .fight { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; padding: 8px; gap: 8px; overflow-y: auto; }
  .foebox { grid-column: 1; grid-row: 1; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
  .foebox .intent { order: 3; width: 100%; max-width: none; }
  .foebox canvas { width: 110px; height: 110px; }
  .foebox .foename, .foebox .bar { max-width: 200px; }
  .foename { font-size: 15px; }
  .ixbox { grid-row: 2; gap: 8px; }
  .ixbox canvas { width: 52px; height: 52px; }
  .ixbox .foename { display: none; }
  .line { min-height: 64px; padding: 4px; }
  .tok { width: 52px; font-size: 10px; }
  .tok img { width: 42px; height: 42px; }
  .next { min-height: 60px; min-width: 60px; }
  .sightrow { gap: 8px; }
  .odds { min-width: 0; flex: 1; }
  .odds .risk { font-size: 18px; }
  .totals { font-size: 14px; }
  .controls .hint { display: none; }
  .controls button.big { min-width: 0; flex: 1; padding: 10px 8px; font-size: 16px; }
  .stancecol { flex: 1; min-width: 0; }
  .stancecol button.big { width: 100%; }
  .coach { font-size: 13px; }
  .toast { top: 110px; }
  .table { grid-row: 3; }
  .controls { grid-column: 1; grid-row: 4; position: sticky; bottom: 0; background: rgba(5,8,14,.9); padding: 8px 0; }
  .mapwrap { flex-direction: column; }
  .mapside { width: 100%; flex-direction: row; flex-wrap: wrap; }
  .hud { gap: 8px; font-size: 13px; }
  .hud .where { margin-left: 0; width: 100%; order: -1; }
  .card { width: 140px; }
  .textbox { font-size: 16px; }
  .intent { font-size: 13px; }
  button.big { min-width: 120px; font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

:root { color-scheme: dark; }
#app { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
</style>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app"></div>
<div id="fx"></div>
<div id="scan"></div>
<script src="core.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>
