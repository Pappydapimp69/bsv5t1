<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colossus</title>
<style>
[hidden]{display:none!important}
/* Layout: HUD row, stage, action bar (a right-hand column on short landscape screens). Single dark look by choice. */
:root{color-scheme:dark;--bg:#11141b;--panel:#1a1f28;--ink:#eee9dd;--dim:#a9afbb;--accent:#ffcf6a;--line:#363e4c;--bad:#ff8f80;--good:#9be08a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "stage" "pad"}
#hud{grid-area:hud;min-width:0;background:var(--panel);border-bottom:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));padding-top:max(6px,env(safe-area-inset-top));min-height:50px}
#hud .l1{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
#hud b{color:var(--accent);font-weight:600}
#hud .warn{color:var(--bad);font-weight:600}
#hud .l2{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(8,10,14,.85);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:14px;pointer-events:none;max-width:92%;text-align:center;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#pad{grid-area:pad;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));touch-action:none}
.ab{position:relative;min-height:54px;min-width:0;overflow:hidden;border-radius:10px;border:2px solid #56627a;background:#252c39;color:var(--ink);font:600 14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px;touch-action:none}
.ab .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ab small{font-weight:400;font-size:11px;color:var(--dim);line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ab .k{position:absolute;top:2px;left:5px;font-size:10px;color:var(--accent);font-weight:700}
.ab.off{opacity:.55;border-style:dashed}
.ab:active{background:#34405a}
@media (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:minmax(0,1fr) 200px;grid-template-rows:auto 1fr;grid-template-areas:"hud hud" "stage pad"}
  #pad{grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;border-top:0;border-left:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) 8px}
}
.ov{position:absolute;inset:0;background:rgba(6,8,12,.86);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:480px;width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:28px;letter-spacing:.04em;color:var(--accent)}
.card h2{margin:0 0 8px;font-size:20px;color:var(--accent)}
.card p{margin:6px 0}
.card .dim{color:var(--dim);font-size:13px}
.mb{display:block;width:100%;min-height:48px;margin:6px 0;border-radius:10px;border:2px solid #56627a;background:#252c39;color:var(--ink);font:600 16px system-ui,sans-serif;text-align:left;padding:8px 12px}
.mb small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.mb.focus{border-color:var(--accent);background:#33405a;outline:none}
.mb.off{opacity:.6;border-style:dashed}
.mb:focus-visible{outline:2px solid var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<div id="app">
  <div id="hud"><div class="l1" id="hud1">Colossus</div><div class="l2" id="hud2"></div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div class="ov" id="ov"><div class="card" id="card"></div></div>
  </div>
  <div id="pad"></div>
</div>
<script>
'use strict';
// ================= rng and helpers =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(1);
const rr=(a,b)=>a+(b-a)*rnd();
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ================= constants =================
const C={
  MAP:9000,DT:1/30,TOWN_RING:3000,MONSTERS:70,CRYSTALS:50,TREES:900,
  G_SPEED:55,G_ACCEL:8,G_BRAKE:12,G_PIVOT:.25,G_LAT:4,G_STEP:2.4,FOOT_R:85,FOOT_SPREAD:110,CRUSH:100,CRUSH_TOWN:45,
  STOMP_CD:9,STOMP_WIND:1.1,STOMP_R:240,STOMP_DMG:55,STOMP_TOWN:60,
  SMASH_CD:10,SMASH_WIND:1.4,SMASH_REACH:540,SMASH_R:190,SMASH_DMG:90,SMASH_TOWN:150,
  SHAKE_CD:12,SHAKE_WIND:1.3,SHAKE_GRIP:42,SHAKE_BRACED:12,SHAKE_ANCHOR:.25,SHAKE_WEDGE:.35,
  SWIPE_CD:14,SWIPE_WIND:1.6,SWIPE_GRIP:60,SWIPE_CLEAR:.75,
  FALL_TIME:24,REGEN:1,
  H_SPEED:165,
  CLIMB_SPEED:3.6,LEDGE_SPEED:6,GRIP:100,GRIP_MOVE:3,GRIP_STILL:1,GRIP_LEDGE:20,GRIP_ROPE:8,JOLT:5,LUNGE:3,LUNGE_GRIP:15,FALL_G:14,
  WEDGE_DPS:4,WEDGE_MAX:3,CANNON_CD:3.5,CANNON_RANGE:1000,CANNON_TOWN:32,CANNON_HUM:20,CANNON_HP:60,
  COST:{anchor:20,wedge:30,cannon:70,potion:15,blade:60,gloves:50},
};
const TOWNS=[
  {name:'Ashford',col:'#6fb7ff',shape:'circle'},
  {name:'Brindle',col:'#ffaa45',shape:'square'},
  {name:'Corvel',col:'#d68cff',shape:'diamond'},
];

// ================= the giant's body: a climbable side-view grid, 10 ft a cell =================
const COLS=32,ROWS=200,FT=10;
const AIR=0,SMOOTH=1,HOLD=2,LEDGE=3,JOINT=4,HEART=5,SITE=6;
const JOINTS={
  kneeL:{name:'Left knee',r0:42,r1:45,c0:8,c1:12,max:1400},
  kneeR:{name:'Right knee',r0:42,r1:45,c0:19,c1:23,max:1400},
  elbowL:{name:'Left elbow',r0:118,r1:121,c0:2,c1:6,max:600},
  elbowR:{name:'Right elbow',r0:118,r1:121,c0:25,c1:29,max:600},
  neck:{name:'Neck',r0:167,r1:170,c0:13,c1:18,max:1000},
  heart:{name:'Heart-stone',r0:134,r1:139,c0:14,c1:17,max:6000},
};
const SITES=[{id:'shL',name:'left shoulder',r:166,c:4},{id:'shR',name:'right shoulder',r:166,c:27},{id:'armL',name:'left forearm',r:100,c:2},{id:'armR',name:'right forearm',r:100,c:29},{id:'crown',name:'crown',r:199,c:15}];
function region(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS)return null;
  if(r<=6&&c>=6&&c<=13)return'legL';
  if(r<=6&&c>=18&&c<=25)return'legR';
  if(r<=92&&c>=8&&c<=12)return'legL';
  if(r<=92&&c>=19&&c<=23)return'legR';
  if(r>=88&&r<=106&&c>=7&&c<=24)return'hips';
  if(r>=82&&r<=166&&c>=2&&c<=6)return'armL';
  if(r>=82&&r<=166&&c>=25&&c<=29)return'armR';
  if(r>=106&&r<=158&&c>=9&&c<=22)return'torso';
  if(r>=152&&r<=166&&c>=2&&c<=29)return'shoulders';
  if(r>=166&&r<=172&&c>=13&&c<=18)return'neck';
  if(r>=172&&r<=199&&c>=10&&c<=21)return'head';
  return null}
function buildBody(seed){
  const R=mulberry32(seed^0x9e3779b9),g=new Uint8Array(COLS*ROWS),reg=new Array(COLS*ROWS);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=region(r,c);reg[r*COLS+c]=k;if(k)g[r*COLS+c]=HOLD}
  // bare stone patches: no handholds, the climber must go around or lunge across
  for(let i=0;i<70;i++){const r0=Math.floor(R()*ROWS),c0=Math.floor(R()*COLS),rad=1+R()*2.4;
    for(let r=Math.floor(r0-rad);r<=r0+rad;r++)for(let c=Math.floor(c0-rad);c<=c0+rad;c++){if(r<0||r>=ROWS||c<0||c>=COLS)continue;
      if(g[r*COLS+c]===HOLD&&Math.hypot(r-r0,(c-c0)*1.3)<=rad)g[r*COLS+c]=SMOOTH}}
  // guaranteed routes through each limb
  const set=(r,c)=>{if(r>=0&&r<ROWS&&c>=0&&c<COLS&&g[r*COLS+c]===SMOOTH)g[r*COLS+c]=HOLD};
  const spine=(r0,r1,c0,c1)=>{let c=c0+Math.floor(R()*(c1-c0+1));for(let r=r0;r<=r1;r++){set(r,c);if(R()<.3){const n=clamp(c+(R()<.5?-1:1),c0,c1);set(r,n);c=n}}};
  const belt=(c0,c1,r0,r1)=>{let r=r0+Math.floor(R()*(r1-r0+1));for(let c=c0;c<=c1;c++){set(r,c);if(R()<.3){const n=clamp(r+(R()<.5?-1:1),r0,r1);set(n,c);r=n}}};
  spine(0,106,8,12);spine(0,106,19,23);spine(106,166,9,22);spine(106,166,11,20);spine(82,166,2,6);spine(82,166,25,29);spine(158,199,14,17);
  belt(7,24,94,104);belt(2,29,154,164);
  // ledges: any top surface with air above, plus carved belts on the shins, wrists and ribs
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const i=r*COLS+c;if(!g[i])continue;const k=reg[i];
    const airAbove=r===ROWS-1||!g[(r+1)*COLS+c];
    if(airAbove||(r===46&&(k==='legL'||k==='legR'))||(r===90&&(k==='armL'||k==='armR'))||(r===130&&k==='torso'))g[i]=LEDGE}
  for(const id in JOINTS){const j=JOINTS[id];for(let r=j.r0;r<=j.r1;r++)for(let c=j.c0;c<=j.c1;c++)if(g[r*COLS+c])g[r*COLS+c]=id==='heart'?HEART:JOINT}
  for(const s of SITES)g[s.r*COLS+s.c]=SITE;
  // repair: everything worth reaching must connect to the feet
  for(let pass=0;pass<4;pass++){const seen=floodFrom(g,[[1,9],[1,20]]);let fixed=0;
    for(let i=0;i<g.length;i++)if(g[i]>=LEDGE&&!seen[i]){let r=Math.floor(i/COLS),c=i%COLS;while(r>0&&!seen[r*COLS+c]){r--;if(g[r*COLS+c]===SMOOTH){g[r*COLS+c]=HOLD;fixed++}else if(!g[r*COLS+c])break}}
    if(!fixed)break}
  const vari=new Uint8Array(COLS*ROWS);for(let i=0;i<vari.length;i++)vari[i]=Math.floor(R()*256);
  return{g,reg,vari}}
function floodFrom(g,starts){const seen=new Uint8Array(g.length),q=[];
  for(const[r,c]of starts){const i=r*COLS+c;if(g[i]>=HOLD){seen[i]=1;q.push(i)}}
  while(q.length){const i=q.pop(),r=Math.floor(i/COLS),c=i%COLS;
    for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr<0||nr>=ROWS||nc<0||nc>=COLS)continue;const j=nr*COLS+nc;if(!seen[j]&&g[j]>=HOLD){seen[j]=1;q.push(j)}}}
  return seen}
function cellT(x,y){const c=Math.floor(x),r=Math.floor(y);if(r<0||r>=ROWS||c<0||c>=COLS)return AIR;return S.body.g[r*COLS+c]}
const climbable=(x,y)=>cellT(x,y)>=HOLD;
const restful=t=>t===LEDGE||t===SITE;
function jointAt(x,y){const r=Math.floor(y),c=Math.floor(x);for(const id in JOINTS){const j=JOINTS[id];if(r>=j.r0&&r<=j.r1&&c>=j.c0&&c<=j.c1)return id}return null}
function siteAt(x,y){const r=Math.floor(y),c=Math.floor(x);return S.sites.find(s=>s.r===r&&s.c===c)||null}
// breadth-first path over climbable cells; returns [[r,c],...] from start (exclusive) to a goal cell
function bfs(r0,c0,isGoal,maxN){const g=S.body.g,prev=new Int32Array(g.length).fill(-1),q=[r0*COLS+c0];prev[q[0]]=q[0];let head=0,found=-1;
  while(head<q.length&&head<(maxN||1e9)){const i=q[head++],r=Math.floor(i/COLS),c=i%COLS;if(head>1&&isGoal(r,c)){found=i;break}
    for(const[dr,dc]of[[1,0],[0,1],[0,-1],[-1,0]]){const nr=r+dr,nc=c+dc;if(nr<0||nr>=ROWS||nc<0||nc>=COLS)continue;const j=nr*COLS+nc;if(prev[j]<0&&g[j]>=HOLD){prev[j]=i;q.push(j)}}}
  if(found<0)return null;const path=[];let i=found;while(i!==q[0]){path.push([Math.floor(i/COLS),i%COLS]);i=prev[i]}return path.reverse()}

// ================= save =================
const SAVE_KEY='colossus.v1';
let save={v:1,giantWins:0,giantLosses:0,humanWins:0,humanLosses:0,sound:true};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&s.v===1)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
const reducedMotion=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();

// ================= audio =================
let actx=null,sndBudget=0;
function unlockAudio(){if(actx||!save.sound)return;try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(actx&&actx.state==='suspended')actx.resume()}
function tone(f,dur,type,vol,slide){if(!actx||!save.sound)return;const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02)}
function sfx(k,near){if(near===false||sndBudget>6)return;sndBudget++;
  ({step:()=>tone(52,.4,'sine',.35,28),stomp:()=>tone(70,.7,'triangle',.5,25),smash:()=>tone(90,.6,'sawtooth',.25,30),hit:()=>tone(330,.08,'square',.08,160),
    coin:()=>tone(880,.12,'sine',.12,1320),cannon:()=>tone(140,.25,'square',.12,60),warn:()=>tone(440,.3,'triangle',.16,300),build:()=>tone(600,.15,'triangle',.15,900),
    fall:()=>tone(500,.6,'sine',.12,120),grip:()=>tone(240,.12,'square',.06,200)}[k]||(()=>{}))()}

// ================= state =================
let S=null;
function newGame(role,seed){
  seed=seed>>>0;rnd=mulberry32(seed);
  const M=C.MAP,cx=M/2,cy=M/2;
  const towns=TOWNS.map((t,i)=>{const a=-Math.PI/2+i*Math.PI*2/3;return{i,name:t.name,col:t.col,shape:t.shape,x:cx+Math.cos(a)*C.TOWN_RING,y:cy+Math.sin(a)*C.TOWN_RING,r:150,hp:3600,max:3600,alive:true}});
  const joints={};for(const id in JOINTS)joints[id]={hp:JOINTS[id].max,max:JOINTS[id].max,crip:false,wedges:[]};
  const g={x:cx,y:cy,ang:-Math.PI/2,v:0,tx:null,ty:null,fallen:0,dead:false,wind:null,cd:{stomp:2,smash:3,shake:5,swipe:6},
    feet:[{x:cx-C.FOOT_SPREAD,y:cy,air:0},{x:cx+C.FOOT_SPREAD,y:cy,air:0}],phase:0,target:null,botT:0,sway:0};
  S={role,seed,t:0,towns,g,joints,body:buildBody(seed),sites:SITES.map(s=>({...s,build:null})),anchors:[],
    humans:[],monsters:[],crystals:[],trees:[],prints:[],shots:[],fx:[],over:null,nextId:1,
    cam:{x:cx,y:cy,zoom:1,czoom:1},autoplay:false};
  const roles=['warden','raider','warden'];
  for(let ti=0;ti<3;ti++)for(let k=0;k<3;k++){const you=role==='human'&&ti===0&&k===0;S.humans.push(mkHuman(ti,you,you?'you':roles[k]))}
  S.you=role==='human'?S.humans[0]:null;
  for(let i=0;i<C.TREES;i++){const x=rr(0,M),y=rr(0,M);if(S.towns.some(t=>Math.hypot(t.x-x,t.y-y)<260))continue;S.trees.push({x,y,r:rr(14,34)})}
  for(let i=0;i<C.MONSTERS;i++)spawnMonster();
  for(let i=0;i<C.CRYSTALS;i++)spawnCrystal();
  if(S.you){S.cam.x=S.you.x;S.cam.y=S.you.y}
  return S}
function mkHuman(ti,you,role){const t=S.towns[ti];
  return{id:S.nextId++,town:ti,you,role,x:t.x+rr(-60,60),y:t.y+rr(-60,60),hp:100,max:100,atk:10,lvl:1,xp:0,gold:you?40:30,
    kits:{anchor:you?3:0,wedge:0,cannon:0},potions:1,gloves:0,quest:null,mode:'ground',leg:0,cl:null,grip:C.GRIP,cd:0,dead:0,lastMove:-9,
    tx:null,ty:null,goal:null,think:0,face:0,swing:0,botClimb:null,rest:false,
    name:you?'You':TOWNS[ti].name+' '+role}}
function maxGrip(h){return C.GRIP+h.gloves*25+(h.lvl-1)*5}
function spawnMonster(){const M=C.MAP;let x,y,ok=false;
  for(let k=0;k<30&&!ok;k++){x=rr(150,M-150);y=rr(150,M-150);ok=S.towns.every(t=>Math.hypot(t.x-x,t.y-y)>520)}
  const troll=rnd()<.25;S.monsters.push({id:S.nextId++,kind:troll?'troll':'wolf',x,y,hx:x,hy:y,hp:troll?90:30,max:troll?90:30,atk:troll?13:6,gold:troll?22:8,xp:troll?30:12,r:troll?22:13,cd:0})}
function spawnCrystal(){const M=C.MAP;S.crystals.push({id:S.nextId++,x:rr(200,M-200),y:rr(200,M-200)})}
function aliveTowns(){return S.towns.filter(t=>t.alive)}
function homeOf(h){const t=S.towns[h.town];if(t.alive)return t;let b=null,bd=1e9;for(const o of aliveTowns()){const d=dist(o,h);if(d<bd){bd=d;b=o}}return b}

// ================= messages =================
let toastT=0;const toastEl=document.getElementById('toast');
function toast(s){toastEl.textContent=s;toastEl.classList.add('on');toastT=2.6}
function announce(s){toast(s)}
function sayTo(h,s){if(h&&h.you)toast(s)}

// ================= the giant on the ground =================
function fwd(g){return{x:Math.cos(g.ang),y:Math.sin(g.ang)}}
function giantSpeed(){let s=C.G_SPEED;if(S.joints.kneeL.crip)s*=.5;if(S.joints.kneeR.crip)s*=.5;return s}
// momentum: it gathers speed slowly, needs room to stop, and turns wider the faster it walks
function giantMotion(m,dt,tx,ty,vmax){let want=0,da=0;
  if(tx!=null){const dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy);da=((Math.atan2(dy,dx)-m.ang+Math.PI*3)%(Math.PI*2))-Math.PI;
    const vArrive=Math.sqrt(2*C.G_BRAKE*Math.max(0,d-40));const sa=Math.abs(Math.sin(da));
    const vTurn=Math.abs(da)>Math.PI/2?0:sa<.01?vmax:Math.sqrt(C.G_LAT*d/(2*sa));want=Math.min(vmax,vArrive,vTurn)}
  if(m.v<want)m.v=Math.min(want,m.v+C.G_ACCEL*dt);else m.v=Math.max(want,m.v-C.G_BRAKE*dt);
  const wmax=Math.min(C.G_PIVOT,C.G_LAT/Math.max(m.v,1));m.ang+=clamp(da,-wmax*dt,wmax*dt);
  m.x=clamp(m.x+Math.cos(m.ang)*m.v*dt,300,C.MAP-300);m.y=clamp(m.y+Math.sin(m.ang)*m.v*dt,300,C.MAP-300)}
function canGiant(k){const g=S.g,J=S.joints;

function killHuman(h,why){h.hp=0;h.dead=6;h.mode='ground';h.cl=null;h.tx=h.ty=null;h.goal=null;h.botClimb=null;h.gold=Math.floor(h.gold*.75);

function stepGiant(dt){const g=S.g;if(g.dead)return;
  for(const k in g.cd)g.cd[k]=Math.max(0,g.cd[k]-dt);

    if(g.fallen<=0&&j.hp<j.max&&!g.dead)j.hp=Math.min(j.max,j.hp+C.REGEN*dt*(id==='heart'?2:1)*(j.wedges.length?.5:1));

  else{let worst=-1,wd=0;g.feet.forEach((ft,i)=>{const s=i?1:-1,ix=g.x+side.x*s*C.FOOT_SPREAD,iy=g.y+side.y*s*C.FOOT_SPREAD,d=Math.hypot(ft.x-ix,ft.y-iy);if(d>wd){wd=d;worst=i}});

function cannonTarget(town){const g=S.g;let best=null,bd=C.CANNON_RANGE;

function humanCtx(h){

    X:{l:'Town',why:t?null:'Go inside a town'},Y:{l:'Potion ('+h.potions+')',why:!h.potions?'No potions':h.hp>=h.max?'Full health':null}}}
function humanAct(h,slot,dir){const c=humanCtx(h)[slot];if(c.why){sayTo(h,c.why);return false}

function botHuman(h,dt){const mv={x:0,y:0};if(h.dead)return mv;const g=S.g;h.think-=dt;

function pickGoal(h){const g=S.g,home=homeOf(h);if(!home)return null;

function drawArrowToGiant(){const g=S.g;if(g.dead)return;const k=worldScale(),x=W/2+(g.x-S.cam.x)*k,y=H/2+(g.y-S.cam.y)*k;if(x>0&&x<W&&y>0&&y<H)return;
  const a=Math.atan2(y-H/2,x-W/2),r=Math.min(W,H)/2-28,px=W/2+Math.cos(a)*r,py=H/2+Math.sin(a)*r;
  ctx.save();ctx.translate(px,py);ctx.rotate(a);ctx.fillStyle='#ffcf6a';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-10);ctx.lineTo(-8,10);ctx.closePath();ctx.fill();ctx.restore();
  ctx.font='600 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffcf6a';ctx.fillText('giant '+Math.round(dist(g,S.cam))+'',px,py+(py<H/2?24:-16))}
// the giant player's view of its own body: who is climbing where
function renderBodyPanel(){const ph=Math.min(H-16,420),px=ph/ROWS,pw=COLS*px,x0=W-pw-12,y0=8;
  ctx.fillStyle='rgba(8,10,14,.72)';ctx.fillRect(x0-6,y0-4,pw+12,ph+8);
  ctx.imageSmoothingEnabled=false;ctx.drawImage(bodyTexture(),x0,y0,pw,ph);
  for(const id in JOINTS){const J=JOINTS[id],j=S.joints[id];ctx.fillStyle=j.crip?'#555':id==='heart'?'#ff4d5e':'#ff9a4a';ctx.globalAlpha=.4+.6*(j.hp/j.max);ctx.fillRect(x0+J.c0*px,y0+(ROWS-1-J.r1)*px,(J.c1-J.c0+1)*px,(J.r1-J.r0+1)*px);ctx.globalAlpha=1}
  for(const h of climbers()){ctx.fillStyle=TOWNS[h.town].col;shapePath(ctx,x0+h.cl.x*px,y0+(ROWS-h.cl.y)*px,Math.max(3,px*1.6),TOWNS[h.town].shape);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke()}
  ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#eee9dd';ctx.fillText(climbers().length+' climbing',x0+pw/2,y0+ph-4)}
function renderClimb(){const h=S.you,cl=h.cl,g=S.g;
  const px=Math.max(8,Math.min(W/(COLS+6),H/26))*S.cam.czoom;climbCam.px=px;
  const fitsW=COLS*px<=W-20;climbCam.x+=((fitsW?COLS/2:clamp(cl.x,W/2/px-1,COLS-W/2/px+1))-climbCam.x)*.15;
  climbCam.y+=((cl.y+3)-climbCam.y)*.12;if(Math.abs(climbCam.y-cl.y)>40)climbCam.y=cl.y;
  const toX=c=>W/2+(c-climbCam.x)*px,toY=r=>H*.55-(r-climbCam.y)*px;
  // a lifted foot draws its leg up from the thigh: the knee bends and climbers on it ride up
  const lift=g.feet.map(f=>f.air>0&&g.fallen<=0?Math.sin((1-f.air/f.dur)*Math.PI)*6:0),THIGH=82;
  const ly=(c,r)=>{const L=r<THIGH?lift[c<COLS/2?0:1]:0;return L?L+r*(THIGH-L)/THIGH:r},Y=(c,r)=>toY(ly(c,r));
  // sky darkens with height, ground below
  const alt=clamp(climbCam.y/ROWS,0,1);const sk=ctx.createLinearGradient(0,0,0,H);sk.addColorStop(0,`rgb(${60-alt*30},${96-alt*40},${150-alt*40})`);sk.addColorStop(1,`rgb(${150-alt*50},${170-alt*50},${190-alt*40})`);ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);
  const gy=toY(0);if(gy<H){ctx.fillStyle='#3d5a35';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#2a4326';for(let i=0;i<30;i++){const x=((i*137+Math.floor(S.g.x))%Math.max(1,W));ctx.fillRect(x,gy+4+(i%5)*6,14,4)}}
  // walking sway: the body leans with each stride, more toward the top
  const sway=g.fallen>0?0:Math.sin(g.sway*Math.PI)*.035*(g.v/C.G_SPEED);
  ctx.save();ctx.translate(0,gy);ctx.transform(1,0,-sway,1,0,0);ctx.translate(0,-gy);
  // clouds drift past at half the camera's rate, so height reads as distance
  for(let i=0;i<14;i++){const cr=50+i*11,cx=((i*53+S.t*(1+i%3)*.4)%(COLS+40))-20,yy=H*.55-(cr-climbCam.y)*px*.5;if(yy<-40||yy>H+40)continue;ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(W/2+(cx-COLS/2)*px*.6,yy,px*(4+i%4),px*1.3,0,0,7);ctx.fill()}
  ctx.imageSmoothingEnabled=false;const tex=bodyTexture(),P=tex.width/COLS;
  ctx.drawImage(tex,0,0,COLS*P,(ROWS-THIGH)*P,toX(0),toY(ROWS),COLS*px,(ROWS-THIGH)*px);
  for(const i of[0,1]){const c0=i?COLS/2:0;ctx.drawImage(tex,c0*P,(ROWS-THIGH)*P,COLS/2*P,THIGH*P,toX(c0),toY(THIGH),COLS/2*px,(THIGH-lift[i])*px)}
  if(g.wind&&g.wind.k==='swipe'){const left=g.wind.side==='L',p=1-g.wind.t/g.wind.dur;ctx.fillStyle=`rgba(255,60,40,${.12+.25*p})`;ctx.fillRect(left?toX(0):toX(COLS/2),toY(ROWS),COLS/2*px,(ROWS-30)*px);
    const hx=left?toX(-6+6*p):toX(COLS+6-6*p);ctx.fillStyle='rgba(130,136,150,.9)';ctx.beginPath();ctx.ellipse(hx,Y(cl.x,cl.y),px*4,px*7,0,0,7);ctx.fill()}
  for(const id in JOINTS){const J=JOINTS[id],j=S.joints[id];const x=toX(J.c0),y=Y(J.c0,J.r1+1),w=(J.c1-J.c0+1)*px,hh=Y(J.c0,J.r0)-y;
    ctx.fillStyle=j.crip?'rgba(60,60,60,.7)':id==='heart'?`rgba(255,77,94,${.55+.25*Math.sin(S.t*4)})`:'rgba(255,150,70,.55)';ctx.fillRect(x,y,w,hh);
    ctx.strokeStyle=j.crip?'#777':id==='heart'?'#ffb0b8':'#ffcf6a';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,hh-2);
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x,y-8,w,5);ctx.fillStyle=id==='heart'?'#ff4d5e':'#ffcf6a';ctx.fillRect(x,y-8,w*j.hp/j.max,5);
    j.wedges.forEach((wd,i)=>{ctx.fillStyle='#222';ctx.beginPath();const wx=x+(i+1)*w/4;ctx.moveTo(wx-4,y+hh*.3);ctx.lineTo(wx+4,y+hh*.3);ctx.lineTo(wx,y+hh*.8);ctx.closePath();ctx.fill();ctx.strokeStyle=TOWNS[wd.town].col;ctx.stroke()});
    if(Math.abs(J.r0-climbCam.y)<40){ctx.font='600 12px system-ui';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;const tx=x+w+4,ty=y+hh/2+4;ctx.strokeText(JOINTS[id].name,tx,ty);ctx.fillText(JOINTS[id].name,tx,ty)}}
  for(const s of S.sites){const x=toX(s.c)+px/2,y=toY(s.r)+px/2;ctx.strokeStyle='#ffcf6a';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(x+Math.cos(a)*px*.8,y+Math.sin(a)*px*.8)}ctx.closePath();ctx.stroke();
    if(s.build){ctx.fillStyle=TOWNS[s.build.town].col;ctx.fillRect(x-px*.7,y-px*1.2,px*1.4,px*.9);ctx.fillStyle='#222';ctx.fillRect(x,y-px*1.05,px*1.3,px*.45)}}
  for(const a of S.anchors){const x=toX(a.c)+px/2,y=Y(a.c,a.r+.5);ctx.strokeStyle=TOWNS[a.town].col;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,px*.35,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+px*.35);ctx.lineTo(x,y+px*1.4);ctx.stroke()}
  if(cl.path){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(toX(cl.x),Y(cl.x,cl.y));for(const[r,c]of cl.path)ctx.lineTo(toX(c+.5),Y(c,r+.5));ctx.stroke();ctx.setLineDash([])}
  for(const f of S.fx)if(f.k==='cellmark'){ctx.strokeStyle='#fff';ctx.globalAlpha=1-f.t/f.life;ctx.strokeRect(toX(f.c),Y(f.c,f.r+1),px,px);ctx.globalAlpha=1}
  for(const o of climbers()){const x=toX(o.cl.x),y=Y(o.cl.x,o.cl.y),T=TOWNS[o.town];if(y<-20||y>H+20)continue;
    ctx.fillStyle=T.col;shapePath(ctx,x,y-px*.2,px*.55,T.shape);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle='#111';ctx.beginPath();ctx.moveTo(x-px*.5,y-px*.6);ctx.lineTo(x-px*.8,y-px*1.1);ctx.moveTo(x+px*.5,y-px*.6);ctx.lineTo(x+px*.8,y-px*1.1);ctx.stroke();
    if(o.you){const f=clamp(o.grip/maxGrip(o),0,1);ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.arc(x,y-px*.2,px*1.2,0,7);ctx.stroke();
      ctx.strokeStyle=f<.25?'#ff8f80':f<.5?'#ffcf6a':'#9be08a';ctx.beginPath();ctx.arc(x,y-px*.2,px*1.2,-Math.PI/2,-Math.PI/2+f*Math.PI*2);ctx.stroke()}}
  ctx.restore();
  // height gauge with ledges and joints marked
  const gx=W-18,gt=16,gb=H-16;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(gx-6,gt-4,14,gb-gt+8);
  for(const id in JOINTS){const J=JOINTS[id];ctx.fillStyle=id==='heart'?'#ff4d5e':'#ff9a4a';ctx.fillRect(gx-4,gb-(J.r1/ROWS)*(gb-gt),10,3)}
  ctx.fillStyle='#fff';ctx.fillRect(gx-7,gb-(cl.y/ROWS)*(gb-gt)-2,16,4);
  ctx.font='600 13px system-ui';ctx.textAlign='right';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;const ht=Math.round(cl.y*FT)+' ft';ctx.strokeText(ht,gx-12,gb-(cl.y/ROWS)*(gb-gt)+4);ctx.fillText(ht,gx-12,gb-(cl.y/ROWS)*(gb-gt)+4);
  if(g.wind&&(g.wind.k==='shake'||g.wind.k==='swipe')){ctx.strokeStyle=`rgba(255,90,70,${.5+.5*Math.sin(S.t*20)})`;ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8);
    ctx.font='700 20px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;const s=g.wind.k==='shake'?'BRACE: hold still':'HAND INCOMING: '+(g.wind.side==='L'?'left':'right')+' side';ctx.strokeText(s,W/2,48);ctx.fillText(s,W/2,48)}
  if(g.fallen>0){ctx.font='700 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffcf6a';ctx.strokeStyle='#000';ctx.lineWidth=4;const s='The giant is down: '+Math.ceil(g.fallen)+' s to strike the Heart-stone';ctx.strokeText(s,W/2,H-20);ctx.fillText(s,W/2,H-20)}}

// ================= HUD =================
const hud1=document.getElementById('hud1'),hud2=document.getElementById('hud2');let hudSig='';
function paintHud(){if(!S){if(hudSig!=='t'){hudSig='t';hud1.innerHTML='<b>Colossus</b>';hud2.textContent='A giant, three towns, and the people who climb it.'}return}
  let a,b;
  if(S.role==='giant'){const J=S.joints,g=S.g,pc=id=>Math.ceil(J[id].hp/J[id].max*100)+'%'+(J[id].crip?' crippled':'');
    a=`<span>Heart <b>${pc('heart')}</b></span><span>Knees <b>${pc('kneeL')}</b> / <b>${pc('kneeR')}</b></span><span>Elbows <b>${pc('elbowL')}</b> / <b>${pc('elbowR')}</b></span><span>Neck <b>${pc('neck')}</b></span><span>Climbers <b>${climbers().length}</b></span>`;
    b=g.fallen>0?'You are down for '+Math.ceil(g.fallen)+' s. They are at your heart.':S.towns.map(t=>t.name+' '+(t.alive?Math.ceil(t.hp/t.max*100)+'%':'ruined')).join(' · ')}
  else{const h=S.you;
    a=`<span>HP <b class="${h.hp<h.max*.3?'warn':''}">${Math.ceil(h.hp)}/${h.max}</b></span>`+(h.mode==='climb'?`<span>Grip <b class="${h.grip<maxGrip(h)*.25?'warn':''}">${Math.ceil(Math.max(0,h.grip))}</b></span><span>Height <b>${Math.round(h.cl.y*FT)} ft</b></span>`:`<span>Lv <b>${h.lvl}</b></span>`)+
      `<span>Gold <b>${h.gold}</b></span><span>Anchors <b>${h.kits.anchor}</b> Wedges <b>${h.kits.wedge}</b> Cannons <b>${h.kits.cannon}</b></span>`;
    const q=h.quest;b=(q?(q.done?'Quest done: return to town. ':'Quest: '+q.text+' ('+Math.min(q.n,q.need)+'/'+q.need+'). '):'No quest: visit a town board. ')+
      (h.mode==='climb'?(restful(cellT(h.cl.x,h.cl.y))?'On a ledge: grip refills while you rest.':'Heart-stone at 1340 ft. Knees at 430 ft.'):'Ashford '+Math.ceil(S.towns[0].hp/S.towns[0].max*100)+'%'+(S.g.fallen>0?' · THE GIANT IS DOWN':''))}
  const sig=a+b;if(sig!==hudSig){hudSig=sig;hud1.innerHTML=a;hud2.textContent=b}}

// ================= loop =================
let acc=0,last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;pollPad();
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on')}
  if(S&&!menu&&!S.over){acc+=dt;while(acc>=C.DT){step(C.DT);acc-=C.DT}}else acc=0;
  if(S){let z=0;if(keys.has('KeyQ'))z-=1;if(keys.has('KeyE'))z+=1;z-=padZoom;if(z)zoomBy(Math.exp(z*dt*1.2));S.cam.czoom+=(S.cam.zoom-S.cam.czoom)*Math.min(1,dt*8);
    const focus=S.role==='giant'?S.g:(S.you.mode==='climb'?S.g.feet[S.you.leg]:S.you);S.cam.x+=(focus.x-S.cam.x)*Math.min(1,dt*5);S.cam.y+=(focus.y-S.cam.y)*Math.min(1,dt*5)}
  shakeA*=Math.pow(.02,dt);if(shakeA<.3)shakeA=0;
  render();paintHud();paintButtons();requestAnimationFrame(frame)}
// test hook: run whole matches without the screen
window.__col={newGame:(role,seed)=>{const s=newGame(role,seed);s.headless=true;return s},start,step:n=>{for(let i=0;i<n&&S&&!S.over;i++)step(C.DT)},get S(){return S},C,JOINTS,bfs,set autoplay(v){if(S)S.autoplay=v}};
openTitle();requestAnimationFrame(frame);
</script>
