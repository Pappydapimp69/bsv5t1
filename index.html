<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colossus</title>
<style>
[hidden]{display:none!important}
/* One interface. Every size is in rem, and rem is set from the shorter screen side, so text and buttons grow on big screens.
   Zones: top panel (giant, dusk, towns' feeling) + goal line + feed; bottom-left your stats; actions as a thumb arc (touch), key plates (keys) or A/B/X/Y diamond (pad), chosen by body[data-dev]. */
:root{color-scheme:dark;--bg:#11141b;--panel:#1a1f28;--ink:#eee9dd;--dim:#a9afbb;--accent:#ffcf6a;--line:#363e4c;--bad:#ff8f80;--good:#9be08a;--glass:rgba(14,16,20,.64);--sl:max(.7rem,env(safe-area-inset-left));--sr:max(.7rem,env(safe-area-inset-right));--sb:max(.7rem,env(safe-area-inset-bottom))}
*{box-sizing:border-box}
html{font-size:clamp(15px,calc(12px + .95vmin),36px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:1rem/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:1rem}
body.titling #top,body.titling #stats,body.titling #pad{visibility:hidden}
/* top: giant panel, goal line, toast and feed, centred */
#top{position:absolute;z-index:6;left:0;right:0;top:max(.6rem,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:.45rem;pointer-events:none;padding:0 var(--sr) 0 var(--sl)}
#hud{width:min(100%,34rem);display:flex;gap:.8rem;align-items:center;padding:.5rem .8rem}
#gfig{width:1.9rem;height:3.4rem;flex:none}
#hud .gi{flex:1;min-width:0;display:flex;flex-direction:column;gap:.35rem}
#hud .gr{display:flex;justify-content:space-between;gap:.6rem;font-size:.95rem;font-weight:700}
#hud .gr #gd{color:#f0a050;white-space:nowrap}
#gbar{position:relative;height:.5rem;border-radius:.3rem;background:linear-gradient(90deg,#4a7a54,#b9a35a 60%,#b04a3a);margin:.15rem 0}
#gbar i{margin-left:var(--o,0);position:absolute;top:-.3rem;width:.28rem;height:1.1rem;border-radius:.1rem;border:1px solid rgba(0,0,0,.6);transform:translateX(-50%)}
#hud .gs{font-size:.8rem;color:rgba(251,246,234,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side{position:absolute;z-index:6;right:var(--sr);top:5rem;width:min(17rem,46vw);display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;pointer-events:none}
#goal{background:rgba(14,16,20,.62);padding:.3rem .7rem;border-radius:.7rem;font-size:.85rem;font-weight:600;max-width:100%;text-align:right;border-left:3px solid var(--accent)}
#goal:empty{display:none}
#goal .k{color:var(--accent);font-weight:700}
body.film #top,body.film #stats,body.film #pad,body.film #side{visibility:hidden}
#hud .gs{transition:opacity .8s}#hud .gs.quiet{opacity:0}#hud .gs.pulse{color:var(--accent)}
#gfig circle.flash{animation:cflash .45s 6}@keyframes cflash{50%{stroke:#ffd27a;stroke-width:7}}
#hud2{max-width:min(94%,40rem);padding:.4rem .9rem;border-radius:1rem;background:rgba(14,16,20,.62);font-size:.95rem;line-height:1.25;text-align:center}
#hud2:empty{display:none}
#hud2 .k{color:var(--accent);font-weight:700}
#toast{display:none;background:rgba(8,10,14,.85);color:var(--ink);padding:.35rem .8rem;border-radius:.6rem;font-size:.9rem;max-width:92%;text-align:center}
#toast.on{display:block}
#feed{display:flex;flex-direction:column;gap:.25rem;align-items:flex-end;width:100%}
#feed div{background:rgba(10,8,12,.7);color:var(--ink);padding:.25rem .6rem;border-radius:.5rem;font-size:.78rem;text-align:right;max-width:100%;transition:opacity .4s}
#feed div b{color:var(--accent)}
/* The stat strip leaves a separate lane for the action controls. */
body{--action-width:min(19rem,44vw)}
#stats{position:absolute;z-index:6;left:var(--sl);bottom:var(--sb);display:flex;align-items:flex-end;gap:.25rem;width:max-content;max-width:min(19rem,calc(100% - var(--sl) - var(--sr) - var(--action-width) - .5rem));pointer-events:none}
#hud1{display:flex;flex-wrap:wrap;gap:.18rem .22rem;align-items:center;min-width:0}
#stats .chip{gap:.2rem;min-height:1.25rem;padding:.08rem .34rem;border-radius:.32rem;background:rgba(14,16,20,.84);font-size:.76rem}
#stats .chip .bar{height:.12rem}
#stats-menu{flex:none;display:grid;place-items:center;width:1.4rem;height:1.4rem;padding:0;border:1px solid var(--line);border-radius:.34rem;background:rgba(14,16,20,.84);color:var(--ink);font:700 .7rem system-ui;pointer-events:auto;cursor:pointer}
#stats-menu:hover,#stats-menu:focus-visible{border-color:var(--accent)}
body[data-dev=touch] #stats-menu{width:1.85rem;height:1.85rem}
.controls-hint kbd{display:inline-block;padding:0 .3rem;border-radius:.25rem;background:#f3efe4;color:#1a1a1a;font:700 .75rem system-ui}
.chip{position:relative;display:inline-flex;align-items:center;gap:.3rem;min-height:1.6rem;padding:.1rem .5rem;border-radius:.45rem;background:rgba(35,42,54,.85);border:1px solid var(--line);font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}.chip .warn{color:var(--bad)}
.chip .bar{position:absolute;left:0;bottom:0;height:.2rem;background:var(--good)}.chip .bar.low{background:var(--bad)}.chip .bar.mid{background:var(--accent)}
.chip.goal{background:#2e3524;border-color:#55623f}
.card .meta{display:flex;flex-wrap:wrap;gap:.3rem .4rem;margin:.3rem 0 .6rem}
/* actions */
#pad{position:absolute;z-index:6;right:var(--sr);bottom:var(--sb);pointer-events:none;touch-action:none}
.ab{position:absolute;pointer-events:auto;min-width:0;overflow:hidden;border:2px solid #56627a;background:rgba(28,30,38,.9);color:var(--ink);font:600 .9rem system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.15rem;touch-action:none;text-align:center}
.ab .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ab small{font-weight:500;font-size:.62rem;color:var(--dim);line-height:1.1;max-width:100%;overflow:hidden}
.ab .k{display:none;color:var(--accent);font-weight:700}
.ab.off{opacity:.6;border-style:dashed}
.ab:active{background:#34405a}
/* touch: a thumb arc in the bottom-right corner, the main action nearest the thumb */
body[data-dev=touch]{--action-width:12.8rem}
body[data-dev=touch] #pad{width:var(--action-width);height:var(--action-width)}
body[data-dev=touch] .ab{width:5rem;height:5rem;border-radius:50%}
body[data-dev=touch] .ab[data-s=A]{right:0;bottom:0;width:6.6rem;height:6.6rem;border-color:var(--accent);font-size:1.05rem}
body[data-dev=touch] .ab[data-s=B]{right:7.5rem;bottom:.2rem}
body[data-dev=touch] .ab[data-s=X]{right:6.3rem;bottom:7rem}
body[data-dev=touch] .ab[data-s=Y]{right:.2rem;bottom:7.6rem}
@media (orientation:landscape) and (max-height:520px){
  body[data-dev=touch]{--action-width:11.4rem}
  body[data-dev=touch] .ab{width:4.4rem;height:4.4rem;font-size:.85rem}
  body[data-dev=touch] .ab[data-s=A]{width:5.6rem;height:5.6rem}
  body[data-dev=touch] .ab[data-s=B]{right:6.5rem}
  body[data-dev=touch] .ab[data-s=X]{right:5.4rem;bottom:6rem}
  body[data-dev=touch] .ab[data-s=Y]{bottom:6.6rem}
  #hud{width:min(60%,30rem)}
  body[data-dev=touch] #top{padding-right:calc(var(--sr) + 11.6rem)}
}
/* keyboard: key-labelled plates, two by two at the bottom-right */
body[data-dev=keys] #pad{width:var(--action-width);display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
body[data-dev=keys] .ab{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.6rem;align-items:center;justify-items:start;text-align:left;border-radius:.8rem;padding:.4rem .7rem;min-height:3rem;background:rgba(14,16,20,.74)}
body[data-dev=keys] .ab .k{display:block;grid-row:1 / span 2;min-width:1.8rem;padding:.2rem .45rem;border-radius:.4rem;background:#f3efe4;color:#1a1a1a;text-align:center;font-size:.9rem}
body[data-dev=keys] .ab .l,body[data-dev=pad] .ab .l{font-size:.95rem;white-space:normal;line-height:1.1}
body[data-dev=keys] .ab small{grid-column:2;white-space:normal}
body[data-dev=keys] .ab[data-s=A]{border-color:var(--accent)}
/* pad: the A B X Y diamond with the face-button colours */
body[data-dev=pad]{--action-width:15rem}
body[data-dev=pad] #pad{width:var(--action-width);height:14.4rem}
body[data-dev=pad] .ab{width:5.2rem;height:5.2rem;border:0;background:none;gap:.1rem;justify-content:flex-start;overflow:visible}
body[data-dev=pad] .ab .k{display:flex;align-items:center;justify-content:center;width:3rem;height:3rem;border-radius:50%;color:#fff;font-size:1.3rem}
body[data-dev=pad] .ab .l{text-shadow:0 1px 3px #000;font-size:.9rem}
body[data-dev=pad] .ab small{text-shadow:0 1px 3px #000;white-space:nowrap}
body[data-dev=pad] .ab[data-s=Y]{left:4.9rem;top:0}
body[data-dev=pad] .ab[data-s=X]{left:0;top:4.6rem}
body[data-dev=pad] .ab[data-s=B]{right:0;top:4.6rem}
body[data-dev=pad] .ab[data-s=A]{left:4.9rem;top:9.2rem}
body[data-dev=pad] .ab[data-s=A] .k{background:#5fb04a}body[data-dev=pad] .ab[data-s=B] .k{background:#d0533f}body[data-dev=pad] .ab[data-s=X] .k{background:#4a8ae0}body[data-dev=pad] .ab[data-s=Y] .k{background:#e0c050;color:#1a1a1a}
body[data-dev=pad] .ab.off{opacity:.85}body[data-dev=pad] .ab.off .k{opacity:.45}body[data-dev=pad] .ab small,body[data-dev=keys] .ab small{font-size:.72rem;color:#d6dae3}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;margin-bottom:.4rem}
.tabs .mb{text-align:center;min-height:2.9rem;padding:.4rem .25rem;font-size:.9rem}
.tabs .mb.sel{border-color:var(--accent);background:#3a3524;color:var(--accent)}
.ov{position:absolute;inset:0;background:rgba(6,8,12,.86);display:flex;align-items:center;justify-content:center;z-index:20;padding:.8rem var(--sr) .8rem var(--sl);overflow:auto}
.ov.title{background:linear-gradient(90deg,rgba(6,6,10,.82),rgba(6,6,10,.35) 55%,rgba(6,6,10,0));justify-content:flex-start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.05rem;max-width:30rem;width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 .25rem;font-size:1.85rem;letter-spacing:.04em;color:var(--accent)}
.card h2{margin:0 0 .5rem;font-size:1.3rem;color:var(--accent)}
.card p{margin:.4rem 0}
.card .dim{color:var(--dim);font-size:.85rem}
.mb{display:block;width:100%;min-height:3rem;margin:.4rem 0;border-radius:.65rem;border:2px solid #56627a;background:#252c39;color:var(--ink);font:600 1rem system-ui,sans-serif;text-align:left;padding:.5rem .75rem}
.mb small{display:block;font-weight:400;font-size:.78rem;color:var(--dim)}
.mb.focus{border-color:var(--accent);background:#33405a;outline:none}
.mb.off{opacity:.6;border-style:dashed}
.card.held .mb{opacity:.45;transition:opacity .2s}
.mb:focus-visible{outline:2px solid var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 .5rem}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
#skillbar{position:absolute;z-index:6;left:50%;bottom:var(--sb);transform:translateX(-50%);display:flex;flex-direction:column;align-items:stretch;gap:.25rem;pointer-events:none}
.skrow{display:flex;gap:.35rem;justify-content:center}.xpb{position:relative;height:.5rem;border-radius:.25rem;background:rgba(14,16,20,.86);border:1px solid #56627a;overflow:hidden}.xpb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b98a2e,#ffd27a)}.xpt{font:700 .62rem system-ui;color:#ffd27a;text-align:center;text-shadow:0 1px 2px #000}
body.titling #skillbar{display:none}
.sk{position:relative;width:3.3rem;height:3.3rem;border-radius:.55rem;background:rgba(14,16,20,.86);border:1px solid #56627a;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:.15rem;box-sizing:border-box;overflow:hidden;font:600 .62rem/1.1 system-ui,sans-serif;text-align:center}
.sk .ic{font-size:1.25rem;line-height:1.3rem;margin-bottom:.1rem}.sk .ky{position:absolute;left:.25rem;top:.12rem;font-size:.62rem;color:var(--accent)}
.sk .cdv{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62)}.sk .cdn{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem;font-weight:800;color:#fff}
.sk.off{opacity:.38}.sk.ready{border-color:var(--accent);box-shadow:0 0 .5rem rgba(255,207,106,.45)}.sk.tal{border-color:#9be08a;box-shadow:0 0 .6rem rgba(155,224,138,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 1.1rem rgba(155,224,138,.9)}}
#ver{display:none;position:fixed;right:10px;bottom:8px;z-index:60;font:500 12px/1.2 system-ui,sans-serif;color:#fff;opacity:.7;text-shadow:0 1px 2px #000;pointer-events:none}
body.titling #ver{display:block}

function helpHtml(){return`<p><b>Humans.</b> Take quests and hunt beasts for gold, buy kits in town, then walk to one of the giant's planted feet and climb. You climb hold to hold: push a direction to reach for the best hold that way, or tap one. Every reach costs grip, hanging drains it, mossy holds drain it faster and loose stones crumble a moment after you grab them. Stand on a ledge or rest by your own anchor to refill it. Lunge for a hold beyond your reach across bare stone. At a hurt joint with no wedge in it, the anchor button Tends it instead: it heals a little and the giant remembers you kindly (the mirror of Strike). A rival climber within arm's reach (away from a joint or build spot) can be shoved with Attack: it costs them a lot of grip, you a little, and starts a feud. A falling climber lands on the next ledge below or is caught by an anchor of their own town.</p>
<p><b>Your hero grows.</b> Every level you choose one of three talents (T). Levels 2, 3 and 5 unlock skills on 1, 2 and 3: War cry, Whirlwind and Mend. Charms change how you play: wear two, three at level 4, four at level 7; alphas always drop one, camp chests often, the merchant sells them. I (or Tab) shows your hero.</p>
<p><b>Horses.</b> Buy one in town and ride with R: almost twice as fast, and blows struck riding hit harder. A hard hit throws you; a worn-out horse bolts home for a minute. No riding on the giant.</p>
<p><b>The land.</b> Shrines bless you for two minutes, hot springs add 10 most health the first time, standing stones tell the old tales (read all four for a talent), three herbs make a potion. Camps hold a chest guarded by a named alpha and its pack, or by bandit archers and their chief: archers draw a line to their mark, step off it. Lost travellers pay 50 gold to be walked home. A wandering merchant goes from town to town. Deer bolt from you; hunt them for pelts. The Now line and the goal light point at the nearest of these.</p>
<p><b>Jobs and the tale.</b> The Board posts jobs, including bounties on named alphas and camps to break. After two jobs the elders tell you a tale in four steps that ends at the Rim Warlord. An alpha that kills you takes a name for it and grows stronger: avenge yourself for a richer bounty.</p>
<p><b>Towns grow.</b> Besides houses, towers and barracks you can build farms (each feeds two houses and pays a little), a well, a market (+25% rent), a smithy (cheaper gear) and a stable (cheap horses, heals yours). A settlement's prosperity counts all of it, minus hungry houses, broken walls and raids; above 40 it raises the rent you are paid. Only heroes found outposts: stake a site and settlers walk there from your first town.</p>
<p><b>Fighting.</b> Three strikes in a row make a combo: the third hits much harder and breaks a wind-up. Dodge in the last instant before a blow lands for a perfect dodge: time slows, the beast staggers and your next hit is a critical one. Beasts warn before they strike: a wolf crouches and a troll raises its club over a red ring that shrinks to the spot it chose, and the blow lands only on whoever is still in the ring. Step out, or dodge (Shift on keys, a shoulder button on a pad, a quick flick across the screen on touch): the first part of a dodge cannot be hurt. Tap Attack for a quick strike; hold it to charge a heavy blow that knocks a beast back, hardest into stone or a footprint lake. Wolves take turns: one lunges while the pack circles.</p>
<p><b>Rivals.</b> People of other towns can be attacked anywhere outside a settlement's walls (Attack when one is close); a kill takes what their pack holds and a quarter of their gold. Every blow starts a feud between the towns: their people answer it on sight, and towers shoot feuding rivals inside your build area.</p>
<p><b>Building takes time.</b> A house takes 6 seconds, a tower 8, an outpost 15, anything on the giant 5 or 6; you are held at the work until it is done, and on the giant your grip still counts.</p>
<p><b>Upgrading on the map.</b> Crystals are stored at home but spent anywhere: stand by one of your houses or towers, or in your town, and press Upgrade. A raised town sells the next level of gear (blades, armour, packs, gloves, greater potions); a raised house widens your build area; a tower's first raise makes it a ballista, a volley tower or a watchfire, or simply sharpens it.</p>
<p><b>Sky crystals.</b> Crystals are what upgrades cost. Raise your town in its hall for thicker walls and a wider build area; stand by one of your houses or towers and Build to raise it (a house pays more rent, a tower reaches further and hits harder); on the giant, use your own cannon or brace to raise it (a cannon fires faster and heavier, a brace carries the giant faster). The wake horn is forged from them too.</p>
<p><b>Heroes and ruins.</b> You are Ashville’s hero. Brindle and Corvel each have a hero of their own. Only heroes can open chests in old giants. Looting a chest can rouse its trolls against your town.</p>
<p><b>Events.</b> A town that grows rich draws beast raids. Every sixteen sky crystals gathered call a falling star with ten more in its crater. Raising a town sends a caravan of settlers out, with beasts waiting on the road. A faction that has already founded three outposts sends trade to a neighbour instead.</p>
<p><b>Your pack.</b> You carry six things. Sky crystals lie on the ground, and defeated beasts drop pelts and crystals. Coming home empties your pack and sells your pelts. Each city and outpost has one forager who gathers within reach of home. Withdraw their crystals from a friendly Hall to spend them on upgrades or the wake horn.</p>
<p><b>Ruins.</b> The old giants lying across the land are ruins, guarded by trolls. Search their ribs for gold, sky crystals and kits; each fills again after a few minutes.</p>
<p><b>Quests.</b> Each town's board shows three jobs and changes every minute: fetch sky crystals, carry parcels to other settlements, hunt beasts, put up buildings. Later boards add climbing the giant and pulling wedges from it. None of them asks you to attack the giant: that is your own choice.</p>
<p><b>Building the world.</b> Houses extend the dashed build area for houses, watchtowers, and barracks. Each completed house makes room for one more forager, up to ${FORAGER_CAP} per settlement. Nearby friendly foragers and soldiers recover ${HOUSE_RECOVERY} health per second after five seconds without taking damage. The bonus is the same near one house or several. Found an outpost away from other settlements, then raise it into a town with sky crystals. A promoted outpost helps keep your people in the game if their other towns fall. Settle beside the giant's footprint lakes to earn gold, but its feet flatten whatever stands in their path. Old giants lie across the land as mountains.</p>
<p><b>Building on the giant.</b> Twenty-one build spots lie across its shoulders, crown, chest, hips, forearms, wrists and thighs. A ladder fixes firm holds for three hundred feet below its spot, for anyone; a platform is a resting place that catches your people when they fall; cannons and braces as before. Cannons on the shoulders, forearms and crown fire at every town but yours. Wedges in a joint bleed it and halve its healing. Cripple both knees and the giant falls to its knees: no grip is lost and the Heart-stone in its chest takes half again as much damage. Only three people's blows count on one joint at a time, and a town's soldiers strike stone at seven-tenths strength. Shatter the Heart-stone to win, or arm the giant until your town is the last one standing.</p>
<p><b>How the giant treats a town.</b> It wanders in peace until a town's people hurt it: every blow and wedge is remembered against their town, and past bearing it walks to that town and smashes it. Pulling out a wedge or mounting a cannon earns a town its favour, and grudges fade with time. Brindle tends and arms it, Corvel hunts it, and Ashville is of two minds. You can play for any of the three: as Ashville you make its way yourself; as Brindle or Corvel you start with your people's habit, but your town's barracks follow your lead: once the giant clearly likes (or hates) what you do, they tend (or hunt) it too. At the end a chronicle tells how the match turned and why. The giant also remembers the last day: the town it lay down beside starts in its favour, and the town that hurt it most starts with a grudge it never quite lets go. Each match started from the menu also draws an omen (a restless giant, a blood moon, a long day, dark dreams, or a clear sky), told at the start. At dusk the giant lies down as a mountain beside the town that treated it best: be that town, or shatter its Heart-stone, or be the last town standing.</p>
<p><b>Foragers and barracks.</b> Heroes build. Foragers use their settlement’s crystals to raise its hero-built houses and spend their own gold to train and equip soldiers at its hero-built barracks. Each barracks trains up to three soldiers. A settlement allows one barracks per level. Beside your barracks you can give orders. The soldiers hold for twenty seconds, then return and set out again until you change the order or choose Stand down.</p>
<p><b>The giant judges you.</b> Beside each town's grudge it keeps a regard for every person. Blows and wedges lower yours; breaking its chains, pulling wedges, bracing it, mounting cannons, waking it and soldiers guarding its feet raise it. At the first dusk after it wakes it honours the one person it regards best, and you win only if that is you. The panel at the top shows where you stand.</p>
<p><b>Days and nights.</b> Each day ends at dusk in a short night. While it is chained, no one can touch the giant at night, and the dusk storm grows as its chains wear.</p>
<p><b>The giant wakes slowly.</b> It begins asleep and chained at both ankles and both wrists. Every blow wears a chain, and worn through it breaks; once all four are broken, a wake horn, forged in town from twenty sky crystals and sounded at its head for ten seconds, wakes it, and the town that wakes it earns its favour; and only then can it move. Even awake it is all but unable to move. Braces bolted to its shoulders, forearms and crown let it walk faster and unlock its stomp, smash and swipe. Once it can walk it wanders, and goes after any town that has hurt it past bearing.</p>
<p><b>Playing the giant.</b> You win by surviving until dusk with your Heart-stone whole and completing three of five tasks: be Freed (all four chains broken), be Braced (three braces), be Avenged (a town that angered you brought below half its walls), be Befriended (a town friendly to you), and be a Wanderer (six thousand paces walked). The HUD shows each. You cannot build: court the towns that brace you and leave the hunters to rue it. Awake, you always have the strength of one brace (a slow walk and Stomp); Smash needs two braces and Swipe three. If both knees are crippled you fall: press any action fast to Struggle up sooner. Walk with momentum, stomp the ground, smash towns, shake off climbers and swipe a hand across one side of your body. </p>
<p><b>The chained sleeper.</b> You start asleep and chained, but not helpless. Push a direction, or tap or click your body panel, to pick a part of your body (legs, left side, right side, chest and head) and Twitch it: everyone there loses grip unless they hold still in time, and wedges and ropes there can shake loose. Strain pulls at a chain: until people start breaking your chains or someone forges a wake horn it only weakens them, after that it can tear them loose, and once all four are gone one more strain lets you rise on your own. From the first minute hunters may wedge and strike you as you sleep: it bruises but cannot cripple you. Climbers drawn with a red edge on your body panel are hunting you. Once a town has hurt you, Nightmare sends the beasts of the land against it; its people must go home to fight them. </p>
<p class="dim">Keys: WASD or arrows move, J K L H act, Q and E turn the camera, Y and G tilt it, + and - (or F) zoom, R rides, T picks a talent, 1 2 3 use skills, C resets it, Esc pauses. Pad: left stick moves, right stick turns and tilts, triggers zoom, R3 resets, A B X Y act, Start pauses. Touch: tap where to walk or which hold to climb to, drag to turn and tilt, pinch to zoom.</p>`}
function openHelp(back){openMenu({title:'How to play',body:helpHtml(),items:[{label:'Back',act:back}],back})}
// every barracks you built, wherever you are: pick one to train and give orders
function openArmy(){const h=S.you;if(!h)return;const mine=S.builds.filter(b=>b.k==='barracks'&&b.town===h.town&&playerBuilt(b));if(!mine.length){toast('You have no barracks yet: Build one near your town.');return}
  const ordName=b=>b.order?({town:'defend town',giant:'defend the giant',tend:'tend the giant',hunt:'hunt the giant',attack:'attack '+(b.order.ti!=null?TOWNS[b.order.ti].name:'')}[b.order.k]):'no standing order';
  openMenu({title:'Your barracks',body:'<p class="dim">Choose one to give orders from here.</p>',items:[...mine.map((b,i)=>({label:'Barracks '+(i+1)+' by '+(S.towns.find(t=>t.id===b.settlementId)||{name:'?'}).name,sub:soldiersOf(b).length+'/'+ARMY.CAP+' soldiers · '+ordName(b),act:()=>openBarracks(b)})),{label:'Back',act:closeMenu}],back:closeMenu})}

  {label:'Sound: '+(save.sound?'on':'off'),act:()=>{save.sound=!save.sound;persist();openPause()}},{label:'Quit to title',act:openTitle}],back:closeMenu})}
function chronicleHtml(){const L=[];
  // the four chain breaks read as one beat: when, and whose work it was
  for(const e of S.chron||[]){if(e.kind!=='chain'){L.push(e);continue}let c=L.find(x=>x.kind==='chains');if(!c){c={t:e.t,kind:'chains',n:0,who:{}};L.push(c)}c.n++;c.who[e.who]=(c.who[e.who]||0)+1;c.end=e.t}
  for(const c of L)if(c.kind==='chains'){const w=Object.entries(c.who).map(([k,v])=>k+(v>1?' \u00d7'+v:'')).join(', ');c.text=(c.n>=4?'The four chains broke':c.n+' of the chains broke')+(c.end-c.t>=60?' over '+Math.round((c.end-c.t)/60)+' min':'')+': '+w+'.'}const mm=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
  // the opening and closing turns always show; the middle is trimmed to the most recent if the match was busy
  const keep=L.length<=12?L:[...L.slice(0,3),...L.slice(-9)];
  let h='<p class="dim" style="margin-top:.7rem">How it went</p><div style="font-size:.85rem;line-height:1.35">'+keep.map(e=>`<div><span class="dim">${mm(e.t)}</span> ${e.text}</div>`).join('')+'</div>';
  if(S.role==='giant'){const a=S.acts||{},ts=giantTasks();
    h+=`<p class="dim" style="margin-top:.6rem">Your part</p><div style="font-size:.85rem">${(a.twitch||0)} twitches, ${(a.strain||0)} strains, ${(a.shake||0)} shakes, ${(a.swipe||0)} swipes, ${(a.stomp||0)} stomps, ${(a.smash||0)} smashes; ${S.loosed||0} climbers knocked loose. Tasks: ${ts.map(x=>(x.done?'\u2713 ':'\u2717 ')+x.name).join(', ')}.</div>`}
  else if(S.you){const y=S.you,b=y.built||{},bl=Object.keys(b).map(k=>b[k]+' '+k+(b[k]>1?'s':'')).join(', ');
    h+=`<p class="dim" style="margin-top:.6rem">Your part</p><div style="font-size:.85rem">Highest climb ${Math.round((y.best||0)*FT)} ft; ${y.wedged||0} wedge${y.wedged===1?'':'s'} driven; ${bl||'nothing'} built on the giant; level ${y.lvl}. In the giant\u2019s eyes: ${standing(y)}.</div>`}
  const nt=nextTime();if(nt)h+=`<p class="dim" style="margin-top:.6rem">Next time</p><div style="font-size:.85rem">${nt}</div>`;
  return h}
// one suggestion for the next match, read from how this one ended
function nextTime(){const o=S.over;if(!o)return'';
  if(S.role==='giant'){const miss=giantTasks().filter(x=>!x.done).map(x=>x.name),tip={Freed:'strain at your chains from the start and tear them loose once they weaken',Braced:'twitch only where hunters are, so the keepers who brace you stay on',Avenged:'walk on the town that angers you and Smash its walls below half',Befriended:'leave Brindle\u2019s and Ashville\u2019s keepers in peace; their braces and pulled wedges make a friend',Wanderer:'walk more: six thousand paces'};
    if(S.g.dead)return'Your Heart-stone broke. Shake and Swipe when hunters crowd you, and Struggle the moment you fall.';
    return miss.length?'For '+miss.slice(0,2).join(' and ')+': '+miss.slice(0,2).map(m=>tip[m]).join('; ')+'.':'Try another omen, or let a different town earn your favour.'}
  const y=S.you;if(!y)return'';const t=TOWNS[y.town].name;
  const byGiant=S.towns.some(x=>x.i===y.town&&/stomp|smash|crush/.test(x.fellBy||''));
  if(!factionAlive(y.town))return byGiant&&S.grudge[y.town]>=C.ANGER?t+' fell because the giant turned on it. Lead '+t+' by Tending the giant and pulling wedges, or be ready to bring the giant down once it wakes.':(byGiant?t+' fell under the giant\u2019s feet. Keep it out of the giant\u2019s path, or earn its favour.':t+' fell to raids and rivals. Raise its walls with crystals and keep soldiers home.');
  if(S.g.dead)return'The giant is dead and '+t+' stands. Next time try the other way: tend it and earn its favour at dusk.';
  if(o.dusk&&S.favoredH!==y.id){const fp=S.humans.find(x=>x.id===S.favoredH);return'The giant honoured '+(fp?whoOf(fp):'someone else')+'. Brace it, pull wedges and Tend hurt joints to stand first in its regard, or join the hunt and bring it down.'}
  return'Play for another town, or as the giant.'}

let townTab='Board';
function openTown(t,tab){const h=S.you;if(!t||!h)return;if(tab)townTab=tab;const fi=focusI;const tb=townTab;
  const buy=(k,cost,fn,sub)=>({label:k+' – '+cost+' gold',sub,why:h.gold<cost?'Need '+(cost-h.gold)+' more gold':null,act:()=>{h.gold-=cost;fn();sfx('coin');openTown(t);setFocus(Math.min(fi,menu.items.length-1))}});

  else if(tb==='Board'){body=`<p class="dim">Jobs posted in ${t.name}. The board changes in ${Math.max(1,Math.ceil(60-(S.t-(t.boardT||0))))} s.</p>`;
    items=q?[{label:q.done?'Claim quest reward':'Current quest: '+q.text,sub:q.done?q.gold+' gold':'('+Math.min(q.n,q.need)+'/'+q.need+')',act:()=>{if(q.done){h.gold+=q.gold;gainXp(h,q.xp);h.quest=null;h.claimed=(h.claimed||0)+1;sfx('coin');if(h.claimed>=2&&!h.saga){h.saga={i:0,n:0};announce('The elders of '+t.name+' have a tale for you. Follow it on your goal line.')}}openTown(t)}},...(q.done||q.tut?[]:[{label:'Drop this quest',sub:'The board will have others',act:()=>{h.quest=null;openTown(t)}}])]
