<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colossus</title>
<style>
[hidden]{display:none!important}
/* Layout: HUD row, stage, action bar (a right-hand column on short landscape screens). Single dark look by choice. */
:root{color-scheme:dark;--bg:#11141b;--panel:#1a1f28;--ink:#eee9dd;--dim:#a9afbb;--accent:#ffcf6a;--line:#363e4c;--bad:#ff8f80;--good:#9be08a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "stage" "pad"}
#hud{grid-area:hud;min-width:0;background:var(--panel);border-bottom:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));padding-top:max(6px,env(safe-area-inset-top));min-height:50px}
#hud .l1{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
#hud b{color:var(--accent);font-weight:600}
#hud .warn{color:var(--bad);font-weight:600}
#hud .l2{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* status strip: chips with bars, the dusk meter on the right, one line of what to do next */
#hud .l1{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.chip{position:relative;display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:2px 8px;border-radius:7px;background:#232a36;border:1px solid var(--line);font-size:13px;white-space:nowrap;overflow:hidden}
.chip b{color:var(--accent)}.chip .warn{color:var(--bad)}
.chip .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--good)}.chip .bar.low{background:var(--bad)}.chip .bar.mid{background:var(--accent)}
.chip.dusk{margin-left:auto;background:#2b2433}.chip.dusk .bar{background:#e08a4a}
.chip.goal{background:#2e3524;border-color:#55623f}
#hud .l2{color:var(--ink);font-size:13px;margin-top:4px;white-space:normal;line-height:1.25}
#hud .l2 .k{color:var(--accent);font-weight:600}
/* message feed: newest at the bottom, repeats folded, each held long enough to read */
#feed{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;align-items:center;pointer-events:none;width:min(92%,560px);z-index:5}
#feed div{background:rgba(10,8,12,.86);border:1px solid #3a3346;color:var(--ink);padding:5px 12px;border-radius:8px;font-size:14px;text-align:center;transition:opacity .4s}
#feed div b{color:var(--accent)}
.ov.title{background:linear-gradient(90deg,rgba(6,6,10,.82),rgba(6,6,10,.35) 55%,rgba(6,6,10,0));justify-content:flex-start}
body.titling #pad{visibility:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}
.tabs .mb{text-align:center;min-height:44px;padding:6px 4px;font-size:14px}
.tabs .mb.sel{border-color:var(--accent);background:#3a3524;color:var(--accent)}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin:4px 0 8px}
@media (min-width:900px){body:not(.touch) #pad{grid-template-columns:repeat(4,minmax(0,170px));justify-content:center}}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(8,10,14,.85);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:14px;pointer-events:none;max-width:92%;text-align:center;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#pad{grid-area:pad;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));touch-action:none}
.ab{position:relative;min-height:54px;min-width:0;overflow:hidden;border-radius:10px;border:2px solid #56627a;background:#252c39;color:var(--ink);font:600 14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px;touch-action:none}
.ab .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ab small{font-weight:400;font-size:11px;color:var(--dim);line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ab .k{position:absolute;top:2px;left:5px;font-size:10px;color:var(--accent);font-weight:700}
.ab.off{opacity:.55;border-style:dashed}
.ab:active{background:#34405a}
@media (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:minmax(0,1fr) 200px;grid-template-rows:auto 1fr;grid-template-areas:"hud hud" "stage pad"}
  #pad{grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;border-top:0;border-left:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) 8px}
}
.ov{position:absolute;inset:0;background:rgba(6,8,12,.86);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:480px;width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:28px;letter-spacing:.04em;color:var(--accent)}
.card h2{margin:0 0 8px;font-size:20px;color:var(--accent)}
.card p{margin:6px 0}
.card .dim{color:var(--dim);font-size:13px}
.mb{display:block;width:100%;min-height:48px;margin:6px 0;border-radius:10px;border:2px solid #56627a;background:#252c39;color:var(--ink);font:600 16px system-ui,sans-serif;text-align:left;padding:8px 12px}
.mb small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.mb.focus{border-color:var(--accent);background:#33405a;outline:none}
.mb.off{opacity:.6;border-style:dashed}
.mb:focus-visible{outline:2px solid var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<div id="app">
  <div id="hud"><div class="l1" id="hud1">Colossus</div><div class="l2" id="hud2"></div></div>
  <div id="stage">
    <canvas id="sky"></canvas><canvas id="gl"></canvas><canvas id="cv"></canvas>
    <div id="toast"></div><div id="feed"></div>
    <div class="ov" id="ov"><div class="card" id="card"></div></div>
  </div>
  <div id="pad"></div>
</div>

function nearFoot(h){const g=S.g;if(g.dead)return -1;let best=-1,bd=1e9;g.feet.forEach((f,i)=>{if(f.air>0)return;const d=Math.hypot(f.x-h.x,f.y-h.y);if(d<C.FOOT_R+45&&d<bd){bd=d;best=i}});return best}
function nearMonster(h,r){let best=null,bd=r;for(const m of S.monsters){const d=Math.hypot(m.x-h.x,m.y-h.y)-m.r;if(d<bd){bd=d;best=m}}return best}
function mount(h,leg){h.mode='climb';h.leg=leg;h.cl={x:leg?21.5:10.5,y:1.5,vy:0,fall:false,from:0,move:null,path:null};h.grip=maxGrip(h);h.tx=h.ty=null;h.rest=false;
  sayTo(h,'You grab the '+(leg?'right':'left')+' foot. Climb with care: grip drains, ledges refill it.')}
function dismount(h,hurt){dropJob(h);const g=S.g,f=g.feet[h.leg]||g.feet[0];h.mode='ground';const a=rr(0,6.28),r=C.FOOT_R+40;h.x=clamp(f.x+Math.cos(a)*r,20,C.MAP-20);h.y=clamp(f.y+Math.sin(a)*r,20,C.MAP-20);h.cl=null;h.botClimb=null;h.goal=null;
  if(hurt>0)hurtHuman(h,hurt,'fall')}
function fallDamage(cells){return Math.max(0,cells*FT-60)*.12}
function startFall(h){const cl=h.cl;if(cl.fall)return;cl.fall=true;cl.vy=0;cl.from=cl.y;cl.move=null;cl.path=null;h.grip=0;sfx('fall',h.you);sayTo(h,'Your grip fails!')}
function humanCtx(h){
  if(h.job&&!h.dead){const w={l:'Building '+Math.round(h.job.t/h.job.dur*100)+'%',why:'Building: hold on'};return{A:w,B:w,X:w,Y:w}}
  if(h.dead)return{A:{l:'Wait',why:'Respawning'},B:{l:'Wait',why:'Respawning'},X:{l:'Wait',why:'Respawning'},Y:{l:'Wait',why:'Respawning'}};
  if(h.mode==='climb'){const cl=h.cl,busy=cl.fall?'Falling':cl.move?'Moving':null;const j=jointAt(cl.x,cl.y),s=siteAt(cl.x,cl.y);
    let A={l:'Strike',why:'No joint or site here'};
    const chH=S.chains.find(ch=>ch.hp>0&&ch.r===Math.floor(cl.y)&&ch.c===Math.floor(cl.x));
    if(chH)A={l:chainWeak(chH)?chH.name+': weakened':'Weaken '+chH.name,why:busy||(chainWeak(chH)?'Weakened: the horn will break it':null)};
    if(!S.g.awake&&cl.y>=C.WAKE_ROW)A={l:h.waking?'Waking '+Math.round(S.wakeT/C.WAKE_TIME*100)+'%':'Sound the wake horn',why:busy||(h.waking?'Hold still':!h.horn?'Needs a wake horn: forge one in town from '+C.HORN_CRYSTALS+' sky crystals':!allWeak()?'The chains still hold: weaken all four first ('+S.chains.filter(c=>c.hp>0&&!chainWeak(c)).length+' left)':null)};
    if(j)A={l:'Strike '+JOINTS[j].name.toLowerCase(),why:busy||(!S.g.awake?'It sleeps as stone':null)};
    else if(s){if(s.build&&s.build.k==='cannon'&&s.build.town!==h.town)A={l:'Wreck cannon',why:busy};else if(s.build)A={l:'Upgrade '+s.build.k+(upCost(s.build.k,s.build)!=null?' ('+upCost(s.build.k,s.build)+' crystals)':''),why:busy||canUpgrade(h,s.build.k,s.build)};else{const kn=Object.keys(SITE_KITS).filter(k=>h.kits[k]).length;A={l:s.pending?'Being built':'Build here',why:busy||(s.pending?'Someone is building here':!kn?'No kits for the giant: buy them in town':null)}}}
    const siteFree=s&&!s.build;
    const hasA=S.anchors.some(a=>a.r===Math.floor(cl.y)&&a.c===Math.floor(cl.x));
    const X=j&&S.joints[j].wedges.length?{l:'Pull wedge',why:busy}:{l:'Anchor ('+h.kits.anchor+')',why:busy||(!h.kits.anchor?'No anchor kits':hasA?'Anchor already here':null)};
    let Y;if(j){const jj=S.joints[j];Y={l:'Wedge ('+h.kits.wedge+')',why:busy||(!S.g.awake?'It sleeps as stone':null)||(!h.kits.wedge?'No wedges':jj.crip?'Already crippled':jj.wedges.length>=C.WEDGE_MAX?'No room for more':null)}}
    else Y={l:'Potion ('+h.potions+')',why:!h.potions?'No potions':h.hp>=h.max?'Full health':null};
    return{A,B:{l:'Lunge',why:busy||(h.grip<C.LUNGE_GRIP?'Grip too low':null)},X,Y}}
  const t=townAt(h),foot=nearFoot(h),m=nearMonster(h,60),foe=!m&&rivalNear(h,60),up=upgradeTarget(h);
  return{A:{l:foe?'Attack '+TOWNS[foe.town].name:'Attack',why:m||foe?null:'Nothing in reach'},B:foot>=0||!up?{l:'Climb',why:foot>=0?null:S.g.dead?'The giant is dead':'Stand by a planted foot'}:{l:'Upgrade '+up.label,why:up.why},
    X:t?{l:'Town',why:null}:cacheNear(h)?{l:'Search ruins',why:null}:{l:'Build',why:null},Y:{l:'Potion ('+(h.potions+h.bigPotions)+')',why:!(h.potions+h.bigPotions)?'No potions':h.hp>=h.max?'Full health':null}}}
function humanAct(h,slot,dir){const c=humanCtx(h)[slot];if(c.why){sayTo(h,c.why);return false}
  if(h.mode==='climb'){const cl=h.cl;
    // waking is not a press: you must hold still at its head while it stirs, through its shudders
    if(slot==='A'&&!S.g.awake&&cl.y>=C.WAKE_ROW){if(!h.horn||!allWeak())return false;h.waking=true;S.waker=h;if(!S.headless){announce(h.you?'You sound the wake horn. Hold still while it stirs.':TOWNS[h.town].name+' is sounding a wake horn at the giant\u2019s head!');hornCall()}if(!S.headless)giantCall('breath');return true}
    {const ch=S.chains.find(q=>q.hp>0&&q.r===Math.floor(cl.y)&&q.c===Math.floor(cl.x));if(slot==='A'&&ch){if(h.cd>0)return false;h.cd=.5;h.swing=.2;if(chainWeak(ch))return false;ch.hp=Math.max(ch.max*C.CHAIN_WEAK,ch.hp-h.atk);if(!S.headless&&Math.random()<.3)chainClank(ch);sfx('hit',h.you);
      if(chainWeak(ch)){S.grudge[h.town]-=30;gainXp(h,25);announce('The '+ch.name+' is weakened.'+(allWeak()?' All four chains are weak: a wake horn will break them.':''))}return true}}
    if(slot==='A'){if(h.cd>0)return false;h.cd=.5;h.swing=.2;const j=jointAt(cl.x,cl.y),s=siteAt(cl.x,cl.y);
      if(j){damageJoint(j,h.atk,h);gainXp(h,1);sfx('hit',h.you);questTick(h,'strike');return true}
      if(s&&s.build&&s.build.town===h.town)return upgrade(h,s.build.k,s.build);
      if(s&&s.build&&s.build.town!==h.town){s.build.hp-=h.atk;sfx('hit',h.you);if(s.build.hp<=0){s.build=null;sayTo(h,'Cannon wrecked!');gainXp(h,20)}return true}
      if(s&&s.pending)return false;if(s&&!s.build){const ks=Object.keys(SITE_KITS).filter(k=>h.kits[k]);if(h.you&&!S.autoplay&&ks.length>1){openSiteMenu(h,s);return true}return placeOnSite(h,s,ks[0])}
      return false}
    if(slot==='B'){let dx=dir?dir.x:0,dy=dir?dir.y:1;if(Math.hypot(dx,dy)<.2){dx=0;dy=1}
      const t=pickHold(cl,dx,dy,C.LUNGE_REACH,C.REACH*.8);if(!t){sayTo(h,'No hold within a lunge that way.');return false}
      startMove(h,t,true);h.grip-=C.LUNGE_GRIP;cl.path=null;return true}
    if(slot==='X'&&jointAt(cl.x,cl.y)&&S.joints[jointAt(cl.x,cl.y)].wedges.length){const ws=S.joints[jointAt(cl.x,cl.y)].wedges;let i=ws.findIndex(w=>w.town!==h.town);if(i<0)i=0;ws.splice(i,1);
      h.kits.wedge++;S.grudge[h.town]-=C.PULL_FAVOR;questTick(h,'tend');gainXp(h,8);sfx('build',h.you);sayTo(h,'You pull out a wedge. The giant remembers '+TOWNS[h.town].name+' kindly.');return true}
    if(slot==='X'){h.kits.anchor--;S.anchors.push({r:Math.floor(cl.y),c:Math.floor(cl.x),town:h.town});sfx('build',h.you);sayTo(h,'Anchor set at '+Math.floor(cl.y)*FT+' ft. It catches your people if they fall.');questTick(h,'anchor',Math.floor(cl.y));return true}
    if(slot==='Y'){const j=jointAt(cl.x,cl.y);if(j){h.kits.wedge--;S.joints[j].wedges.push({town:h.town});if(!S.headless&&Math.random()<.5)giantCall('pain');sfx('build',h.you);gainXp(h,8);sayTo(h,'Wedge driven into the '+JOINTS[j].name.toLowerCase()+'. It bleeds.');return true}
      h.potions--;h.hp=Math.min(h.max,h.hp+60);sayTo(h,'You drink a potion.');return true}
    return false}
  if(slot==='A'){if(h.cd>0)return false;h.cd=.5;h.swing=.2;const m=nearMonster(h,60);if(!m){const o=rivalNear(h,60);if(o){strikeHuman(h,o);return true}}if(m){m.hp-=h.atk;m.hitT=S.t;if(h.you)S.fx.push({k:'txt',x:m.x,y:m.y,z:m.kind==='troll'?80:40,text:'-'+h.atk,t:0,life:.8,col:'#ffe6a0'});sfx('hit',h.you||nearPlayer(m));if(m.hp<=0)killMonster(m,h);return true}return false}
  if(slot==='B'){if(nearFoot(h)<0){const up=upgradeTarget(h);if(up)return up.act();return false}mount(h,nearFoot(h));return true}
  if(slot==='X'){const t=townAt(h),c=cacheNear(h);if(!t&&c)return searchCache(h,c);if(h.you){if(t)openTown(t);else openBuild()}return true}
  if(slot==='Y'){if(h.bigPotions){h.bigPotions--;h.hp=Math.min(h.max,h.hp+140);sayTo(h,'You drink a greater potion.');return true}h.potions--;h.hp=Math.min(h.max,h.hp+60);sayTo(h,'You drink a potion.');return true}
  return false}
// what people build out in the world: houses thicken a settlement's walls, towers shoot beasts, an outpost founds a new settlement
function canBuild(h,k){const own=aliveTowns().filter(t=>t.i===h.town);let nd=1e9;for(const t of own)nd=Math.min(nd,dist(t,h)-t.r);
  const anyNear=aliveTowns().some(t=>dist(t,h)<t.r+C.OUTPOST_GAP),onLake=S.prints.some(p=>Math.hypot(p.x-h.x,p.y-h.y)<C.FOOT_R*1.2);
  if(h.gold<C.COST[k])return'Need '+(C.COST[k]-h.gold)+' more gold';if(onLake)return'Not in the lake';
  if(S.builds.some(b=>Math.hypot(b.x-h.x,b.y-h.y)<45)||S.humans.some(o=>o.job&&o.job.kind==='ground'&&Math.hypot(o.job.x-h.x,o.job.y-h.y)<45))return'Too close to another building';
  if(k==='outpost')return anyNear?'Too near a settlement':S.outposts[h.town]>=3?'Your people have three outposts':null;
  return inTerritory(h.town,h.x,h.y)?null:'Outside your build area: build nearer your homes'}
// a people's build area: a ring around each of its settlements and around every house it has built, so houses
// push the area outward and towers can stand anywhere inside it
function territory(i){const out=[];for(const t of aliveTowns())if(t.i===i)out.push({x:t.x,y:t.y,r:t.r+C.HOME_REACH+120*(lv(t)-1)});for(const b of S.builds)if(b.town===i&&b.k==='house')out.push({x:b.x,y:b.y,r:C.HOUSE_REACH+120*(lv(b)-1)});return out}
function inTerritory(i,x,y){return territory(i).some(c=>Math.hypot(c.x-x,c.y-y)<=c.r)}
function lakesNear(x,y,r){return S.prints.filter(p=>S.t-p.t>4&&Math.hypot(p.x-x,p.y-y)<r).length}
const BUILD_TIME={house:6,tower:8,outpost:15,cannon:6,brace:6,ladder:5,platform:6};
function startJob(h,job){h.job={...job,t:0,dur:BUILD_TIME[job.k]};h.tx=h.ty=null;if(h.cl)h.cl.path=null;sfx('build',h.you);sayTo(h,'Building a '+job.k+'... ('+h.job.dur+' s)')}
function stepJob(h,dt){const j=h.job;j.t+=dt;if(j.t<j.dur)return;h.job=null;if(j.kind==='site')finishSite(h,j.s,j.k);else finishBuild(h,j.k,j.x,j.y)}
function dropJob(h){const j=h.job;if(!j)return;h.job=null;if(j.kind==='site'&&j.s.pending===h.id)j.s.pending=null}
function build(h,k){const why=canBuild(h,k);if(why){sayTo(h,why);return false}h.gold-=C.COST[k];startJob(h,{kind:'ground',k,x:h.x,y:h.y});return true}
function finishBuild(h,k,x,y){sfx('build',h.you);const hx=h.x,hy=h.y;h.x=x;h.y=y;finishBuild0(h,k);h.x=hx;h.y=hy;return true}
function finishBuild0(h,k){
  if(k==='outpost'){S.outposts[h.town]++;const n=S.towns.length,names=[['Ashmere','Ashwell','Ashby'],['Brindle Ford','Brindlemoor','Brindlewick'],['Corvel Rest','Corvelmere','Corvel Hollow']];
    S.towns.push({i:h.town,id:n,name:names[h.town][S.outposts[h.town]-1],col:TOWNS[h.town].col,shape:TOWNS[h.town].shape,x:h.x,y:h.y,r:100,hp:1500,max:1500,alive:true,outpost:true});
    announce(TOWNS[h.town].name+' founded '+S.towns[n].name+(lakesNear(h.x,h.y,500)?' beside a footprint lake.':'.'));gainXp(h,30);return true}
  S.builds.push({k,x:h.x,y:h.y,town:h.town,owner:h.id,cd:0});
  questTick(h,'build');
  if(k==='house'){let b=null,bd=1e9;for(const t of aliveTowns())if(t.i===h.town){const d=dist(t,h);if(d<bd){bd=d;b=t}}if(b){b.max+=C.HOUSE_HP;b.hp+=C.HOUSE_HP;b.r+=C.HOUSE_GROW;b.houses=(b.houses||0)+1}}
  gainXp(h,10);sayTo(h,k==='house'?'House built: your town grows and your build area reaches further.':'Watchtower built: it shoots beasts that come near.');return true}
function stepBuilds(dt){
  for(const b of S.builds)if(b.k==='tower'){b.cd-=dt;const L=lv(b),sp=b.spec,R2=C.TOWER_R*(1+.25*(L-1))*(sp==='ballista'?1.8:1);
    if(sp==='watchfire')for(const o of S.humans)if(o.town===b.town&&!o.dead&&o.mode==='ground'&&Math.hypot(o.x-b.x,o.y-b.y)<R2)o.hp=Math.min(o.max,o.hp+6*dt);
    if(b.cd>0)continue;
    // beasts in range, and rival people inside this town's build area
    const foes=S.monsters.filter(m=>Math.hypot(m.x-b.x,m.y-b.y)<R2).map(m=>({m})).concat(S.humans.filter(o=>!o.dead&&o.mode==='ground'&&o.town!==b.town&&S.feud[b.town][o.town]>40&&Math.hypot(o.x-b.x,o.y-b.y)<R2&&inTerritory(b.town,o.x,o.y)).map(o=>({o})));
    if(!foes.length){b.cd=.5;continue}b.cd=sp==='ballista'?2.6:1.5;const dmg=(sp==='ballista'?45:sp==='volley'?14:sp==='watchfire'?10:20)*L*(sp?1:1)+(sp===undefined&&L>1?0:0);
    for(const f of foes.slice(0,sp==='volley'?3:1)){if(f.m){f.m.hp-=dmg;f.m.hitT=S.t;S.fx.push({k:'ring',x:f.m.x,y:f.m.y,r:30,t:0,life:.3,col:'#ffcf6a'})}else{hurtHuman(f.o,dmg*.6,'tower');S.fx.push({k:'ring',x:f.o.x,y:f.o.y,r:30,t:0,life:.3,col:'#ff8f80'})}}}
  // houses pay rent to whoever built them, more once raised
  if(Math.floor(S.t/15)!==Math.floor((S.t-dt)/15))for(const b of S.builds)if(b.k==='house'){const o=S.humans.find(x=>x.id===b.owner);if(o)o.gold+=2*lv(b)}
  // the giant's lakes feed whoever settles beside them
  if(Math.floor(S.t/10)!==Math.floor((S.t-dt)/10))for(const t of aliveTowns()){const n=lakesNear(t.x,t.y,t.r+500);if(!n)continue;for(const h of S.humans)if(h.town===t.i)h.gold+=Math.min(3,n)*C.LAKE_GOLD/3|0||1}}
// sky crystals buy upgrades: a level is one more step of what the thing already does
const lv=o=>o.lvl||1;
function upCost(kind,o){const c=C.UP[kind];return lv(o)-1<c.length?c[lv(o)-1]:null}
function canUpgrade(h,kind,o){const c=upCost(kind,o);if(c==null)return'At its highest level';if(o.town!=null&&o.town!==h.town)return'Not yours';return h.crystals<c?'Need '+(c-h.crystals)+' more crystals':null}
function upgrade(h,kind,o){const why=canUpgrade(h,kind,o);if(why){sayTo(h,why);return false}h.crystals-=upCost(kind,o);o.lvl=lv(o)+1;sfx('build',h.you);gainXp(h,10*o.lvl);
  if(kind==='ladder'){const st=S.sites.find(q=>q.build===o);if(st)ladderDown(st,30+25*(o.lvl-1))}
  if(kind==='town'){o.max+=600;o.hp+=600;o.r+=20;startCaravan(o)}
  if(kind==='house'){let b=null,bd=1e9;for(const t of aliveTowns())if(t.i===h.town){const d=dist(t,o);if(d<bd){bd=d;b=t}}if(b){b.max+=C.HOUSE_HP;b.hp+=C.HOUSE_HP}}
  sayTo(h,{town:o.name+' is raised to level '+o.lvl+': stronger walls, a wider build area, and its shop sells level '+o.lvl+' gear.',house:'House raised to level '+o.lvl+': it reaches 120 further.',tower:'Watchtower raised to level '+o.lvl+(o.spec?': '+o.spec:': it hits harder')+'.',cannon:'Cannon raised to level '+o.lvl+': faster and heavier shot.',brace:'Brace raised to level '+o.lvl+': the giant walks faster.',ladder:'Ladder lengthened: it reaches further down.'}[kind]);return true}
// the nearest of your own things to upgrade: a house or tower beside you, or the town you stand in
function upgradeTarget(h){const b=buildNear(h),t=townAt(h);
  if(b){const tower=b.k==='tower',why=tower&&lv(b)===1&&!b.spec?(h.crystals<C.UP.tower[0]?'Need '+(C.UP.tower[0]-h.crystals)+' more crystals':null):canUpgrade(h,b.k,b);
    return{label:(tower?'tower':'house')+(upCost(b.k,b)!=null?' ('+upCost(b.k,b)+')':''),why,act:()=>tower&&!b.spec&&h.you&&!S.autoplay?(openTowerMenu(h,b),true):upgrade(h,b.k,b)}}
  if(t&&t.i===h.town)return{label:'town ('+(upCost('town',t)!=null?upCost('town',t):'max')+')',why:canUpgrade(h,'town',t),act:()=>upgrade(h,'town',t)};
  return null}
// a tower's first raise chooses what it becomes
const TOWER_SPECS={sharpen:'More damage on every shot',ballista:'Long range, heavy bolts, slow',volley:'Hits up to three targets at once',watchfire:'Heals your people nearby and lights raiders early'};
function openTowerMenu(h,b){openMenu({title:'Raise this watchtower',body:`<p class="dim">${h.crystals} crystals stored. Its first raise decides what it becomes; later raises add damage.</p>`,
  items:[...Object.keys(TOWER_SPECS).map(k=>({label:k[0].toUpperCase()+k.slice(1)+' \u2013 '+C.UP.tower[0]+' crystals',sub:TOWER_SPECS[k],why:h.crystals<C.UP.tower[0]?'Need '+(C.UP.tower[0]-h.crystals)+' more crystals':null,act:()=>{if(upgrade(h,'tower',b)){if(k!=='sharpen')b.spec=k}closeMenu()}})),{label:'Leave it',act:closeMenu}],grid:true,back:closeMenu})}
function buildNear(h){let b=null,bd=90;for(const q of S.builds){if(q.town!==h.town)continue;const d=Math.hypot(q.x-h.x,q.y-h.y);if(d<bd){bd=d;b=q}}return b}
// ---- world events: each is set off by something people did, and each gives bots and the player a reason to be elsewhere
function wealth(i){let w=0;for(const t of aliveTowns())if(t.i===i)w+=3*(lv(t)-1)+(t.houses||0);for(const b of S.builds)if(b.town===i)w+=b.k==='tower'?1:0;return w}
function nearestOwn(i,x,y){let b=null,bd=1e9;for(const t of aliveTowns())if(t.i===i){const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;b=t}}return b}
function eventSay(s){if(!S.headless)announce(s)}
// a raid: beasts gather out of sight, then march on a settlement; set off by a town growing rich, or a ruin being robbed
function startRaid(town,why,from){const a=rnd()*6.28,x=from?from.x:town.x+Math.cos(a)*1900,y=from?from.y:town.y+Math.sin(a)*1900,ev={k:'raid',town:town.id,i:town.i,x,y,t:S.t,go:S.t+20};
  const n=from?3:5+Math.floor(rnd()*3);for(let k=0;k<n;k++){const troll=from?true:k===0;S.monsters.push({id:S.nextId++,kind:troll?'troll':'wolf',x:x+rr(-80,80),y:y+rr(-80,80),hx:x,hy:y,hp:troll?110:36,max:troll?110:36,atk:troll?14:7,gold:troll?26:10,xp:troll?34:14,r:troll?22:13,cd:0,raid:ev})}
  S.events.push(ev);S.evc.raid++;eventSay(why)}
// a falling star: set off by how many sky crystals people have gathered between them
function startStar(){let x,y;for(let k=0;k<30;k++){x=rr(800,C.MAP-800);y=rr(800,C.MAP-800);if(aliveTowns().every(t=>Math.hypot(t.x-x,t.y-y)>1200))break}
  const ev={k:'star',x,y,t:S.t,left:10};S.events.push(ev);S.evc.star++;for(let k=0;k<10;k++){const a=rnd()*6.28,d=rr(30,180);S.crystals.push({id:S.nextId++,x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,star:ev})}
  for(let k=0;k<2;k++)S.monsters.push({id:S.nextId++,kind:'wolf',x:x+rr(-250,250),y:y+rr(-250,250),hx:x,hy:y,hp:40,max:40,atk:7,gold:12,xp:16,r:13,cd:0});

    if(h.kits.cannon>0){const free=S.sites.filter(s=>!s.build);if(free.length)return{kind:'site',test:(r,c)=>free.some(s=>s.r===r&&s.c===c)}}

function botClimb(h){const cl=h.cl,g=S.g,mv={x:0,y:0};if(cl.fall||cl.move)return mv;

function botHuman(h,dt){const mv={x:0,y:0};if(h.dead)return mv;const g=S.g;h.think-=dt;

function pickGoal(h){const g=S.g,home=homeOf(h);if(!home)return null;

function helpHtml(){return`<p><b>Humans.</b> Take quests and hunt beasts for gold, buy kits in town, then walk to one of the giant's planted feet and climb. You climb hold to hold: push a direction to reach for the best hold that way, or tap one. Every reach costs grip, hanging drains it, mossy holds drain it faster and loose stones crumble a moment after you grab them. Stand on a ledge or rest by your own anchor to refill it. Lunge for a hold beyond your reach across bare stone. A falling climber lands on the next ledge below or is caught by an anchor of their own town.</p>
<p><b>Rivals.</b> People of other towns can be attacked anywhere outside a settlement's walls (Attack when one is close); a kill takes what their pack holds and a quarter of their gold. Every blow starts a feud between the towns: their people answer it on sight, and towers shoot feuding rivals inside your build area.</p>
<p><b>Building takes time.</b> A house takes 6 seconds, a tower 8, an outpost 15, anything on the giant 5 or 6; you are held at the work until it is done, and on the giant your grip still counts.</p>
<p><b>Upgrading on the map.</b> Crystals are stored at home but spent anywhere: stand by one of your houses or towers, or in your town, and press Upgrade. A raised town sells the next level of gear (blades, armour, packs, gloves, greater potions); a raised house widens your build area; a tower's first raise makes it a ballista, a volley tower or a watchfire, or simply sharpens it.</p>
<p><b>Sky crystals.</b> Crystals are what upgrades cost. Raise your town in its hall for thicker walls and a wider build area; stand by one of your houses or towers and Build to raise it (a house pays more rent, a tower reaches further and hits harder); on the giant, use your own cannon or brace to raise it (a cannon fires faster and heavier, a brace carries the giant faster). The wake horn is forged from them too.</p>
<p><b>Events.</b> A town that grows rich draws beast raids: its people must come home and fight them off. Robbing a ruin can rouse its trolls against your town. Every sixteen sky crystals gathered call a falling star with ten more in its crater. Raising a town sends a caravan to its neighbour, with beasts waiting on the road; escort it there and every one of its people is paid.</p>
<p><b>Your pack.</b> You carry six things. Sky crystals lie on the ground; pelts and more crystals drop from beasts you defeat. When the pack is full you can pick up nothing more until you go home. Coming home empties your pack: crystals go into your store for upgrades and the wake horn, pelts are sold.</p>
<p><b>Ruins.</b> The old giants lying across the land are ruins, guarded by trolls. Search their ribs for gold, sky crystals and kits; each fills again after a few minutes.</p>
<p><b>Quests.</b> Each town's board shows three jobs and changes every minute: fetch sky crystals, carry parcels to other settlements, hunt beasts, put up buildings. Later boards add climbing the giant and pulling wedges from it. None of them asks you to attack the giant: that is your own choice.</p>
<p><b>Building the world.</b> Your build area is the dashed ring around your homes. Houses grow your town and push the ring outward wherever you put them, so a line of houses reaches across the land; watchtowers that shoot beasts can stand anywhere inside it; and or a whole new outpost of your people. Settle beside the giant's footprint lakes and they pay you gold, so towns that follow the giant grow rich, but its feet flatten whatever stands in their path. Old giants lie across the land as mountains.</p>
<p><b>Building on the giant.</b> Twenty-one build spots lie across its shoulders, crown, chest, hips, forearms, wrists and thighs. A ladder fixes firm holds for three hundred feet below its spot, for anyone; a platform is a resting place that catches your people when they fall; cannons and braces as before. Cannons on the shoulders, forearms and crown fire at every town but yours. Wedges in a joint bleed it and halve its healing. Cripple both knees and the giant falls to its knees: no grip is lost and the Heart-stone in its chest takes double damage. Shatter the Heart-stone to win, or arm the giant until your town is the last one standing.</p>
<p><b>How the giant treats a town.</b> It wanders in peace until a town's people hurt it: every blow and wedge is remembered against their town, and past bearing it walks to that town and smashes it. Pulling out a wedge or mounting a cannon earns a town its favour, and grudges fade with time. Brindle tends and arms it, Corvel hunts it, and Ashford, your town, is what you make of it. At dusk the giant lies down as a mountain beside the town that treated it best: be that town, or shatter its Heart-stone, or be the last town standing.</p>
<p><b>The giant wakes slowly.</b> It begins asleep and chained at both ankles and both wrists. Attacks can only weaken the chains; once all four are weak, a wake horn, forged in town from twenty sky crystals and sounded at its head for ten seconds, shatters them and wakes it, and the town that wakes it earns its favour; and only then can it move. Even awake it is all but unable to move. Braces bolted to its shoulders, forearms and crown let it walk faster and unlock its stomp, smash and swipe. Once it can walk it wanders, and goes after any town that has hurt it past bearing.</p>
<p><b>Playing the giant.</b> You win by surviving until dusk with your Heart-stone whole and completing three of five tasks: be Freed (all four chains broken), be Braced (three braces), be Avenged (a town that angered you brought below half its walls), be Befriended (a town friendly to you), and be a Wanderer (six thousand paces walked). The HUD shows each. You cannot build: court the towns that brace you and leave the hunters to rue it. Walk with momentum, stomp the ground, smash towns, shake off climbers and swipe a hand across one side of your body. </p>

  if(S.role==='giant'){const J=S.joints,g=S.g,pc=id=>Math.ceil(J[id].hp/J[id].max*100)+'%'+(J[id].crip?' crippled':'');
    const jf=id=>J[id].hp/J[id].max,worst=Math.min(jf('kneeL'),jf('kneeR'),jf('elbowL'),jf('elbowR'),jf('neck'));
    a=chip('Heart',pc('heart'),jf('heart'))+chip('Joints',Math.round(worst*100)+'% worst',worst)+chip('Braces',braces()+'/5')+duskChip;
    {const ts=giantTasks(),n=ts.filter(x=>x.done).length;a+=chip('Tasks',n+'/'+C.GIANT_TASKS,n/C.GIANT_TASKS,' goal')+chip('Climbers',climbers().length);S.taskLine=ts.map(x=>x.name+(x.done?' done':' ('+x.note+')')).join(' \u00b7 ')}
    b=S.t>OPENING.len&&Math.floor(S.t/8)%2?S.taskLine:!g.awake?'Asleep and chained. Someone must climb to your head and wake you ('+Math.round(S.wakeT/C.WAKE_TIME*100)+'%).':S.chains.some(q=>q.hp>0)?'Chains left: '+S.chains.filter(q=>q.hp>0).map(q=>q.name).join(', '):g.fallen>0?'You are down for '+Math.ceil(g.fallen)+' s. They are at your heart.':TOWNS.map((T,i)=>T.name+' '+(factionAlive(i)?mood(i):'ruined')).join(' · ')}
  else{const h=S.you;
    a=chip('HP',Math.ceil(h.hp)+'/'+h.max,h.hp/h.max)+(h.job?chip('Building',h.job.k,h.job.t/h.job.dur,' goal'):'')+(h.mode==='climb'?chip('Grip',Math.ceil(Math.max(0,h.grip)),h.grip/maxGrip(h))+chip('Height',Math.round(h.cl.y*FT)+' ft'):chip('Lv',h.lvl,h.xp/(h.lvl*50)))+
      chip('Gold',h.gold)+chip('Pack',packCount(h)+'/'+packCap(h),1-packCount(h)/packCap(h))+chip('Crystals',h.crystals)+(h.horn?chip('Wake horn','carried'):'')+chip('Kits',[h.kits.anchor&&h.kits.anchor+' anchor',h.kits.wedge&&h.kits.wedge+' wedge',h.kits.cannon&&h.kits.cannon+' cannon',h.kits.brace&&h.kits.brace+' brace'].filter(Boolean).join(', ')||'none')+duskChip;
    const st=tutStep();const q=h.quest;b=st&&S.tut.shown?'Goal: '+st.text:(q?(q.done?'Quest done: return to town. ':'Quest: '+q.text+' ('+Math.min(q.n,q.need)+'/'+q.need+'). '):'No quest: visit a town board. ')+
      (h.mode==='climb'?(restful(cellT(h.cl.x,h.cl.y))?'On a ledge: grip refills while you rest.':'Pick your holds: green moss drains grip, orange stones crumble, white rings are within reach.'):(!S.g.awake?(S.waker?TOWNS[S.waker.town].name+' is sounding the wake horn: '+Math.round(S.wakeT/C.WAKE_TIME*100)+'%':!allWeak()?'The giant sleeps in chains: weaken all four ('+S.chains.filter(c=>c.hp>0&&!chainWeak(c)).length+' still strong), then a wake horn breaks them':(S.humans.some(x=>x.horn&&!x.you)?'Another town has a wake horn. ':'')+'The giant sleeps in chains: forge a wake horn from '+C.HORN_CRYSTALS+' sky crystals to wake it'):S.chains.some(q=>q.hp>0&&q.id.startsWith('ankle'))?'The giant is awake but its ankles are chained':'The giant is '+mood(h.town)+' toward Ashford')+(S.g.fallen>0?' · THE GIANT IS DOWN':''))}
  const sig=a+b;if(sig!==hudSig){hudSig=sig;hud1.innerHTML=a;hud2.innerHTML=String(b).replace(/^([^:.]{2,24}:)/,'<span class="k">$1</span>')}}

// ================= loop =================
let acc=0,last=performance.now();
// the next frame is asked for first and the work is guarded, so one thrown error never freezes the game
function frame(now){requestAnimationFrame(frame);try{frameWork(now)}catch(e){console.error(e)}}
// the opening flight: up into the tearing sky, a slow turn under it, round to the chained giant on its line, then home behind you
function introCamera(){if(!S||!S.introCam||!S.you&&S.role!=='giant')return;const t=S.t,ease=u=>u<0?0:u>1?1:u*u*(3-2*u);if(S.introYaw==null){S.introYaw=cam.yaw;const f=S.you||S.g;S.giantYaw=Math.atan2(S.g.x-f.x,-(S.g.y-f.y))}
  const turn=S.introYaw+.35*ease(t/12),toGiant=S.giantYaw,k=ease((t-11)/4),back=ease((t-17)/4);
  cam.yaw=turn+(((toGiant-turn+Math.PI*3)%(Math.PI*2))-Math.PI)*k;
  cam.pitch=-.55+.25*ease((t-6)/5)+(.12-(-.3))*back;if(t<11)cam.pitch=Math.min(cam.pitch,-.3);
  S.cam.zoom=.75+.25*back+(t>11&&t<17?-.15*Math.sin(Math.PI*(t-11)/6):0);if(t>21.5){S.introCam=false;cam.pitch=.12;S.cam.zoom=1}}
function frameWork(now){introCamera();if(S&&S.trumpetsDue&&S.t>.3&&((se&&se!=='starting')||(actx&&!se)||S.t>2.5)){S.trumpetsDue=false;trumpets()}const dt=Math.min(.1,(now-last)/1000);last=now;pollPad();
  paintFeed(dt);
  if(S&&S.tut&&S.tut.cardDue&&!menu&&!S.fly)openTutorialCard();
  const fl=S&&S.fly?stepFly(dt):null;
  if(S&&!menu&&!S.over&&!S.fly){acc+=dt;while(acc>=C.DT){step(C.DT);acc-=C.DT}}else acc=0;
  if(S){let z=0;if(keys.has('KeyR'))z+=1;if(keys.has('KeyF'))z-=1;z-=padZoom;let yw=padCam.x,pt=padCam.y;if(keys.has('KeyQ'))yw-=1;if(keys.has('KeyE'))yw+=1;if(keys.has('KeyT'))pt-=1;if(keys.has('KeyG'))pt+=1;if((yw||pt)&&!(S.you&&S.you.mode==='climb'))camTurn(yw*CAM.YAW_RATE*dt,pt*CAM.PITCH_RATE*dt);if(z)zoomBy(Math.exp(z*dt*1.2));S.cam.czoom+=(S.cam.zoom-S.cam.czoom)*Math.min(1,dt*8);
    const focus=fl?fl:S.role==='giant'?S.g:(S.you.mode==='climb'?S.g.feet[S.you.leg]:S.you);if(fl){S.cam.zoom=1-.3*fl.k}S.cam.x+=(focus.x-S.cam.x)*Math.min(1,dt*5);S.cam.y+=(focus.y-S.cam.y)*Math.min(1,dt*5)}
  shakeA*=Math.pow(.02,dt);if(shakeA<.3)shakeA=0;
  seFrame();render();paintHud();paintButtons()}
// test hook: run whole matches without the screen
window.__col={newGame:(role,seed)=>{const s=newGame(role,seed);s.headless=true;return s},start,step:n=>{for(let i=0;i<n&&S&&!S.over;i++)step(C.DT)},get S(){return S},C,JOINTS,bfs,set autoplay(v){if(S)S.autoplay=v}};
openTitle();requestAnimationFrame(frame);
</script>
