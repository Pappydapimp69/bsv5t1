<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colossus</title>
<style>
[hidden]{display:none!important}
/* Layout: HUD row, stage, action bar (a right-hand column on short landscape screens). Single dark look by choice. */
:root{color-scheme:dark;--bg:#11141b;--panel:#1a1f28;--ink:#eee9dd;--dim:#a9afbb;--accent:#ffcf6a;--line:#363e4c;--bad:#ff8f80;--good:#9be08a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "stage" "pad"}
#hud{grid-area:hud;min-width:0;background:var(--panel);border-bottom:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));padding-top:max(6px,env(safe-area-inset-top));min-height:50px}
#hud .l1{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
#hud b{color:var(--accent);font-weight:600}
#hud .warn{color:var(--bad);font-weight:600}
#hud .l2{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(8,10,14,.85);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:14px;pointer-events:none;max-width:92%;text-align:center;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#pad{grid-area:pad;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));touch-action:none}
.ab{position:relative;min-height:54px;min-width:0;overflow:hidden;border-radius:10px;border:2px solid #56627a;background:#252c39;color:var(--ink);font:600 14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px;touch-action:none}
.ab .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ab small{font-weight:400;font-size:11px;color:var(--dim);line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ab .k{position:absolute;top:2px;left:5px;font-size:10px;color:var(--accent);font-weight:700}
.ab.off{opacity:.55;border-style:dashed}
.ab:active{background:#34405a}
@media (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:minmax(0,1fr) 200px;grid-template-rows:auto 1fr;grid-template-areas:"hud hud" "stage pad"}
  #pad{grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;border-top:0;border-left:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) 8px}
}
.ov{position:absolute;inset:0;background:rgba(6,8,12,.86);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:480px;width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:28px;letter-spacing:.04em;color:var(--accent)}
.card h2{margin:0 0 8px;font-size:20px;color:var(--accent)}
.card p{margin:6px 0}
.card .dim{color:var(--dim);font-size:13px}
.mb{display:block;width:100%;min-height:48px;margin:6px 0;border-radius:10px;border:2px solid #56627a;background:#252c39;color:var(--ink);font:600 16px system-ui,sans-serif;text-align:left;padding:8px 12px}
.mb small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.mb.focus{border-color:var(--accent);background:#33405a;outline:none}
.mb.off{opacity:.6;border-style:dashed}
.mb:focus-visible{outline:2px solid var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
</style></head><body>

  <div id="hud"><div class="l1" id="hud1">Colossus</div><div class="l2" id="hud2"></div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div class="ov" id="ov"><div class="card" id="card"></div></div>
  </div>
  <div id="pad"></div>
</div>

function helpHtml(){return`<p><b>Humans.</b> Take quests and hunt beasts for gold, buy kits in town, then walk to one of the giant's planted feet and climb. You climb hold to hold: push a direction to reach for the best hold that way, or tap one. Every reach costs grip, hanging drains it, mossy holds drain it faster and loose stones crumble a moment after you grab them. Stand on a ledge or rest by your own anchor to refill it. Lunge for a hold beyond your reach across bare stone. A falling climber lands on the next ledge below or is caught by an anchor of their own town.</p>
<p><b>Ruins.</b> The old giants lying across the land are ruins, guarded by trolls. Search their ribs for gold, sky crystals and kits; each fills again after a few minutes.</p>
<p><b>Quests.</b> Each town's board shows three jobs and changes every minute: fetch sky crystals, carry parcels to other settlements, hunt beasts, put up buildings. Later boards add climbing the giant and pulling wedges from it. None of them asks you to attack the giant: that is your own choice.</p>
<p><b>Building the world.</b> Your build area is the dashed ring around your homes. Houses grow your town and push the ring outward wherever you put them, so a line of houses reaches across the land; watchtowers that shoot beasts can stand anywhere inside it; and or a whole new outpost of your people. Settle beside the giant's footprint lakes and they pay you gold, so towns that follow the giant grow rich, but its feet flatten whatever stands in their path. Old giants lie across the land as mountains.</p>
<p><b>Building on the giant.</b> Cannons on the shoulders, forearms and crown fire at every town but yours. Wedges in a joint bleed it and halve its healing. Cripple both knees and the giant falls to its knees: no grip is lost and the Heart-stone in its chest takes double damage. Shatter the Heart-stone to win, or arm the giant until your town is the last one standing.</p>
<p><b>How the giant treats a town.</b> It wanders in peace until a town's people hurt it: every blow and wedge is remembered against their town, and past bearing it walks to that town and smashes it. Pulling out a wedge or mounting a cannon earns a town its favour, and grudges fade with time. Brindle tends and arms it, Corvel hunts it, and Ashford, your town, is what you make of it. When the giant leaves, or at dusk when it lies down as a mountain instead, it favours the town that treated it best: be that town, or shatter its Heart-stone, or be the last town standing.</p>
<p><b>The giant wakes slowly.</b> It begins asleep and chained at both ankles and both wrists. Only a wake horn, forged in town from twenty sky crystals, wakes it: sound it at its head and hold still for ten seconds while it stirs, and the town that wakes it earns its favour; then the ankle chains must be broken before it can take a step, and the wrist chains before it can smash or swipe. Even awake it is all but unable to move. Braces bolted to its shoulders, forearms and crown let it walk faster and unlock its stomp, smash and swipe. Once it can walk it heads for the gap in the far hills; if it walks through before dusk it is gone, and remembers kindly the town that treated it best.</p>
<p><b>Playing the giant.</b> You win by walking out through the gap before dusk. You cannot build: court the towns that brace you and leave the hunters to rue it. Walk with momentum, stomp the ground, smash towns, shake off climbers and swipe a hand across one side of your body. </p>
<p class="dim">Keys: WASD or arrows move, J K L H act, Q and E turn the camera, T and G tilt it, R and F zoom, C resets it, Esc pauses. Pad: left stick moves, right stick turns and tilts, triggers zoom, R3 resets, A B X Y act, Start pauses. Touch: tap where to walk or which hold to climb to, drag to turn and tilt, pinch to zoom.</p>`}

    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-px,y-px*1.1,px*2,4);ctx.fillStyle='#c9c9d0';ctx.fillRect(x-px,y-px*1.1,px*2*ch.hp/ch.max,4)}
  for(const s of S.sites){const x=toX(s.c)+px/2,y=toY(s.r)+px/2;ctx.strokeStyle='#ffcf6a';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(x+Math.cos(a)*px*.8,y+Math.sin(a)*px*.8)}ctx.closePath();ctx.stroke();
    if(s.build){ctx.fillStyle=TOWNS[s.build.town].col;ctx.fillRect(x-px*.7,y-px*1.2,px*1.4,px*.9);ctx.fillStyle='#222';ctx.fillRect(x,y-px*1.05,px*1.3,px*.45)}}
  for(const a of S.anchors){const x=toX(a.c)+px/2,y=Y(a.c,a.r+.5);ctx.strokeStyle=TOWNS[a.town].col;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,px*.35,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+px*.35);ctx.lineTo(x,y+px*1.4);ctx.stroke()}
  if(cl.path){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(toX(cl.x),Y(cl.x,cl.y));for(const[r,c]of cl.path)ctx.lineTo(toX(c+.5),Y(c,r+.5));ctx.stroke();ctx.setLineDash([])}
  for(const f of S.fx)if(f.k==='cellmark'){ctx.strokeStyle='#fff';ctx.globalAlpha=1-f.t/f.life;ctx.strokeRect(toX(f.c),Y(f.c,f.r+1),px,px);ctx.globalAlpha=1}
  for(const o of climbers()){const x=toX(o.cl.x),y=Y(o.cl.x,o.cl.y),T=TOWNS[o.town];if(y<-20||y>H+20)continue;
    ctx.fillStyle=T.col;shapePath(ctx,x,y-px*.2,px*.55,T.shape);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle='#111';ctx.beginPath();ctx.moveTo(x-px*.5,y-px*.6);ctx.lineTo(x-px*.8,y-px*1.1);ctx.moveTo(x+px*.5,y-px*.6);ctx.lineTo(x+px*.8,y-px*1.1);ctx.stroke();
    if(o.you){const f=clamp(o.grip/maxGrip(o),0,1);ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.arc(x,y-px*.2,px*1.2,0,7);ctx.stroke();
      ctx.strokeStyle=f<.25?'#ff8f80':f<.5?'#ffcf6a':'#9be08a';ctx.beginPath();ctx.arc(x,y-px*.2,px*1.2,-Math.PI/2,-Math.PI/2+f*Math.PI*2);ctx.stroke()}}
  ctx.restore();
  // height gauge with ledges and joints marked
  const gx=W-18,gt=16,gb=H-16;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(gx-6,gt-4,14,gb-gt+8);
  for(const id in JOINTS){const J=JOINTS[id];ctx.fillStyle=id==='heart'?'#ff4d5e':'#ff9a4a';ctx.fillRect(gx-4,gb-(J.r1/ROWS)*(gb-gt),10,3)}
  ctx.fillStyle='#fff';ctx.fillRect(gx-7,gb-(cl.y/ROWS)*(gb-gt)-2,16,4);
  ctx.font='600 13px system-ui';ctx.textAlign='right';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;const ht=Math.round(cl.y*FT)+' ft';ctx.strokeText(ht,gx-12,gb-(cl.y/ROWS)*(gb-gt)+4);ctx.fillText(ht,gx-12,gb-(cl.y/ROWS)*(gb-gt)+4);
  if(g.wind&&(g.wind.k==='shake'||g.wind.k==='swipe')){ctx.strokeStyle=`rgba(255,90,70,${.5+.5*Math.sin(S.t*20)})`;ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8);
    ctx.font='700 20px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;const s=g.wind.k==='shake'?'BRACE: hold still':'HAND INCOMING: '+(g.wind.side==='L'?'left':'right')+' side';ctx.strokeText(s,W/2,48);ctx.fillText(s,W/2,48)}
  if(g.fallen>0){ctx.font='700 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffcf6a';ctx.strokeStyle='#000';ctx.lineWidth=4;const s='The giant is down: '+Math.ceil(g.fallen)+' s to strike the Heart-stone';ctx.strokeText(s,W/2,H-20);ctx.fillText(s,W/2,H-20)}}

// ================= HUD =================
const hud1=document.getElementById('hud1'),hud2=document.getElementById('hud2');let hudSig='';
function clock(){const s=Math.max(0,C.DUSK-S.t);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function mood(i){const v=S.grudge[i];return v>=C.ANGER?'ANGRY':v>=C.ANGER*.5?'wary':v<-60?'friendly':'calm'}
function paintHud(){if(!S){if(hudSig!=='t'){hudSig='t';hud1.innerHTML='<b>Colossus</b>';hud2.textContent='A giant, three towns, and the people who climb it.'}return}
  let a,b;
  if(S.role==='giant'){const J=S.joints,g=S.g,pc=id=>Math.ceil(J[id].hp/J[id].max*100)+'%'+(J[id].crip?' crippled':'');
    a=`<span>Dusk <b>${clock()}</b></span><span>Braces <b>${braces()}/5</b></span><span>Gap <b>${Math.round(Math.hypot(g.x-S.exit.x,g.y-S.exit.y)/10)*10}</b></span><span>Heart <b>${pc('heart')}</b></span><span>Knees <b>${pc('kneeL')}</b> / <b>${pc('kneeR')}</b></span><span>Elbows <b>${pc('elbowL')}</b> / <b>${pc('elbowR')}</b></span><span>Neck <b>${pc('neck')}</b></span><span>Climbers <b>${climbers().length}</b></span>`;
    b=!g.awake?'Asleep and chained. Someone must climb to your head and wake you ('+Math.round(S.wakeT/C.WAKE_TIME*100)+'%).':S.chains.some(q=>q.hp>0)?'Chains left: '+S.chains.filter(q=>q.hp>0).map(q=>q.name).join(', '):g.fallen>0?'You are down for '+Math.ceil(g.fallen)+' s. They are at your heart.':TOWNS.map((T,i)=>T.name+' '+(factionAlive(i)?mood(i):'ruined')).join(' · ')}
  else{const h=S.you;
    a=`<span>Dusk <b>${clock()}</b></span><span>HP <b class="${h.hp<h.max*.3?'warn':''}">${Math.ceil(h.hp)}/${h.max}</b></span>`+(h.mode==='climb'?`<span>Grip <b class="${h.grip<maxGrip(h)*.25?'warn':''}">${Math.ceil(Math.max(0,h.grip))}</b></span><span>Height <b>${Math.round(h.cl.y*FT)} ft</b></span>`:`<span>Lv <b>${h.lvl}</b></span>`)+
      `<span>Gold <b>${h.gold}</b></span><span>Crystals <b>${h.crystals}</b>${h.horn?' Horn':''}</span><span>Anchors <b>${h.kits.anchor}</b> Wedges <b>${h.kits.wedge}</b> Cannons <b>${h.kits.cannon}</b></span>`;
    const q=h.quest;b=(q?(q.done?'Quest done: return to town. ':'Quest: '+q.text+' ('+Math.min(q.n,q.need)+'/'+q.need+'). '):'No quest: visit a town board. ')+
      (h.mode==='climb'?(restful(cellT(h.cl.x,h.cl.y))?'On a ledge: grip refills while you rest.':'Pick your holds: green moss drains grip, orange stones crumble, white rings are within reach.'):(!S.g.awake?'The giant sleeps in chains: forge a wake horn from '+C.HORN_CRYSTALS+' sky crystals to wake it':S.chains.some(q=>q.hp>0&&q.id.startsWith('ankle'))?'The giant is awake but its ankles are chained':'The giant is '+mood(h.town)+' toward Ashford')+(S.g.fallen>0?' · THE GIANT IS DOWN':''))}
  const sig=a+b;if(sig!==hudSig){hudSig=sig;hud1.innerHTML=a;hud2.textContent=b}}

// ================= loop =================
let acc=0,last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;pollPad();
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on')}
  if(S&&!menu&&!S.over){acc+=dt;while(acc>=C.DT){step(C.DT);acc-=C.DT}}else acc=0;
  if(S){let z=0;if(keys.has('KeyR'))z+=1;if(keys.has('KeyF'))z-=1;z-=padZoom;let yw=padCam.x,pt=padCam.y;if(keys.has('KeyQ'))yw-=1;if(keys.has('KeyE'))yw+=1;if(keys.has('KeyT'))pt-=1;if(keys.has('KeyG'))pt+=1;if((yw||pt)&&!(S.you&&S.you.mode==='climb'))camTurn(yw*CAM.YAW_RATE*dt,pt*CAM.PITCH_RATE*dt);if(z)zoomBy(Math.exp(z*dt*1.2));S.cam.czoom+=(S.cam.zoom-S.cam.czoom)*Math.min(1,dt*8);
    const focus=S.role==='giant'?S.g:(S.you.mode==='climb'?S.g.feet[S.you.leg]:S.you);S.cam.x+=(focus.x-S.cam.x)*Math.min(1,dt*5);S.cam.y+=(focus.y-S.cam.y)*Math.min(1,dt*5)}
  shakeA*=Math.pow(.02,dt);if(shakeA<.3)shakeA=0;
  seFrame();render();paintHud();paintButtons();requestAnimationFrame(frame)}
// test hook: run whole matches without the screen
window.__col={newGame:(role,seed)=>{const s=newGame(role,seed);s.headless=true;return s},start,step:n=>{for(let i=0;i<n&&S&&!S.over;i++)step(C.DT)},get S(){return S},C,JOINTS,bfs,set autoplay(v){if(S)S.autoplay=v}};
openTitle();requestAnimationFrame(frame);
</script>
