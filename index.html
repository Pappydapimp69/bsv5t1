<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1a2b">
<title>Prank Day</title>
<style>
[hidden] { display: none !important; }
:root{
  --bg:#1d1a2b; --panel:#2a2540; --panel2:#3a3258; --line:#5d5288; --ink:#fff6e8; --dim:#d6cce6;
  --you:#ffb02e; --moss:#a594ff; --good:#9be37a; --bad:#ff7a7a; --sour:#f5d04b; --focus:#ffe066;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:ui-rounded,"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;height:100dvh;display:grid;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"hud" "msg" "view" "ctl" "side";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (orientation: landscape){
  #app{grid-template-columns:minmax(0,1fr) clamp(196px,26vw,340px);grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"hud hud" "msg side" "view side" "ctl side"}
}
#hud{grid-area:hud;display:flex;align-items:center;gap:8px;padding:4px 8px;min-height:52px;background:var(--panel);border-bottom:2px solid #000}
.sc{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;white-space:nowrap}
.sc small{font-weight:600;font-size:13px;color:var(--dim)}
.bY{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--you);border:2px solid #000}
.bM{display:inline-block;width:14px;height:14px;background:var(--moss);transform:rotate(45deg);border:2px solid #000;margin:0 2px}
#clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;white-space:nowrap}
#envl{font-size:13px;color:var(--dim);white-space:nowrap}
@media (max-width:440px){.sc .nmx{display:none} #envl{display:none} #clock{font-size:16px}}
#msg{grid-area:msg;min-height:34px;display:flex;align-items:center;justify-content:center;padding:3px 8px}
#msg span{background:rgba(8,6,16,.9);padding:4px 12px;border-radius:9px;font-size:15px;line-height:1.25;text-align:center;border:1px solid #4b4270}
#msg span.warn{border-color:var(--bad)} #msg span.good{border-color:var(--good)}
#view{grid-area:view;position:relative;min-height:0;min-width:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ctl{grid-area:ctl;min-height:60px;display:flex;align-items:center;gap:8px;padding:4px 8px calc(4px + env(safe-area-inset-bottom)) 8px;background:var(--panel);border-top:2px solid #000}
#ctlHint{flex:1;font-size:14px;color:var(--dim);line-height:1.3}
#ctlHint b{color:var(--ink)}
#side{grid-area:side;min-height:0;min-width:0;background:var(--panel);border-top:2px solid #000;height:150px;position:relative}
@media (orientation: landscape){ #side{height:auto;border-top:0;border-left:2px solid #000} }
#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:5px;height:100%}
@media (orientation: landscape){ #cards{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr))} }
.card{background:var(--panel2);border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;border:2px solid transparent;font-size:13px}
.card.hot{border-color:var(--sour)}
.card .top{display:flex;align-items:center;gap:5px}
.card .face{width:32px;height:32px;flex:none}
.card .nm{font-weight:800;font-size:14px}
.card .nx{color:var(--dim);font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (orientation: landscape){.card .nx{-webkit-line-clamp:1}}
.tags{display:flex;gap:3px}
.tg{position:relative;width:24px;height:24px;flex:none;background:#211c36;border-radius:6px}
.tg svg{position:absolute;inset:2px;width:20px;height:20px}
.tg .mk{inset:auto;right:-3px;bottom:-3px;width:13px;height:13px}
.tg.hint{outline:1px dashed #9a8fc4}
.ln{font-size:12px;color:var(--dim);white-space:nowrap}
.card.out{border-color:#7fb8d8}
.card .md{font-weight:700;font-size:12px;color:var(--dim);white-space:nowrap}
.card .pips{width:22px;height:8px;margin-right:3px;vertical-align:0}
.ln b{color:var(--ink)}
#picker{position:absolute;inset:0;padding:5px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
#pkInfo{font-size:13px;line-height:1.25;color:var(--dim);min-height:17px}
#pkInfo b{color:var(--ink)}
#pkBtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;flex:1;min-height:0;align-content:start}
@media (orientation: landscape){ #pkBtns{grid-template-columns:repeat(2,minmax(0,1fr))} }
#pkBtns button{min-height:46px;padding:3px 5px;display:flex;align-items:center;gap:5px;text-align:left;font-size:13px;line-height:1.15}
#pkBtns button svg{width:22px;height:22px;flex:none}
#pkBtns button .k{font-size:11px;color:var(--dim)}
button{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:12px;min-width:44px;min-height:44px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible,button.kf{outline:3px solid var(--focus);outline-offset:2px;border-color:var(--focus)}
button[aria-disabled="true"]{opacity:.6;border-style:dashed}
#pauseB{padding:6px 10px;font-weight:800}
#act{min-width:104px;min-height:52px;font-size:18px;font-weight:900;background:var(--you);color:#2a1600;border-color:#000}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,20,.78);padding:12px;z-index:5}
#ovp{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 18px;width:min(460px,100%);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:9px}
#ovp h1{margin:0;font-size:34px;letter-spacing:.5px;color:var(--you);text-shadow:3px 3px 0 #000}
#ovp h2{margin:0;font-size:22px}
#ovp p{margin:0;line-height:1.35;color:var(--dim);font-size:15px}
#ovp p b{color:var(--ink)}
#ovp .row{display:flex;gap:8px;flex-wrap:wrap}
#ovp .row button{flex:1}
#ovp .btns{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--panel);padding-top:6px;box-shadow:0 -10px 10px -4px var(--panel)}
#ovp button{font-size:17px;font-weight:700}
@media (orientation:landscape) and (max-height:520px){#ovp.wide{width:min(820px,100%)}#ovp .cols{columns:2;column-gap:20px}#ovp .cols p{break-inside:avoid;margin:0 0 8px;font-size:14px}#ovp .btns{flex-direction:row;flex-wrap:wrap}#ovp .btns button{flex:1 1 140px}}
#ovp button.main{background:var(--you);color:#2a1600;border-color:#000}
.tot{display:flex;justify-content:space-around;font-size:22px;font-weight:900;padding:4px 0}
.env{background:#f3e6c8;color:#2b2014;border-radius:10px;padding:8px 10px;font-size:15px;line-height:1.3}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

/* ============ game state ============ */
let G={phase:'title',prev:null,s:null,fast:false,tut:-1,tutT:0,msg:null,fx:[],texts:[],mem:null,blankMem:false,botOn:false,lastPhaseBeforeSettings:'title'};
let uiDirty=true;
function blankMemory(){return{rooms:Array(NROOMS).fill(0),w:[1,1,1],last:-1,best:-1,games:0}}
function newMatch(seed,opt={}){
  const rng=streams(seed);
  const s={seed,rng,day:0,t:0,tick:0,score:{you:0,moss:0},dayScore:{you:0,moss:0},folk:[],pranks:[],traps:[],
    inv:[],player:null,moss:null,firstLanded:false,guess:-1,roomCounts:Array(NROOMS).fill(0),bestLaugh:null,walkers:[],
    trapPlan:[],trapsDone:0,lastLand:{you:-99,moss:-99},history:[],
    stats:{laugh:0,sour:0,turned:0,fizzled:0,busted:0,caught:0,defused:0,guessed:0,mossPranks:0,stormed:0,park:0},learn:{}};
  // each resident gets one love and one hate, seeded per match
  for(const d of FOLK){
    const tags=TAGS.slice();for(let i=tags.length-1;i>0;i--){const j=Math.floor(rng.world()*(i+1));[tags[i],tags[j]]=[tags[j],tags[i]]}
    const att={};TAGS.forEach(t=>att[t]=0);att[tags[0]]=1;att[tags[1]]=-1;
    s.folk.push({d,id:d.id,att,Lbase:Math.round(d.L*(0.88+rng.world()*0.24)*10)/10,f:0,x:0,climb:null,face:1,wind:0,outing:null,storm:false,stormed:false});
    s.learn[d.id]={att:{},hint:{},lo:0,hi:Infinity};
  }
  G.mem=opt.blankMem?blankMemory():Object.assign(blankMemory(),store.get('moss',{}));
  if(!Array.isArray(G.mem.rooms))G.mem.rooms=[];while(G.mem.rooms.length<NROOMS)G.mem.rooms.push(0);
  G.blankMem=!!opt.blankMem;
  G.s=s;G.fx=[];G.texts=[];
  G.tut=(opt.tutorial??!settings.tutorialDone)?0:-1;G.tutT=0;
  startDay();
}
function startDay(){
  const s=G.s;s.t=0;s.pranks=[];s.traps=[];s.inv=PROPS.map(p=>p.stock);s.dayScore={you:0,moss:0};
  s.roomCounts=Array(NROOMS).fill(0);s.bestLaugh=null;s.trapsDone=0;s.trapPlan=[DAY_LEN*.28,DAY_LEN*.6];s.lastLand={you:-99,moss:-99};
  s.dayLog={you:[],moss:[]};
  for(const r of s.folk){
    const n=r.d.routine.length;r.route=[];
    const off=Math.floor(s.rng.route()*n);
    for(let i=0;i<n;i++){const [sp,dur]=r.d.routine[(i+off)%n];r.route.push({sp:SP[sp].i,dur:dur*(0.8+s.rng.route()*0.4)})}
    r.ri=0;const first=SPOTS[r.route[0].sp];r.f=first.f;r.x=first.x;r.climb=null;r.state='use';r.t=r.route[0].dur*(0.3+s.rng.route()*0.5);
    r.face=first.face||1;r.target=first.i;r.Lmul=1;r.hits=[];r.react=0;r.sulk=0;r.mood='calm';r.think=4+s.rng.world()*8;r.thought=null;r.seeT=0;
    r.outing=null;r.storm=false;r.stormed=false;
  }
  // two passers-by in the park: they watch (a short sight) and laugh along
  s.walkers=[0,1].map(i=>({walker:true,d:{id:i?'mum':'gramps',name:'a passer-by',h:1.9,speed:1.6,voice:{tract:.17,sac:.08,f0:i?190:130}},
    f:0,x:i?36:27.5,face:i?-1:1,climb:null,state:'walk',react:0,sulk:0,seeT:0,mood:'calm',sight:4.5,pause:0,walkT:0}));
  s.player={f:0,x:12,climb:null,face:1,goal:null,busy:null,stun:0,walkT:0};
  s.moss={f:1,x:11,climb:null,face:-1,goal:null,busy:null,wait:0,cool:6,think:0,walkT:0};
  s.guess=mossGuess();
  picker.close();
}

/* ============ Moss's model of the player (second person) ============ */
function argmax(a){let b=-1,bv=-Infinity;a.forEach((v,i)=>{if(v>bv){bv=v;b=i}});return bv>0?b:-1}
function experts(){const m=G.mem,s=G.s;const tot=m.rooms.map((v,i)=>v+(s.history.reduce((a,h)=>a+(h.counts[i]||0),0)));
  return[argmax(tot),m.last,m.best]}
function mossGuess(){
  const ex=experts(),m=G.mem,votes=Array(NROOMS).fill(0);
  ex.forEach((r,i)=>{if(r>=0)votes[r]+=m.w[i]});
  const g=argmax(votes);
  return g>=0?g:Math.floor(G.s.rng.moss()*6);// a first guess is a room of the house
}

/* ============ movement shared by every actor ============ */
function moveActor(a,tf,tx,speed){
  if(a.climb){a.climb.t+=TICK/a.climb.dur;
    if(a.climb.t>=1){a.f=a.climb.to;a.x=a.f?STAIR.x1:STAIR.x0;a.climb=null}else{a.x=STAIR.x0+(STAIR.x1-STAIR.x0)*(a.climb.to?a.climb.t:1-a.climb.t)}
    return false}
  const gx=a.f===tf?tx:(a.f?STAIR.x1:STAIR.x0);
  const dx=gx-a.x,stepL=speed*TICK;
  if(Math.abs(dx)<=stepL){a.x=gx;
    if(a.f!==tf){a.climb={to:tf,t:0,dur:4.6/speed};a.face=tf?1:-1;return false}
    return true}
  a.x+=Math.sign(dx)*stepL;a.face=Math.sign(dx);a.walkT=(a.walkT||0)+TICK*speed;return false;
}
const actorY=a=>a.climb?(a.climb.to?a.climb.t:1-a.climb.t)*FH:a.f*FH;
const actorRoom=a=>a.climb?-1:roomOf(a.f,a.x);
function canSee(r,a){
  if(r.climb||r.react>0||r.sulk>0||a.climb)return false;
  if(actorRoom(r)!==actorRoom(a))return false;
  const dx=a.x-r.x;if(r.sight&&Math.abs(dx)>r.sight)return false;return Math.abs(dx)<0.75||r.face*dx>0;
}
const watchers=()=>G.s.folk.concat(G.s.walkers);
// where a resident goes next: their outing in the park while they are out, else their home routine
function seqOf(r){return r.outing?{list:r.outing.route,i:r.outing.i}:{list:r.route,i:r.ri}}
function upcoming(r,k){const q=seqOf(r);return q.list[(q.i+k)%q.list.length].sp}
const prankAt=i=>G.s.pranks.find(p=>p.spot===i);
const trapAt=i=>G.s.traps.find(p=>p.spot===i);
const userOf=i=>G.s.folk.find(r=>!r.climb&&r.state==='use'&&r.target===i&&Math.abs(r.x-SPOTS[i].x)<0.3);

/* ============ the laugh dial ============ */
function fedMul(r){const s=G.s;return 1+0.5*r.hits.filter(t=>s.t-t<30).length}
const tagMul=a=>a===1?0.6:a===-1?1.6:1;
function trigger(p,r){
  const s=G.s,pr=PROPS[p.prop],spot=SPOTS[p.spot];
  s.pranks=s.pranks.filter(q=>q!==p);
  const V=pr.base*p.level*tagMul(r.att[pr.tag])*fedMul(r);
  const st0=stageOf(r),ml=moodLine(r),L=r.Lbase*r.Lmul*ml;
  let kind,pts;
  if(V<=L){kind='laugh';pts=Math.round(10*V*MOODS[st0].pay)}
  else if(V<=1.25*L){kind='sour';pts=Math.round(5*L)}
  else{kind='turned';pts=-Math.round(15*(V-L))}
  const combo=kind!=='turned'&&s.t-s.lastLand[p.owner]<5;
  if(combo)pts=Math.round(pts*1.5);
  let onl=0;
  if(kind!=='turned')for(const o of watchers()){if(o!==r&&!o.climb&&o.sulk<=0&&actorRoom(o)===actorRoom(r)){onl++;pts+=Math.round(5*V);o.react=1.6;o.mood='laugh';snd.laugh(o,.6)}}
  s.score[p.owner]+=pts;s.dayScore[p.owner]+=pts;s.lastLand[p.owner]=s.t;
  r.hits.push(s.t);r.react=kind==='turned'?2.2:2;r.mood=kind;r.thought=null;
  if(kind==='turned'){r.Lmul*=0.85;r.sulk=15}
  // what everyone can now see about this resident
  const lr=s.learn[r.id];lr.att[pr.tag]=r.att[pr.tag];
  const Vn=V/(r.Lmul*ml)*(kind==='turned'?0.85:1);
  if(kind==='laugh')lr.lo=Math.max(lr.lo,Vn);
  else if(kind==='sour'){lr.lo=Math.max(lr.lo,Vn/1.25);lr.hi=Math.min(lr.hi,Vn)}
  else lr.hi=Math.min(lr.hi,Vn/1.25);
  if(p.owner==='you'){
    s.stats[kind]++;if(!s.firstLanded){s.firstLanded=true}
    if(!s.bestLaugh||pts>s.bestLaugh.pts)s.bestLaugh={pts,room:spot.room,text:`${pr.short} on ${r.d.name} at the ${spot.name.toLowerCase()}`};
    if(spot.room===PARK)s.stats.park++;
  }else s.stats.mossPranks++;
  // the mood it leaves, which lasts into the next days
  r.wind=Math.min(WIND_MAX,r.wind+WIND[kind]);const st1=stageOf(r);
  if(r.outing)r.outing.stops=Math.min(6,r.outing.stops+1);
  else if(st1>=STORM_STAGE&&!r.stormed&&s.t<DAY_LEN-25){r.storm=true;r.stormed=true}
  if(st1>st0&&!r.storm)floatAt(r.f,r.x,`${r.d.name} is ${MOODS[st1].name.toLowerCase()} now`,p.owner,'sour',actorY(r)+r.d.h+1.5);
  s.dayLog[p.owner].push({who:r.id,kind,pts,prop:pr.id});
  const word={laugh:combo?'Combo laugh!':'Laugh!',sour:'Sour…',turned:'Too far!'}[kind];
  floatText(r,`${word} ${pts>0?'+':''}${pts}${onl?` (${onl} watching)`:''}`,p.owner,kind);
  effect(pr.id,r);
  snd.prop(pr.id,r);
  if(kind==='laugh')snd.laugh(r,1);else if(kind==='sour')snd.sour(r);else snd.grumble(r);
  if(r.storm)toast(`${r.d.name} is ${MOODS[st1].name.toLowerCase()} and storms out to the park. Follow them and keep pranking!`,'warn');
  else if(kind==='turned')toast(`${r.d.name} is fed up! ${p.owner==='you'?'You':'Moss'} lose${p.owner==='you'?'':'s'} ${-pts}. They sulk and their line drops for today.`,'warn');
  if(!G.fast&&kind==='turned'&&!reducedMotion())shake=0.35;
  uiDirty=true;
}

/* ============ residents ============ */
function startOuting(r){
  const s=G.s,sp=PARK_USE.slice();for(let i=sp.length-1;i>0;i--){const j=Math.floor(s.rng.world()*(i+1));[sp[i],sp[j]]=[sp[j],sp[i]]}
  r.outing={stops:stageOf(r)>=3?4:3,i:0,route:sp.map(id=>({sp:SP[id].i,dur:6+s.rng.world()*3}))};
  r.storm=false;r.sulk=0;r.mood='calm';r.state='walk';r.target=r.outing.route[0].sp;r.thought=null;
  s.stats.stormed++;snd.grumble(r);uiDirty=true;
}
function tickFolk(r){
  const s=G.s;
  if(r.react>0){r.react-=TICK;if(r.react<=0){r.mood=r.sulk>0?'turned':'calm';if(r.storm)startOuting(r)}return}
  if(r.sulk>0){r.sulk-=TICK;if(r.sulk<=0)r.mood='calm';return}
  if(r.state==='use'){
    r.t-=TICK;
    r.think-=TICK;
    if(r.think<=0){const pick=TAGS.filter(t=>r.att[t]!==0);const tg=pick[Math.floor(s.rng.world()*pick.length)];
      r.thought={tag:tg,att:r.att[tg],t:3};s.learn[r.id].hint[tg]=r.att[tg];r.think=10+s.rng.world()*8;uiDirty=true}
    if(r.thought){r.thought.t-=TICK;if(r.thought.t<=0)r.thought=null}
    if(r.t<=0){if(r.outing){const o=r.outing;if(--o.stops<=0){r.outing=null;r.target=r.route[r.ri].sp;floatText(r,`${r.d.name} heads home`,'','calm');uiDirty=true}else{o.i=(o.i+1)%o.route.length;r.target=o.route[o.i].sp}}else{r.ri=(r.ri+1)%r.route.length;r.target=r.route[r.ri].sp}r.state='walk';r.thought=null}
    return;
  }
  const sp=SPOTS[r.target],px=r.x,pf=r.f,wasClimb=!!r.climb;
  const arrived=moveActor(r,sp.f,sp.x,r.d.speed);
  if(!wasClimb&&!r.climb&&r.f===pf){
    for(const p of s.pranks){const q=SPOTS[p.spot];if(q.pass&&q.f===r.f&&p.spot!==r.target&&(px-q.x)*(r.x-q.x)<=0&&px!==r.x){trigger(p,r);return}}
  }
  if(arrived){r.state='use';r.t=(r.outing?r.outing.route[r.outing.i]:r.route[r.ri]).dur;if(sp.face)r.face=sp.face;const p=prankAt(r.target);if(p)trigger(p,r)}
}

function tickWalkers(){
  const s=G.s;
  for(const w of s.walkers){if(w.seeT>0)w.seeT-=TICK;
    if(w.react>0){w.react-=TICK;if(w.react<=0)w.mood='calm';continue}
    if(w.pause>0){w.pause-=TICK;continue}
    w.x+=w.face*w.d.speed*TICK;w.walkT+=TICK*w.d.speed;
    if(w.x>PARK_X1-.7||w.x<W+1.2){w.x=Math.max(W+1.2,Math.min(PARK_X1-.7,w.x));w.face=-w.face;w.pause=1+s.rng.walk()*2.5}
    else if(s.rng.walk()<TICK/7)w.pause=1.5+s.rng.walk()*2}
}

/* ============ player ============ */
const inp={l:0,r:0,u:0,d:0,stick:0,stickY:0};
function playerMoveAxis(){let ax=(inp.r?1:0)-(inp.l?1:0);if(Math.abs(inp.stick)>Math.abs(ax))ax=inp.stick;return ax}
function nearSpot(a){let b=null,bd=REACH;if(a.climb)return null;for(const s of SPOTS){if(s.f!==a.f)continue;const d=Math.abs(s.x-a.x);if(d<=bd){bd=d;b=s}}return b}
function tickPlayer(){
  const s=G.s,pl=s.player;
  if(pl.stun>0){pl.stun-=TICK;return}
  const ax=playerMoveAxis();
  if(pl.busy){
    if(Math.abs(ax)>0.3){cancelBusy('You moved, so it was left unfinished.');return}
    pl.busy.t+=TICK;
    if(pl.busy.kind==='set'||pl.busy.kind==='load'){
      const seer=watchers().find(r=>canSee(r,pl));
      if(seer){spotted(seer);return}
    }
    if(pl.busy.t>=pl.busy.dur)finishBusy();
    return;
  }
  if(picker.open){if(Math.abs(ax)>0.3)picker.close();else return}
  const px=pl.x,pf=pl.f,wasClimb=!!pl.climb;
  if(Math.abs(ax)>0.05&&!pl.climb){
    pl.goal=null;pl.x=Math.max(0.45,Math.min(maxX(pl.f),pl.x+ax*PLAYER_SPEED*TICK));pl.face=Math.sign(ax);pl.walkT+=TICK*PLAYER_SPEED*Math.abs(ax);
  }else if(pl.goal){
    const g=pl.goal;
    let tx=g.x;
    if(g.follow){const r=s.folk.find(q=>q.id===g.follow);if(!r||!(r.outing||r.storm)){pl.goal=null;return}g.f=r.f;tx=Math.max(.45,Math.min(maxX(r.f),r.x+(pl.f===r.f&&pl.x>r.x?2.2:-2.2)))}
    if(g.spot!=null){const q=SPOTS[g.spot];if(pl.f===q.f&&!pl.climb){const side=Math.sign(pl.x-q.x)||-1;tx=q.x+side*0.85}else tx=q.x+(q.x>12?-0.85:0.85)}
    const arrived=moveActor(pl,g.f,tx,PLAYER_SPEED);
    if(arrived&&g.follow){const r=s.folk.find(q=>q.id===g.follow);if(r.state==='use')pl.goal=null}
    else if(arrived){pl.goal=null;if(g.spot!=null){pl.face=Math.sign(SPOTS[g.spot].x-pl.x)||1;openPicker(SPOTS[g.spot])}}
  }else if(pl.climb){moveActor(pl,pl.climb.to,pl.x,PLAYER_SPEED)}
  if(!wasClimb&&!pl.climb&&pl.f===pf){
    for(const tr of s.traps){const q=SPOTS[tr.spot];if(q.f===pl.f&&(px!==pl.x)&&((px-q.x)*(pl.x-q.x)<=0||Math.abs(pl.x-q.x)<0.3)){springTrap(tr);break}}
  }
}
function climbIntent(dir){const pl=G.s.player;if(pl.busy||pl.stun>0)return;picker.close();
  if(dir>0&&pl.f===0&&!pl.climb)pl.goal={f:1,x:STAIR.x1+0.6};
  else if(dir<0&&pl.f===1&&!pl.climb)pl.goal={f:0,x:STAIR.x0-0.6};
  else toast(dir>0?'You are already upstairs.':'You are already downstairs.')}
function spotted(r){
  const s=G.s,pl=s.player,b=pl.busy;pl.busy=null;
  if(b.kind==='load'){s.pranks=s.pranks.filter(p=>p.spot!==b.spot)}
  s.stats.fizzled++;r.seeT=1.2;
  toast(`Spotted by ${r.d.name}! ${b.kind==='load'?'They took the prank away.':'The prank fizzled and the prop is gone.'}`,'warn');
  snd.spotted(r);uiDirty=true;
}
function cancelBusy(why){const pl=G.s.player,b=pl.busy;if(!b)return;pl.busy=null;if(b.kind==='set')G.s.inv[b.prop]++;toast(why);uiDirty=true}
function finishBusy(){
  const s=G.s,pl=s.player,b=pl.busy;pl.busy=null;const q=SPOTS[b.spot];
  if(b.kind==='set'){s.pranks.push({spot:b.spot,prop:b.prop,level:1,owner:'you'});s.roomCounts[q.room]++;snd.ui(76);toast(`${PROPS[b.prop].short} set at the ${q.name.toLowerCase()}.`,'good')}
  else if(b.kind==='load'){const p=prankAt(b.spot);if(p){p.level++;snd.ui(79);toast(`Loaded up to level ${p.level}. Bigger laugh, closer to the line.`,'good')}}
  else if(b.kind==='defuse'){const p=prankAt(b.spot);if(p&&p.owner==='moss'){s.pranks=s.pranks.filter(x=>x!==p);s.score.you+=20;s.dayScore.you+=20;s.stats.defused++;floatAt(q.f,q.x,'Defused +20','you');snd.ui(72)}}
  else if(b.kind==='bust'){const tr=trapAt(b.spot);if(tr){s.traps=s.traps.filter(x=>x!==tr);s.score.you+=60;s.dayScore.you+=60;s.stats.busted++;floatAt(q.f,q.x,'Busted +60','you');
    toast(`Busted Moss's trap! Moss bet you would come to the ${ROOMS[s.guess]}.`,'good');snd.ui(84)}}
  uiDirty=true;
}
function springTrap(tr){
  const s=G.s,pl=s.player;s.traps=s.traps.filter(x=>x!==tr);pl.stun=3;pl.goal=null;picker.close();
  s.score.moss+=80;s.dayScore.moss+=80;s.stats.caught++;
  floatAt(pl.f,pl.x,'Splosh! Moss +80','moss');effect('bucket',pl);snd.prop('bucket',pl);snd.mossLaugh();
  toast(`Moss's trap got you! It guessed you'd prank in the ${ROOMS[s.guess]}. Traps sparkle, so stop beside one and bust it.`,'warn');
  if(!reducedMotion()&&!G.fast)shake=0.3;vibrate(200,.6);uiDirty=true;
}

/* ============ the rival, Moss ============ */
function tickMoss(){
  const s=G.s,m=s.moss;
  if(m.cool>0)m.cool-=TICK;
  if(m.busy){
    m.busy.t+=TICK;
    const seer=watchers().find(r=>canSee(r,m));
    if(seer){m.busy=null;m.cool=5;seer.seeT=1.2;floatAt(m.f,m.x,`${cap(seer.d.name)} caught Moss`,'moss');snd.spotted(seer);return}
    if(m.busy.t>=m.busy.dur){const b=m.busy;m.busy=null;
      if(b.kind==='trap'){if(!prankAt(b.spot)&&!trapAt(b.spot))s.traps.push({spot:b.spot,t:s.t});s.trapsDone++}
      else if(b.kind==='load'){const p=prankAt(b.spot);if(p&&p.owner==='moss')p.level=Math.min(3,p.level+1)}
      else if(!prankAt(b.spot))s.pranks.push({spot:b.spot,prop:b.prop,level:1,owner:'moss'});
      m.cool=3.5+s.rng.moss()*3;m.goal=null;uiDirty=true}
    return;
  }
  if(m.wait>0){m.wait-=TICK;return}
  if(!m.goal){m.think-=TICK;if(m.think<=0){m.think=0.5;m.goal=mossChoose();if(m.goal)m.wait=0.6}return}
  const q=SPOTS[m.goal.spot];const side=q.x>m.x?-0.8:0.8;
  const arrived=moveActor(m,q.f,m.f===q.f&&!m.climb?q.x+side:q.x+(q.x>12?-0.8:0.8),MOSS_SPEED);
  if(arrived){
    const g=m.goal;
    const here=prankAt(g.spot);if((g.kind==='load'?!(here&&here.owner==='moss'):here)||trapAt(g.spot)||userOf(g.spot)){m.goal=null;return}
    if(watchers().some(r=>canSee(r,m))){m.wait=0.6;g.tries=(g.tries||0)+1;if(g.tries>5)m.goal=null;return}
    if(g.kind==='trap'){const pl=s.player;if(!pl.climb&&actorRoom(pl)===q.room){m.goal=null;return}}
    m.busy={kind:g.kind,spot:g.spot,prop:g.prop,t:0,dur:0.8+(g.kind==='trap'?1.2:g.kind==='load'?0.8:PROPS[g.prop].set)};
    m.face=Math.sign(q.x-m.x)||1;
  }
}
function mossChoose(){
  const s=G.s,m=s.moss,rng=s.rng.moss,pl=s.player;
  if(s.firstLanded&&s.trapsDone<2&&s.t>=s.trapPlan[s.trapsDone]){
    const c=SPOTS.filter(q=>q.room===s.guess&&!prankAt(q.i)&&!trapAt(q.i)&&(pl.f!==q.f||Math.abs(pl.x-q.x)>3));
    if(c.length&&actorRoom(pl)!==s.guess)return{kind:'trap',spot:c[Math.floor(rng()*c.length)].i};
  }
  if(s.t<12||m.cool>0)return null;
  const cand=[];
  for(const r of s.folk){if(r.sulk>0)continue;
    for(let k=1;k<=3;k++){const sp=upcoming(r,k);const own=prankAt(sp);
      if(own&&own.owner==='moss'&&own.level<2&&!userOf(sp)){const pr=PROPS[own.prop];if(pr.base*2*tagMul(r.att[pr.tag])*(fedMul(r)+0.5)<=0.85*lineOf(r))cand.push({kind:'load',spot:sp,prop:own.prop})}
      if(own||trapAt(sp)||userOf(sp))continue;
      for(let pi=0;pi<PROPS.length;pi++){const pr=PROPS[pi];if(!pr.fits.includes(SPOTS[sp].kind)||r.att[pr.tag]===-1)continue;
        const V=pr.base*tagMul(r.att[pr.tag])*(fedMul(r)+0.5);if(V<=0.85*lineOf(r))cand.push({kind:'prank',spot:sp,prop:pi})}}}
  if(!cand.length)return null;
  return cand[Math.floor(rng()*cand.length)];
}

/* ============ the tick ============ */
function tick(){
  const s=G.s;s.tick++;s.t+=TICK;
  for(const r of s.folk){tickFolk(r);if(r.seeT>0)r.seeT-=TICK}
  tickWalkers();
  tickPlayer();
  tickMoss();
  if(G.botOn)botThink();
  if(s.t>=DAY_LEN)endDay();
}
function endDay(){
  const s=G.s,m=G.mem;picker.close();
  const actual=argmax(s.roomCounts);const ex=experts();
  const hit=actual>=0&&actual===s.guess;
  if(hit){s.score.moss+=150;s.dayScore.moss+=150;s.stats.guessed++}
  ex.forEach((r,i)=>{if(r>=0&&actual>=0)m.w[i]=Math.max(.2,Math.min(5,m.w[i]*(r===actual?1.3:0.85)))});
  if(actual>=0){m.last=actual}
  if(s.bestLaugh)m.best=s.bestLaugh.room;
  // overnight each resident cools by one, and by one more if nobody pranked them today
  const moods=s.folk.map(r=>{const from=stageOf(r);r.wind=Math.max(0,r.wind-1-(r.hits.length?0:1));r.outing=null;r.storm=false;return{name:r.d.name,from,to:stageOf(r)}});
  s.history.push({day:s.day,guess:s.guess,actual,hit,counts:s.roomCounts.slice(),you:s.dayScore.you,moss:s.dayScore.moss,best:s.bestLaugh,moods});
  if(s.day>=DAYS-1){
    for(const h of s.history)h.counts.forEach((v,i)=>m.rooms[i]+=v);m.games++;
    if(!G.blankMem)store.set('moss',m);
    if(s.score.you>best&&!G.botOn){best=s.score.you;store.set('best',best)}
    setPhase('matchend');
  }else setPhase('dayend');
}
function nextDay(){const s=G.s;s.day++;startDay();setPhase('play')}

/* ============ player actions (touch, keys, pad and the test bot all call these) ============ */
const picker={open:false,spot:null,opts:[],
  close(){if(!this.open)return;this.open=false;this.spot=null;$('picker').hidden=true;$('cards').hidden=false;uiDirty=true},
};
function openPicker(q){
  const s=G.s,pl=s.player;
  if(!q){toast(`Nothing to prank here. Walk up to a furniture spot first.`);snd.no();return}
  if(pl.busy||pl.stun>0)return;
  picker.open=true;picker.spot=q.i;$('picker').hidden=false;$('cards').hidden=true;renderPicker(true);snd.ui(67);
}
function pickerOptions(){
  const s=G.s,q=SPOTS[picker.spot],p=prankAt(q.i),tr=trapAt(q.i),user=userOf(q.i),o=[];
  if(tr){o.push({id:'bust',label:'Bust the trap',sub:'1 second · +60',icon:'confetti'})}
  else if(p&&p.owner==='moss'){o.push({id:'defuse',label:`Defuse Moss's ${PROPS[p.prop].short.toLowerCase()}`,sub:'1 second · +20',icon:PROPS[p.prop].id})}
  else if(p){const nl=p.level+1,pr=PROPS[p.prop];o.push({id:'load',label:`Load up to ${nl}`,sub:`strength ${pr.base*nl}`,icon:pr.id,dis:p.level>=3?'Already at full strength':user?`${user.d.name} is using it`:null})}
  else PROPS.forEach((pr,i)=>{
    const dis=!pr.fits.includes(q.kind)?`Needs ${pr.fits.map(k=>KINDWORD[k]).join(' or ')}`:s.inv[i]<=0?'None left today':user?`${user.d.name} is using it`:null;
    o.push({id:'p'+i,prop:i,label:pr.short,sub:`×${s.inv[i]} · str ${pr.base}`,icon:pr.id,dis});
  });
  o.push({id:'leave',label:'Leave it',sub:device==='touch'?'':`${btnName('back')}`,icon:null});
  return o;
}
function nextVisitor(spot){
  const s=G.s;let bestR=null,bk=99;
  for(const r of s.folk){const n=seqOf(r).list.length;for(let k=0;k<n;k++){if(k===0&&r.state==='use')continue;if(upcoming(r,k)===spot){if(k<bk){bk=k;bestR=r}break}}}
  return bestR?{r:bestR,k:bk}:null;
}
function estimate(r,prop,level){
  const lr=G.s.learn[r.id],pr=PROPS[prop],a=lr.att[pr.tag]??lr.hint[pr.tag];
  const V=pr.base*level*(a==null?1:tagMul(a))*fedMul(r);
  const lo=lr.lo*r.Lmul*moodLine(r),hi=lr.hi*r.Lmul*moodLine(r);
  if(V<=lo)return'safe';if(V>hi*1.25)return'too far';if(lo===0&&hi===Infinity)return'unknown line';return'risky';
}
function pickerChoose(id){
  const s=G.s,pl=s.player,q=SPOTS[picker.spot];picker.opts=pickerOptions();const opt=picker.opts.find(o=>o.id===id);
  if(!opt){toast('That spot just changed. Pick again.');snd.no();renderPicker();return}
  if(opt.dis){toast(`${opt.label}: ${opt.dis}.`);snd.no();return}
  picker.close();
  if(id==='leave')return;
  if(userOf(q.i)&&id!=='bust'&&id!=='defuse'){toast('Someone sat down there first.');return}
  if(id==='bust')pl.busy={kind:'bust',spot:q.i,t:0,dur:1};
  else if(id==='defuse')pl.busy={kind:'defuse',spot:q.i,t:0,dur:1};
  else if(id==='load')pl.busy={kind:'load',spot:q.i,t:0,dur:0.8};
  else{s.inv[opt.prop]--;pl.busy={kind:'set',spot:q.i,prop:opt.prop,t:0,dur:PROPS[opt.prop].set}}
  snd.ui(64);uiDirty=true;
}
function act(){
  if(G.phase!=='play')return;
  const pl=G.s.player;
  if(picker.open){return}
  if(pl.stun>0){toast('You are soaked. Wait a moment.');return}
  if(pl.busy){toast('Busy setting it up. Hold still.');return}
  openPicker(nearSpot(pl));
}
function tapWorld(px,py){
  if(G.phase!=='play')return;const s=G.s,pl=s.player;if(pl.stun>0||pl.busy)return;
  for(const c of V.cues||[])if(px>=c.x&&px<=c.x+c.w&&py>=c.y&&py<=c.y+c.h){picker.close();pl.goal={f:c.r.f,follow:c.r.id};snd.ui(64);return}
  const wx=(px-V.ox)/V.k,wy=(V.base-py)/V.k;
  if(wy<-1.5||wy>FH*2+0.6||wx<-0.5)return;
  const f=wy>=FH?1:0;if(wx>maxX(f)+.95)return;picker.close();
  let best=null,bd=1.3;for(const q of SPOTS){if(q.f!==f)continue;const d=Math.abs(q.x-wx);if(d<bd){bd=d;best=q}}
  if(best){pl.goal={f,spot:best.i};if(pl.f===f&&!pl.climb&&Math.abs(pl.x-best.x)<=REACH){pl.goal=null;openPicker(best)}}
  else pl.goal={f,x:Math.max(.45,Math.min(maxX(f),wx))};
  marker={f,x:best?best.x:wx,t:0.6};
}

/* ============ test bot for the player's seat (same actions as a person) ============ */
function botThink(){
  const s=G.s,pl=s.player,rng=s.rng.bot;
  if(pl.busy||pl.stun>0||pl.climb)return;
  // a person takes a moment to read the house and choose: the bot waits as long
  botThink.wait=(botThink.wait||0)-TICK;if(botThink.wait>0)return;botThink.wait=0.7+rng()*0.5;
  if(picker.open){
    const q=SPOTS[picker.spot];picker.opts=pickerOptions();const opts=picker.opts.filter(o=>!o.dis&&o.id!=='leave');
    if(!opts.length){pickerChoose('leave');return}
    if(watchers().some(r=>canSee(r,pl))){pickerChoose('leave');return}
    if(opts[0].id==='bust'||opts[0].id==='defuse'){pickerChoose(opts[0].id);return}
    const nv=nextVisitor(q.i);let pickO=null,bv=-1;
    for(const o of opts){if(o.id==='load'){const p=prankAt(q.i);if(nv&&estimate(nv.r,p.prop,p.level+1)==='safe')pickO=o;continue}
      const pr=PROPS[o.prop];const e=nv?estimate(nv.r,o.prop,1):'unknown line';const v=(e==='safe'?2:e==='unknown line'?1:e==='risky'?.5:0)+pr.base/10+rng()*.3;if(v>bv){bv=v;pickO=o}}
    pickerChoose(pickO?pickO.id:'leave');return;
  }
  if(pl.goal)return;
  const here=nearSpot(pl);
  if(here&&trapAt(here.i)){openPicker(here);return}
  const near=s.traps.find(tr=>SPOTS[tr.spot].f===pl.f&&Math.abs(SPOTS[tr.spot].x-pl.x)<6);
  if(near){pl.goal={f:SPOTS[near.spot].f,spot:near.spot};return}
  if(here){const p=prankAt(here.i);if(p&&p.owner==='you'&&p.level<2){const nv=nextVisitor(here.i);if(nv&&estimate(nv.r,p.prop,p.level+1)==='safe'){openPicker(here);return}}}
  const cand=[];
  for(const r of s.folk){if(r.sulk>0)continue;for(let k=1;k<=2;k++){const sp=upcoming(r,k);const q=SPOTS[sp];
    if(G.botRoom!=null&&q.room!==G.botRoom)continue;
    if(prankAt(sp)&&prankAt(sp).owner==='you')continue;if(userOf(sp))continue;
    if(!PROPS.some((pr,i)=>pr.fits.includes(q.kind)&&s.inv[i]>0)&&!(prankAt(sp)))continue;
    const dist=Math.abs(pl.x-q.x)+(pl.f!==q.f?8:0);cand.push({sp,score:-dist+(k===1?3:0)+rng()})}}
  cand.sort((a,b)=>b.score-a.score);
  if(cand.length){pl.goal={f:SPOTS[cand[0].sp].f,spot:cand[0].sp}}
}

/* ============ effects (outside the sim) ============ */
let shake=0,marker=null;
function floatText(a,text,owner,kind){floatAt(a.f,a.x,text,owner,kind,actorY(a)+(a.d?a.d.h:1.8)+0.6)}
function floatAt(f,x,text,owner,kind,y){if(G.fast)return;G.texts.push({x,y:y??f*FH+2.6,text,owner,kind,t:0})}
function effect(kind,a){
  if(G.fast)return;const n=reducedMotion()?6:22,y0=actorY(a)+1.4;
  for(let i=0;i<n;i++){const ang=fxr()*Math.PI*2,sp=1.5+fxr()*3;
    const c=kind==='bucket'?'#7cc8ff':kind==='confetti'?['#ff5a8a','#ffd84a','#59b7ff','#9be37a'][i%4]:kind==='peel'?'#ffe27a':kind==='spider'?'#2b2b2b':'#ffb3d1';
    G.fx.push({x:a.x,y:y0+(kind==='bucket'?1:0),vx:Math.cos(ang)*sp*.6,vy:kind==='bucket'?-fxr()*2:Math.abs(Math.sin(ang))*sp,c,t:0,life:.8+fxr()*.6,sq:kind==='confetti'})}
}
function toast(text,cls=''){if(G.fast)return;G.msg={text,cls,until:performance.now()+3200};msgDirty=true}

/* ============ sound: the person's engine first, plain Web Audio as fallback ============ */
function newAudioContext(){const A=window.AudioContext||window.webkitAudioContext,touch=navigator.maxTouchPoints>0;try{return new A({latencyHint:touch?'playback':'interactive'})}catch(e){return new A()}}
function softLimit(c){const t=c.context.currentTime;c.threshold.setValueAtTime(-3,t);c.knee.setValueAtTime(6,t);c.ratio.setValueAtTime(12,t);c.attack.setValueAtTime(.006,t);c.release.setValueAtTime(.25,t)}
const AU={started:false,ctx:null,se:null,src:{},plain:null};
function ensureAudio(){
  if(AU.started){if(AU.ctx&&AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume().catch(()=>{});return}
  AU.started=true;
  try{
    const ctx=newAudioContext();AU.ctx=ctx;
    if(typeof SE==='undefined'||location.protocol==='file:'||!ctx.audioWorklet){plainAudio();return}
    const url=URL.createObjectURL(new Blob([document.getElementById('se-worklet').textContent],{type:'text/javascript'}));
    SE.SoundEngine.create({context:ctx,workletUrl:url,device:'stereo',zone:'openPlain',maxVoices:32}).then(e=>{
      AU.se=e;softLimit(e.limiter);
      AU.src.ui=e.createSource('synth',{level:78,priority:3});
      AU.src.fx=e.createSource('synth',{level:100,refDistance:200,priority:6});
      AU.src.water=e.createSource('water',{preset:'drip',level:80,refDistance:200,priority:5});
      AU.src.steps=e.createSource('footsteps',{level:66,refDistance:200,priority:2});

    ctx.restore()}
}
function drawBadgeMark(x,y,owner){const k=V.k,s=Math.max(9,k*.3);ctx.fillStyle=owner==='you'?'#ffb02e':'#a594ff';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();
  if(owner==='you')ctx.arc(x,y,s*.7,0,7);else{ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.closePath()}ctx.fill();ctx.stroke()}

/* ============ frame loop: fixed tick, capped frame time ============ */
let acc=0,last=performance.now(),stepT=0;
function frame(now){
  requestAnimationFrame(frame);
  try{
    const dt=Math.min(0.25,(now-last)/1000);last=now;
    pollPads(dt);
    if(G.phase==='play'){acc+=dt;while(acc>=TICK){tick();acc-=TICK;if(G.phase!=='play'){acc=0;break}}
      const pl=G.s.player;if(!pl.busy&&!pl.climb&&(Math.abs(playerMoveAxis())>.05||pl.goal)){stepT+=dt;if(stepT>.32){stepT=0;snd.step()}}}
    else acc=0;
    tutorialTick(dt);
    fit();draw(now/1000);renderUI();refreshTouch();
    if(AU.se)AU.se.update();
  }catch(e){console.warn('frame',e)}
}
requestAnimationFrame(frame);

/* ============ test hook ============ */
function hashState(){const s=G.s;const o={t:s.tick,sc:s.score,f:s.folk.map(r=>[r.f,+r.x.toFixed(3),r.ri,r.mood,+r.Lmul.toFixed(3),+r.wind.toFixed(2),r.outing?r.outing.i:-1]),w:s.walkers.map(w=>+w.x.toFixed(3)),p:s.pranks.map(p=>[p.spot,p.prop,p.level,p.owner]),tr:s.traps.map(t=>t.spot),
  pl:[s.player.f,+s.player.x.toFixed(3)],m:[s.moss.f,+s.moss.x.toFixed(3)],st:s.stats,g:s.guess};const str=JSON.stringify(o);let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
window.__prank={
  start(o={}){G.botOn=!!o.bot;G.botRoom=o.botRoom??null;newMatch(o.seed??1,{blankMem:o.blank!==false,tutorial:!!o.tutorial});setPhase('play');return hashState()},
  stepBy(n){G.fast=true;try{for(let i=0;i<n;i++){if(G.phase==='play')tick();else if(G.phase==='dayend'&&G.botOn)nextDay();else break}}finally{G.fast=false}return G.phase},
  fastForward(sec){return this.stepBy(Math.round(sec*60))},
  bot(on){G.botOn=!!on},
  next(){if(G.phase==='dayend')nextDay()},
  fingerprint:hashState,
  state(){const s=G.s;return s&&{history:s.history.map(h=>({guess:h.guess,actual:h.actual,hit:h.hit})),phase:G.phase,day:s.day,t:s.t,score:{...s.score},stats:{...s.stats},guess:s.guess,pranks:s.pranks.length,traps:s.traps.length,picker:picker.open,busy:!!s.player.busy,device,player:{f:s.player.f,x:s.player.x},
    folk:s.folk.map(r=>({id:r.id,wind:r.wind,hits:r.hits.length,stage:stageOf(r),out:!!r.outing,storm:r.storm,f:r.f,x:r.x,state:r.state,target:SPOTS[r.target].id})),walkers:s.walkers.map(w=>({x:w.x,face:w.face})),moods:s.history.map(h=>h.moods)}},
  setWind(id,w){const r=G.s.folk.find(q=>q.id===id);r.wind=w;uiDirty=true},
  folkTarget(id){const r=G.s.folk.find(q=>q.id===id);return SPOTS[r.target].id},
  viewOx(){return V.ox},
  cues(){const c=cv.getBoundingClientRect();return(V.cues||[]).map(q=>({id:q.r.id,x:c.left+q.x+q.w/2,y:c.top+q.y+q.h/2,w:q.w,h:q.h}))},
  folkPlan(id){const r=G.s.folk.find(q=>q.id===id);return[0,1,2].map(k=>SPOTS[upcoming(r,k)].id)},
  spotX(id){return SP[id].x},
  dial(id,pi,lvl){const r=G.s.folk.find(q=>q.id===id),pr=PROPS[pi];return{V:pr.base*lvl*tagMul(r.att[pr.tag])*fedMul(r),L:lineOf(r),n:PROPS.length}},
  land(id,pi,lvl){const s=G.s,r=s.folk.find(q=>q.id===id),sc=s.score.you,p={spot:r.target,prop:pi,level:lvl,owner:'you'};s.pranks.push(p);trigger(p,r);return{kind:r.mood,pts:s.score.you-sc}},
  spotScreen(id){const q=SP[id],r=cv.getBoundingClientRect();return{x:r.left+X(q.x),y:r.top+Y(q.f*FH+1)}},
  get phase(){return G.phase},
};
// a ready-to-play start for links like ?play=1&seed=7
const qs=new URLSearchParams(location.search);
if(qs.get('play')){newMatch(+(qs.get('seed')||1),{});setPhase('play')}else setPhase('title');
