<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1a2b">
<title>Gotcha!</title>
<style>
[hidden] { display: none !important; }
:root{
  --bg:#1d1a2b; --panel:#2a2540; --panel2:#3a3258; --line:#5d5288; --ink:#fff6e8; --dim:#d6cce6;
  --you:#ffb02e; --good:#9be37a; --bad:#ff7a7a; --sour:#f5d04b; --focus:#ffe066;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:ui-rounded,"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;height:100dvh;display:grid;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"hud" "msg" "view" "ctl" "side";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (orientation: landscape){
  #app{grid-template-columns:minmax(0,1fr) clamp(196px,26vw,340px);grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"hud hud" "msg side" "view side" "ctl side"}
}
#hud{grid-area:hud;display:flex;align-items:center;gap:8px;padding:4px 8px;min-height:52px;background:var(--panel);border-bottom:2px solid #000}
.sc{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;white-space:nowrap}
.sc small{font-weight:600;font-size:13px;color:var(--dim)}
.bY{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--you);border:2px solid #000}
#clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;white-space:nowrap}
#envl{font-size:13px;color:var(--dim);white-space:nowrap}
@media (max-width:440px){.sc .nmx{display:none} #envl{display:none} #clock{font-size:16px}}
#msg{grid-area:msg;min-height:34px;display:flex;align-items:center;justify-content:center;padding:3px 8px}
#msg span{background:rgba(8,6,16,.9);padding:4px 12px;border-radius:9px;font-size:15px;line-height:1.25;text-align:center;border:1px solid #4b4270}
#msg span.warn{border-color:var(--bad)} #msg span.good{border-color:var(--good)}
#view{grid-area:view;position:relative;min-height:0;min-width:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ctl{grid-area:ctl;min-height:60px;display:flex;align-items:center;gap:8px;padding:4px 8px calc(4px + env(safe-area-inset-bottom)) 8px;background:var(--panel);border-top:2px solid #000}
#ctlHint{flex:1;font-size:14px;color:var(--dim);line-height:1.3}
#ctlHint b{color:var(--ink)}
#side{grid-area:side;min-height:0;min-width:0;background:var(--panel);border-top:2px solid #000;height:150px;position:relative}
@media (orientation: landscape){ #side{height:auto;border-top:0;border-left:2px solid #000} }
#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:5px;height:100%}
@media (orientation: landscape){ #cards{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr))} }
.card{background:var(--panel2);border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;border:2px solid transparent;font-size:13px}
.card.hot{border-color:var(--sour)}
.card .top{display:flex;align-items:center;gap:5px}
.card .face{width:32px;height:32px;flex:none}
.card .nm{font-weight:800;font-size:14px}
.card .nx{color:var(--dim);font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (orientation: landscape){.card .nx{-webkit-line-clamp:1}}
.tags{display:flex;gap:3px}
.tg{position:relative;width:24px;height:24px;flex:none;background:#211c36;border-radius:6px}
.tg svg{position:absolute;inset:2px;width:20px;height:20px}
.tg .mk{inset:auto;right:-3px;bottom:-3px;width:13px;height:13px}
.tg.hint{outline:1px dashed #9a8fc4}
.ln{font-size:12px;color:var(--dim);white-space:nowrap}
.card.out{border-color:#7fb8d8}
.card .md{font-weight:700;font-size:12px;color:var(--dim);white-space:nowrap}
.card .pips{width:22px;height:8px;margin-right:3px;vertical-align:0}
.ln b{color:var(--ink)}
#picker{position:absolute;inset:0;padding:5px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
#pkInfo{font-size:13px;line-height:1.25;color:var(--dim);min-height:17px}
#pkInfo b{color:var(--ink)}
#pkBtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;flex:1;min-height:0;align-content:start}
@media (orientation: landscape){ #pkBtns{grid-template-columns:repeat(2,minmax(0,1fr))} }
#pkBtns button{min-height:46px;padding:3px 5px;display:flex;align-items:center;gap:5px;text-align:left;font-size:13px;line-height:1.15}
#pkBtns button svg{width:22px;height:22px;flex:none}
#pkBtns button .k{font-size:11px;color:var(--dim)}
button{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:12px;min-width:44px;min-height:44px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible,button.kf{outline:3px solid var(--focus);outline-offset:2px;border-color:var(--focus)}
button[aria-disabled="true"]{opacity:.6;border-style:dashed}
#pauseB{padding:6px 10px;font-weight:800}
#act{min-width:104px;min-height:52px;font-size:18px;font-weight:900;background:var(--you);color:#2a1600;border-color:#000}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,20,.78);padding:12px;z-index:5}
#ovp{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 18px;width:min(460px,100%);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:9px}
#ovp h1{margin:0;font-size:34px;letter-spacing:.5px;color:var(--you);text-shadow:3px 3px 0 #000}
#ovp h2{margin:0;font-size:22px}
#ovp p{margin:0;line-height:1.35;color:var(--dim);font-size:15px}
#ovp p b{color:var(--ink)}
#ovp .row{display:flex;gap:8px;flex-wrap:wrap}
#ovp .row button{flex:1}
#ovp .btns{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--panel);padding-top:6px;box-shadow:0 -10px 10px -4px var(--panel)}
#ovp button{font-size:17px;font-weight:700}
@media (orientation:landscape) and (max-height:520px){#ovp.wide{width:min(820px,100%)}#ovp .cols{columns:2;column-gap:20px}#ovp .cols p{break-inside:avoid;margin:0 0 8px;font-size:14px}#ovp .btns{flex-direction:row;flex-wrap:wrap}#ovp .btns button{flex:1 1 140px}}
#ovp button.main{background:var(--you);color:#2a1600;border-color:#000}
.tot{display:flex;justify-content:space-around;font-size:22px;font-weight:900;padding:4px 0}
.env{background:#f3e6c8;color:#2b2014;border-radius:10px;padding:8px 10px;font-size:15px;line-height:1.3}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

<style>#view:focus{outline:none}
#bOpen{font-weight:900;background:var(--good);color:#132a06;border-color:#000;min-height:52px;white-space:nowrap}
#bSkip{font-size:14px;white-space:nowrap}
.card .tl{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--ink);white-space:nowrap}
.card .tl svg{width:16px;height:16px;flex:none}
.card .row2{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:auto}
.card button.talk{min-height:44px;min-width:56px;padding:2px 8px;font-size:14px;font-weight:800}
.card.star{border-color:var(--you)}
.card .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ln{overflow:hidden;text-overflow:ellipsis}
.card .go{font-size:12px;color:var(--dim);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (orientation: portrait){.card{gap:1px}.card .nm{font-size:13px}}
@media (orientation: landscape){#cards{grid-template-rows:none;grid-auto-rows:max-content;align-content:start}}
@media (orientation: portrait){.card .row2{flex-direction:column;align-items:stretch;gap:2px}.card button.talk{width:100%;min-height:44px}}
.card.info{justify-content:center;color:var(--dim);font-size:13px;line-height:1.3}
.ovgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

 {key:'shop',name:'Corner Shop',floors:2,rooms:['Aisle','Till','Stockroom','Staff room','Landing','Back office'],spots:[['seat',0,2.6,'Crate seat'],['floor',0,6.4,'Spilt aisle'],['counter',0,14.8,'Till counter'],['cupboard',0,17.5,'Stock cupboard'],['door',0,21.6,'Fridge door'],['seat',1,2.6,'Old sofa'],['floor',1,14.8,'Landing rug'],['door',1,17.5,'Office door'],['cupboard',1,21.6,'Filing cabinet']]},

 {key:'laund',name:'Launderette',floors:1,rooms:['Benches','Machines','Back'],spots:[['seat',0,2.6,'Bench'],['floor',0,6.4,'Soapy floor'],['counter',0,11.2,'Folding table'],['cupboard',0,14.6,'Powder cupboard'],['door',0,17.2,'Back door'],['seat',0,21.6,'Dryer seat']]},
 {key:'hotel',name:'Hotel',floors:2,rooms:['Lobby','Bar','Lift hall','Corridor','Landing','Suite'],spots:[['seat',0,2.6,'Lobby sofa'],['counter',0,6.4,'Front desk'],['seat',0,14.8,'Bar stool'],['door',0,17.5,'Lift door'],['floor',0,21.6,'Polished floor'],['door',1,2.6,'Room 12 door'],['floor',1,6.4,'Room-service tray'],['cupboard',1,14.8,'Linen cupboard'],['seat',1,17.5,'Suite chair'],['cupboard',1,21.6,'Minibar']]},
 {key:'gym',name:'Gym',floors:1,rooms:['Weights','Juice bar','Lockers'],spots:[['seat',0,2.6,'Weight bench'],['floor',0,6.4,'Sweaty mat'],['counter',0,11.2,'Juice bar'],['door',0,14.6,'Locker door'],['cupboard',0,17.2,'Towel cupboard'],['seat',0,21.6,'Rowing seat']]}];

const TELL=[{k:'calm',t:'laughs it off',c:'#9be37a'},{k:'rattled',t:'rattled',c:'#f5d04b'},{k:'edge',t:'on the edge',c:'#ff9a5c'},{k:'lost',t:'losing it',c:'#ff5a5a'}];

const NAMES=['Alan','Bev','Carl','Dot','Eddie','Fay','Gus','Hilda','Ivan','Jo','Ken','Lil','Mo','Nell','Ozzy','Pat','Queenie','Ray','Sue','Ted','Una','Vic','Wendy','Xander','Yvonne','Zac','Barry','Cath','Dougie','Elsie','Frank','Gail','Harold','Irene','Jim','Kath','Len','Maureen','Norm','Olive'];

const roomOf=(f,x)=>f*3+Math.max(0,Math.min(2,Math.floor(x/RW)));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fin=(v,d=0)=>typeof v==='number'&&isFinite(v)?v:d;
const r2=v=>Math.round(v*100)/100;
const fmtM=v=>(Math.round(v*10)/10).toFixed(1)+'M';
const pick=(R,a)=>a[Math.floor(R()*a.length)%a.length];
function shuffle(R,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ state ============ */
const G={phase:'title',prev:null,setFrom:null,s:null,bot:false,botT:0,fast:false,tut:-1,lastRefusal:'',result:null,rs:streams(1),fx:[],toastT:0,overArm:0,
  get live(){return this.phase==='live'},get rigging(){return this.phase==='rig'}};
let C=null,uiDirty=true;
function defaultCareer(seed){return{v:SAVE_V,seed:seed>>>0,season:0,episode:0,budget:150,viewers:[],seasonStart:0,cameras:2,
  gags:{cushion:0,bucket:0,spider:0,peel:0,popper:0},fresh:{sound:1,wet:1,scare:1,mess:1},
  star:{name:'',buyIn:0,blown:false,done:false,line:30,love:'sound',hate:'wet',voice:'mum'},
  renewed:false,over:false,offer:[0,1],set:null,dares:[],dare:null,forfeit:null,best:0}}
function newStar(c){const R=mulberry(c.seed*53+c.season*911+7);const t=shuffle(R,TAGS);
  const used=c.star&&c.star.name;let n=pick(R,STARS);if(n===used)n=STARS[(STARS.indexOf(n)+1)%STARS.length];
  c.star={name:n,buyIn:0,blown:false,done:false,line:30,love:t[0],hate:t[1],voice:pick(R,FOLK).id}}
function offerEpisode(c){const R=mulberry(c.seed*31+c.season*7919+c.episode*104729+5);
  const pool=c.season===0?[0,1,2,3]:[0,1,2,3,4,5];const s=shuffle(R,pool);c.offer=[s[0],s[1]];c.set=null;
  c.dares=shuffle(R,DAREK).slice(0,3);c.dare=null}
const isFinale=()=>C&&C.episode===3;
const camsAvail=()=>Math.max(0,C.cameras-(C.forfeit==='camera'?1:0));

/* ============ an episode: the set, the marks ============ */
function buildEpisode(){
  const set=SETS[C.set],R=mulberry(C.seed*1009+C.season*7907+C.episode*131+17);G.rs.marks=R;
  const spots=[];set.spots.forEach((d,i)=>spots.push({id:'s'+i,kind:d[0],f:d[1],x:d[2],name:d[3],room:roomOf(d[1],d[2]),gag:null}));
  spots.push({id:'entry',kind:'entry',f:0,x:1,name:'Entrance',room:0});
  for(let r=0;r<set.floors*3;r++){const f=Math.floor(r/3);spots.push({id:'cam'+r,kind:'mount',f,x:MOUNTX[r%3],name:set.rooms[r]+' camera mount',room:r})}
  const prank=spots.filter(s=>PRANKABLE.includes(s.kind));
  const route=()=>{const out=[];let last=null;for(let i=0;i<5;i++){let c=prank.filter(s=>s.id!==last&&(i>0||s.room!==0));if(!c.length)c=prank;const s=pick(R,c);out.push(s.id);last=s.id}return out};
  const names=shuffle(R,NAMES).slice(0,4),marks=[];
  const mk=(id,o)=>Object.assign({id,name:'',star:false,voice:'gramps',line:20,love:'sound',hate:'wet',speed:2,route:route(),stopI:0,next:null,arrive:0,
    state:'waiting',f:0,x:1,mode:'walk',dwell:0,climb:0,cf:0,fluster:0,suspicion:0,footage:0,aired:0,gags:0,kinds:{},tags:{},calmCd:0,pending:0,
    steers:0,steeredTo:null,sawYou:false,bucketCam:false,gone:false,outcome:'',face:1},o);
  if(!C.star.blown&&!C.star.done)marks.push(mk('star',{name:C.star.name,star:true,voice:C.star.voice,line:C.star.line,love:C.star.love,hate:C.star.hate,speed:1.7,arrive:2.5}));
  const at=[8,30,55,80];
  for(let i=0;i<4;i++){const t=shuffle(R,TAGS);marks.push(mk('m'+i,{name:names[i],voice:FOLK[Math.floor(R()*3)%3].id,line:16+Math.floor(R()*13),love:t[0],hate:t[1],speed:1.6+R()*0.8,arrive:at[i]+(i?R()*8:0)}))}
  for(const m of marks)m.next=m.route[0];
  G.s={set:C.set,floors:set.floors,spots,marks,cams:[],t:0,p:{f:0,x:1.8,face:1,goal:null,climb:0,cf:0,walkT:0},
    d:{releases:0,edge:false,steerGag:false,spotted:false,three:false,watched:false,bucket:false},log:[],ended:false};
}
const spotById=id=>G.s&&G.s.spots.find(s=>s.id===id);
const markById=id=>G.s&&G.s.marks.find(m=>m.id===id);
const onset=()=>G.s.marks.filter(m=>m.state==='onset');
const active=m=>m.state==='onset'&&!m.gone;
const mRoom=m=>roomOf(m.f,m.x);
const pRoom=()=>roomOf(G.s.p.f,G.s.p.x);
function canSee(m){const p=G.s.p;return m.state==='onset'&&!m.climb&&!p.climb&&m.f===p.f&&mRoom(m)===pRoom()}
function onlookers(m){return G.s.marks.filter(o=>o!==m&&o.state==='onset'&&!o.climb&&o.f===m.f&&mRoom(o)===mRoom(m)).length}
function nextOf(m){if(m.mode==='exit'||m.state!=='onset'&&m.state!=='waiting')return 'entry';return m.mode==='dwell'?(m.route[m.stopI+1]||'entry'):(m.route[m.stopI]||'entry')}
function refuse(t){G.lastRefusal=t;toast(t,'warn');snd.no();return false}

/* ---- moving people: walk on a floor, use the stairs between floors ---- */
function moveActor(a,tf,tx,speed,dt){
  if(a.climb){a.climb-=dt;if(a.climb<=0){a.climb=0;a.f=a.cf}return false}
  if(a.f!==tf){const sx=12;if(Math.abs(a.x-sx)>0.05){a.x+=Math.sign(sx-a.x)*Math.min(Math.abs(sx-a.x),speed*dt);a.face=Math.sign(sx-a.x)||a.face;return false}
    a.cf=a.f+Math.sign(tf-a.f);a.climb=FH/Math.max(speed,1)/1.6;return false}
  const d=tx-a.x;if(Math.abs(d)<=speed*dt){a.x=tx;return true}a.x+=Math.sign(d)*speed*dt;a.face=Math.sign(d);return false}
function actorY(a){if(!a.climb)return a.f*FH;const tot=FH/1.6/Math.max(a.speed||6,1),k=1-a.climb/Math.max(tot,1e-3);return (a.f+(a.cf-a.f)*clamp(k,0,1))*FH}

/* ---- live tick ---- */
function tickLive(dt){
  const s=G.s;if(s.ended)return;s.t+=dt;
  const on=onset().filter(m=>!m.gone).length;let room=3-on;
  for(const m of s.marks){
    if(m.state==='waiting'){if(s.t>=m.arrive&&room>0&&s.t<LIVE_LEN-20){m.state='onset';m.f=0;m.x=1;m.mode='walk';room--;arrived(m)}continue}
    if(m.gone)continue;
    if(m.calmCd>0)m.calmCd=Math.max(0,m.calmCd-dt);
    if(m.state==='onset'){
      if(m.pending>0){m.pending-=dt;if(m.pending<=0){m.pending=0;finishReveal(m)}continue}
      if(m.fluster>1.25*m.line){storm(m);continue}
      if(m.fluster>m.line){if(!m.fuse)floatAt(m,'about to storm off!','#ff5a5a');m.fuse=(m.fuse||0)+dt;if(m.fuse>=6){storm(m);continue}}else m.fuse=0;
      if(C.forfeit==='chicken'&&!m.sawYou&&canSee(m)){m.sawYou=true;addSus(m,1,'spots the chicken suit')}
    }
    if(m.mode==='dwell'){m.dwell-=dt;if(m.dwell<=0){m.stopI++;m.mode=m.stopI>=m.route.length?'exit':'walk';m.next=nextOf(m)}continue}
    const tgt=m.mode==='exit'?spotById('entry'):spotById(m.route[m.stopI]);
    if(moveActor(m,tgt.f,tgt.x,m.speed,dt)){
      if(m.mode==='exit'){m.gone=true;if(m.state==='onset'){m.state='left';m.outcome='walked out';toast(m.name+' walked out: nothing airs')}}
      else{m.mode='dwell';m.dwell=5+4*G.rs.marks();m.next=nextOf(m);if(tgt.gag&&m.state==='onset')fireGag(m,tgt)}}
  }
  tickPlayer(dt);
  for(let i=G.fx.length-1;i>=0;i--)if((G.fx[i].t-=dt)<=0)G.fx.splice(i,1);
  const done=s.marks.every(m=>m.gone||m.state==='waiting'&&false);
  const waiting=s.marks.some(m=>m.state==='waiting');
  if(s.t>=LIVE_LEN||(!waiting&&done)){endLive()}
  uiDirty=true;
}
function arrived(m){m.next=m.route[0];if(m.star)toast(m.name+' has arrived. Build the buy-in, keep them under the line.','good');else toast(m.name+' walks in.')}
function addSus(m,n,why){if(m.state!=='onset')return;m.suspicion=Math.min(5,m.suspicion+n);floatAt(m,'suspicion +'+n,'#ff7a7a');
  if(why)toast(m.name+' '+why+': suspicion '+m.suspicion+'/5','warn');
  if(m.suspicion>=5){m.state='blown';m.outcome='spotted the cameras';m.mode='exit';m.pending=0;G.s.d.spotted=true;
    if(m.star){C.star.blown=true;toast(m.name+' spotted the cameras: the con is blown!','warn')}else toast(m.name+' spotted the cameras and left: bit blown','warn');snd.grumble(m)}}
function storm(m){m.state='stormed';m.outcome='stormed off';m.mode='exit';m.pending=0;toast(m.name+' is losing it and storms off: the bit is lost','warn');snd.grumble(m);shake(.3)}
function fireGag(m,sp){
  const kind=sp.gag,g=GAGS[kind];sp.gag=null;
  const tag=g.tag,mul=m.love===tag?0.6:m.hate===tag?1.6:1,lvl=1+0.2*m.gags,onl=onlookers(m),V=g.base*lvl*mul*(1+0.08*onl); // people watching make it land harder
  const cam=G.s.cams.includes(sp.room),line=m.line;
  const twice=!!m.kinds[kind];
  const before=m.fluster;m.fluster+=V;m.gags++;
  if(before<=line&&m.fluster>1.25*line)m.fluster=1.2*line; // one gag never snaps a mark who was under their line: they reach 'losing it' first
m.kinds[kind]=(m.kinds[kind]||0)+1;
  if(cam){m.footage+=10*V*C.fresh[tag]*(1+0.25*onl);m.tags[tag]=(m.tags[tag]||0)+1;if(kind==='bucket')m.bucketCam=true}

    for(const t in m.tags)C.fresh[t]=r2(C.fresh[t]*0.85)}

/* ---- rigging ---- */

function startCareer(seed,tut){C=defaultCareer(seed);newStar(C);offerEpisode(C);G.rs=streams(seed);G.s=null;G.result=null;G.botT=0;G.fx=[];G.lastRefusal='';

function toDare(){if(G.phase!=='shop')return false;if(C.set==null)return refuse('Pick a set first');setPhase('dare');return true}

  toast(isFinale()?'The finale! Rig the '+SETS[C.set].name+' and get '+C.star.name+' to sign.':'Rig the '+SETS[C.set].name+': gags at spots, cameras in rooms, then Doors open.');return true}
function openDoors(){if(G.phase!=='rig')return false;picker.close();setPhase('live');tutDone(3);snd.bell();toast('Doors open! Marks are on their way.','good');return true}
function wrapUp(){
  const s=G.s,aired=s.marks.reduce((a,m)=>a+m.aired,0);let viewers=aired/400;
  const dareId=C.dare,d=s.d;let dareDone=null;
  if(dareId){const chk={releases:d.releases>=3,edge:d.edge,steerGag:d.steerGag,unseen:!d.spotted,three:d.three,watched:d.watched,bucket:d.bucket};dareDone=!!chk[dareId]}
  if(dareDone)viewers*=1.25;
  const earned=40+viewers*40+(dareDone?40:0);
  const res={season:C.season,episode:C.episode,set:SETS[s.set].name,aired:r2(aired),viewers:r2(viewers),dare:dareId,dareDone,earned:r2(earned),
    marks:s.marks.map(m=>({name:m.name,star:m.star,outcome:m.outcome||'never came in',aired:m.aired,footage:r2(m.footage)})),buyIn:C.star.buyIn,starName:C.star.name,finale:isFinale(),forfeit:null};

  for(const t of TAGS)C.fresh[t]=r2(Math.min(1,C.fresh[t]+0.2));
  if(C.episode===3){const sv=C.viewers.slice(C.seasonStart),avg=sv.reduce((a,b)=>a+b,0)/Math.max(1,sv.length),target=1.5+0.5*C.season;

/* ============ saves ============ */
function cleanCareer(raw){
  if(!raw||typeof raw!=='object'||typeof raw.c!=='object'||!raw.c)return null;
  if(fin(raw.v,0)>SAVE_V)return {newer:true};
  const d=defaultCareer(fin(raw.c.seed,1)),c=raw.c,out=d;
  for(const k of['seed','season','episode','budget','seasonStart','cameras','best'])out[k]=Math.max(0,fin(c[k],d[k]));
  out.episode=clamp(Math.floor(out.episode),0,3);out.cameras=Math.floor(out.cameras);
  out.viewers=Array.isArray(c.viewers)?c.viewers.map(v=>Math.max(0,fin(v,0))):[];
  for(const k of GAGK)out.gags[k]=Math.max(0,Math.floor(fin(c.gags&&c.gags[k],0)));
  for(const t of TAGS)out.fresh[t]=clamp(fin(c.fresh&&c.fresh[t],1),0,1);
  if(c.star&&typeof c.star==='object'){const s=c.star;out.star={name:typeof s.name==='string'&&s.name?s.name:STARS[0],buyIn:Math.max(0,fin(s.buyIn,0)),blown:!!s.blown,done:!!s.done,line:fin(s.line,30),
    love:TAGS.includes(s.love)?s.love:'sound',hate:TAGS.includes(s.hate)?s.hate:'wet',voice:FOLKBY[s.voice]?s.voice:'mum'}}else newStar(out);
  out.renewed=!!c.renewed;out.over=!!c.over;
  out.offer=Array.isArray(c.offer)&&c.offer.length===2&&c.offer.every(i=>SETS[i])?c.offer.slice():d.offer;
  out.set=null;out.dares=Array.isArray(c.dares)&&c.dares.every(k=>DARES[k])&&c.dares.length===3?c.dares.slice():shuffle(mulberry(out.seed),DAREK).slice(0,3);
  out.dare=null;out.forfeit=FORFEITS[c.forfeit]?c.forfeit:null;out.v=SAVE_V;
  return out}
function saveCareer(){if(!C)return false;store.set('career',{v:SAVE_V,c:C});return true}
function readSave(){const raw=store.get('career',null);return cleanCareer(raw)}
function canResume(){const c=readSave();return !!(c&&!c.newer&&!c.over)}
function loadCareer(){const c=readSave();if(!c||c.newer||c.over)return false;C=c;G.rs=streams(C.seed);G.s=null;G.result=null;G.tut=-1;picker.close();setPhase('shop');return true}

function newAudioContext(){const A=window.AudioContext||window.webkitAudioContext,touch=navigator.maxTouchPoints>0;try{return new A({latencyHint:touch?'playback':'interactive'})}catch(e){return new A()}}

  if(AU.started){if(AU.ctx&&AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume().catch(()=>{});return}
  AU.started=true;

    const ctx=newAudioContext();AU.ctx=ctx;
    if(typeof SE==='undefined'||location.protocol==='file:'||!ctx.audioWorklet){plainAudio();return}
    const url=URL.createObjectURL(new Blob([document.getElementById('se-worklet').textContent],{type:'text/javascript'}));

      AU.src.ui=e.createSource('synth',{level:78,priority:3});

      AU.src.water=e.createSource('water',{preset:'drip',level:80,refDistance:200,priority:5});

      try{e.setListener({x:0,y:0,z:0,yaw:0})}catch(_){}
      for(const k in AU.src){try{AU.src[k].setPosition(0,0,-1)}catch(_){}}
      applyVolume();

}

function beep(f,d,type='sine',v=.3,f2){const c=AU.ctx,g0=AU.plain;if(!c||!g0)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(g0);o.start(t);o.stop(t+d+.02)}

/* ============ the player ============ */
const inp={l:0,r:0,stick:0};

function inStairs(p){return p.x>=STAIR.x0-0.4&&p.x<=STAIR.x1+0.4}
function tickPlayer(dt){

    }
  }else if(picker.kind==='talk'){const m=markById(picker.mark);if(!m)return o;const r=m.fluster/m.line;
    o.push({id:'steer',label:'Steer',sub:'+1 suspicion',icon:'peel',dis:m.mode==='exit'||!!m.pending});
    o.push({id:'calm',label:'Calm',sub:m.calmCd>0?`Again in ${Math.ceil(m.calmCd)} s`:m.fluster<=0?'Already calm':'−35% fluster',icon:'drop',dis:m.calmCd>0||m.fluster<=0});
    const fin=m.star&&isFinale(),has=fin?C.star.buyIn>0:m.footage>0;
    o.push({id:'reveal',label:'Reveal',sub:!has?(fin?'No buy-in yet':'No footage yet'):r<=1?'Signs the release':r<=1.25?'Signs grudgingly, '+Math.round(GRUDGE*100)+'%':'Will refuse',icon:'confetti',dis:!has});
  }else if(picker.kind==='steer'){const m=markById(picker.mark);if(!m)return o;
    const cand=G.s.spots.filter(s=>s.gag&&PRANKABLE.includes(s.kind)).sort((a,b)=>Math.abs(a.f-m.f)*20+Math.abs(a.x-m.x)-(Math.abs(b.f-m.f)*20+Math.abs(b.x-m.x))).slice(0,5);
    for(const s of cand)o.push({id:'to:'+s.id,label:s.name,sub:GAGS[s.gag].name+(G.s.cams.includes(s.room)?', on camera':', no camera'),icon:GAGS[s.gag].icon});
    if(!cand.length)o.push({id:'none',label:'Nothing rigged',sub:'Rig a spot first',dis:true});
    o.push({id:'back',label:'Back',sub:'to the talk menu'});return o}
  o.push({id:'close',label:'Close',sub:device==='pad'?'B':device==='kb'?K('back'):''});

function pickerChoose(id){
  if(!picker.open)return;
  const opts=pickerOptions(),o=opts.find(x=>x.id===id);if(!o)return;
  if(o.dis){refuse(o.sub);renderPicker();return}
  const sp=picker.spot&&spotById(picker.spot),m=picker.mark&&markById(picker.mark);
  if(id==='close'){picker.close();return}
  if(id==='back'){picker.kind='talk';renderPicker(true);return}
  if(id.startsWith('g:')){if(placeGag(sp,id.slice(2)))picker.close();else renderPicker();return}
  if(id==='take'){takeBack(sp);picker.close();return}
  if(id==='mount'){if(mountCam(sp.room))picker.close();else renderPicker();return}
  if(id==='unmount'){unmountCam(sp.room);picker.close();return}
  if(id==='steer'){picker.kind='steer';renderPicker(true);return}
  if(id.startsWith('to:')){doSteer(m,spotById(id.slice(3)));picker.close();return}
  if(id==='calm'){doCalm(m);picker.close();return}
  if(id==='reveal'){doReveal(m);picker.close();return}
}
function act(){
  if(!(G.phase==='rig'||G.phase==='live')||picker.open)return;
  const p=G.s.p;if(p.climb)return;

  openSpot(nearSpot(REACH))}
function tapWorld(px,py){
  if(!(G.phase==='rig'||G.phase==='live'))return;const s=G.s,p=s.p;
  const wx=(px-V.ox)/V.k,wy=(V.base-py)/V.k;
  if(wx<-0.5||wx>W+0.5||wy<-1.5||wy>s.floors*FH+1)return;
  const f=clamp(Math.floor(wy/FH),0,s.floors-1);picker.close();
  let best=null,bd=1.6;
  if(G.phase==='live')for(const m of s.marks){if(m.state!=='onset'||m.gone||m.climb||m.f!==f)continue;const d=Math.abs(m.x-wx);if(d<bd){bd=d;best={m}}}
  for(const q of s.spots){if(q.kind==='entry'||q.f!==f)continue;const d=Math.abs(q.x-wx);if(d<bd){bd=d;best={q}}}
  if(best&&best.m){p.goal={mark:best.m.id,open:true}}
  else if(best){if(p.f===f&&!p.climb&&Math.abs(p.x-best.q.x)<=REACH){p.goal=null;openSpot(best.q)}else p.goal={spot:best.q.id,f,open:true}}
  else p.goal={f,x:clamp(wx,0.5,W-0.5)};
  marker={f,x:best?(best.m?best.m.x:best.q.x):wx,t:0.6}}

/* ============ the bot: plays the player's seat with the same actions ============ */
function botShop(){
  if(C.cameras<3&&C.budget>=100+CAM_COST*0)buyItem('camera');
  const want={cushion:2,peel:2,bucket:1,spider:1,popper:1};
  let guard=0;for(const k of ['bucket','cushion','spider','peel','popper','cushion','peel']){if(guard++>10)break;if(C.gags[k]<want[k]&&C.budget>=GAGS[k].cost+0)buyItem(k)}
  chooseSet(0);toDare();}
function botDare(){const pref=['unseen','releases','bucket','steerGag'];let i=-1;for(const k of pref){const j=C.dares.indexOf(k);if(j>=0){i=j;break}}chooseDare(i);toRig()}
function botRig(){
  if(G.bot==='random'){const s=G.s,rr=G.rs.bot;const rooms=[...Array(s.floors*3).keys()].sort(()=>rr()-0.5);for(const r of rooms){if(s.cams.length>=camsAvail())break;mountCam(r)}
    for(const q of s.spots.filter(q=>PRANKABLE.includes(q.kind)).sort(()=>rr()-0.5)){const ks=GAGK.filter(k=>C.gags[k]>0&&GAGS[k].fits.includes(q.kind));if(ks.length)placeGag(q,ks[Math.floor(rr()*ks.length)])}
    openDoors();return}
  const s=G.s,score=r=>s.spots.filter(q=>q.room===r&&PRANKABLE.includes(q.kind)&&GAGK.some(k=>C.gags[k]>0&&GAGS[k].fits.includes(q.kind))).length;
  const rooms=[...Array(s.floors*3).keys()].sort((a,b)=>score(b)-score(a)||a-b);
  for(const r of rooms){if(s.cams.length>=camsAvail())break;if(score(r)>0)mountCam(r)}
  for(const r of s.cams)for(const q of s.spots.filter(q=>q.room===r&&PRANKABLE.includes(q.kind))){if(q.gag)continue;
    const k=GAGK.filter(k=>C.gags[k]>0&&GAGS[k].fits.includes(q.kind)).sort((a,b)=>GAGS[b].base-GAGS[a].base)[0];if(k)placeGag(q,k)}
  openDoors()}
function botLive(){
  const s=G.s,p=s.p;
  const ms=s.marks.filter(m=>m.state==='onset'&&!m.gone&&!m.pending);if(!ms.length)return;
  if(G.bot==='random'){const rr=G.rs.bot,m=ms[Math.floor(rr()*ms.length)],w=['reveal','calm','steer','none'][Math.floor(rr()*4)];if(w==='none')return;
    if(m.climb||p.climb||m.f!==p.f||Math.abs(m.x-p.x)>REACH){p.goal={mark:m.id};return}
    if(w==='calm')doCalm(m);else if(w==='reveal')doReveal(m);else{const ts=s.spots.filter(q=>q.gag);if(ts.length)doSteer(m,ts[Math.floor(rr()*ts.length)])}return}
  const fin=isFinale();
  const want=m=>{const r=m.fluster/m.line;
    if(m.star&&!fin){if(r>0.85&&m.calmCd<=0)return 'calm';return null}
    if(r>1.0&&m.calmCd<=0)return 'calm';
    const has=m.star?C.star.buyIn>0:m.footage>0;
    if(has&&r<=1&&(r>=0.65||m.mode==='exit'||m.stopI>=m.route.length-1&&m.mode==='dwell'||s.t>LIVE_LEN-12))return 'reveal';
    if(r>1&&r<=1.25&&has&&m.calmCd>0&&r>1.15)return 'reveal';
    if(m.steers<2&&m.suspicion<=2&&m.mode!=='exit'){const n=spotById(nextOf(m));if(!(n&&n.gag&&s.cams.includes(n.room))){const t=s.spots.find(q=>q.gag&&s.cams.includes(q.room)&&q.id!==m.route[m.stopI]);if(t)return 'steer'}}
    return null};
  let best=null,bp=-1;for(const m of ms){const w=want(m);if(!w)continue;const pr={reveal:3,calm:2,steer:1}[w]+(m.mode==='exit'?1:0);if(pr>bp){bp=pr;best={m,w}}}
  if(!best){ // rerig empty camera-room spots when no one is watching
    for(const r of s.cams)for(const q of s.spots.filter(q=>q.room===r&&PRANKABLE.includes(q.kind)&&!q.gag)){
      const k=GAGK.find(k=>C.gags[k]>0&&GAGS[k].fits.includes(q.kind));if(!k)continue;
      if(s.marks.some(m=>m.state==='onset'&&!m.gone&&mRoom(m)===q.room))continue;
      p.goal=null;p.climb=0;p.f=q.f;p.x=q.x;placeGag(q,k);return}
    return}
  const m=best.m;
  if(m.climb||p.climb||m.f!==p.f||Math.abs(m.x-p.x)>REACH){p.goal={mark:m.id};return}
  if(best.w==='calm')doCalm(m);
  else if(best.w==='reveal')doReveal(m);
  else{const t=s.spots.filter(q=>q.gag&&s.cams.includes(q.room)&&q.id!==m.route[m.stopI]).sort((a,b)=>Math.abs(a.f-m.f)*20+Math.abs(a.x-m.x)-(Math.abs(b.f-m.f)*20+Math.abs(b.x-m.x)))[0];if(t)doSteer(m,t)}}

  i=i<0?(dir>0?0:l.length-1):(i+dir+l.length)%l.length;l[i].focus({preventScroll:true});l[i].scrollIntoView({block:'nearest'});snd.ui(60);return true}

function press(a){
  if(!inPlay()){
    const ph=G.phase;
    if(a==='up'||a==='left'){navigate(-1,$('ovp'));return}
    if(a==='down'||a==='right'){navigate(1,$('ovp'));return}
    if(a==='act'){const f=document.activeElement;if(f&&f.tagName==='BUTTON'&&$('ovp').contains(f))f.click();else navigate(1,$('ovp'));return}
    if(a==='back'||a==='pause'){if(ph==='pause')resume();else if(ph==='how'||ph==='settings')overlayClick('bBack');return}
    return}
  if(a==='pause'){pause();return}
  if(picker.open){
    if(a==='up'){navigate(-1,$('pkBtns'));return}
    if(a==='down'){navigate(1,$('pkBtns'));return}
    if(a==='act'){const f=document.activeElement;if(f&&f.tagName==='BUTTON'&&$('pkBtns').contains(f))f.click();else{const b=visBtns($('pkBtns'))[0];if(b)b.click()}return}

    return}
  const s=G.s;
  if(a==='up'||a==='down'){const dir=a==='up'?1:-1;if(!appFocus()&&s.floors>1&&inStairs(s.p)&&climbIntent(dir))return;navigate(a==='up'?-1:1,$('app'));return}

/* gamepad: D-pad and A/B/Start through menus, left stick walks */
const DEADZONE=0.28;let padPrev={},padHeldLatch=false,padRep={a:null,t:0},stickY=0;
function activePad(){try{const ps=navigator.getGamepads?navigator.getGamepads():[];for(const p of ps||[])if(p&&p.connected!==false)return p}catch(e){}return null}
function pollPads(dt){
  const p=activePad();if(!p){if(inp.stick){inp.stick=0}padPrev={};return}
  const bt=i=>!!(p.buttons[i]&&(p.buttons[i].pressed||p.buttons[i].value>0.5));
  const ax=p.axes&&p.axes[0]||0,ay=p.axes&&p.axes[1]||0;
  const now={};for(const a in PADB)now[a]=bt(PADB[a]);
  const anyB=Object.values(now).some(Boolean)||Math.abs(ax)>DEADZONE||Math.abs(ay)>DEADZONE;
  if(anyB)setDevice('pad');
  if(padHeldLatch){if(!anyB)padHeldLatch=false;else{padPrev=now;inp.stick=0;return}}
  // walking: stick or D-pad left/right while playing
  if(inPlay()){let s=Math.abs(ax)>DEADZONE?ax:0;if(now.left)s=-1;if(now.right)s=1;if(s&&!inp.stick)blurApp();inp.stick=s}else inp.stick=0;
  for(const a of['act','back','pause','up','down','left','right']){
    if(now[a]&&!padPrev[a]){if((a==='left'||a==='right')&&inPlay())continue;press(a);padRep={a,t:0.42}}
    else if(now[a]&&padRep.a===a&&(a==='up'||a==='down'||!inPlay()&&(a==='left'||a==='right'))){padRep.t-=dt;if(padRep.t<=0){padRep.t=0.14;press(a)}}}
  // the stick's up and down take the stairs while playing

/* ============ drawing: the set as a side-on cross-section ============ */
const ctx=cv.getContext('2d');
const V={k:20,ox:0,base:0,w:0,h:0,dpr:1};
const PAL={cafe:['#4a3346','#57394f','#3f2f4a'],shop:['#2f4250','#35495a','#2b3b4c'],office:['#33405a','#3a4864','#2e3a52'],
  laund:['#2d4a4c','#345356','#294244'],hotel:['#4b3a2c','#574434','#423226'],gym:['#3b3150','#45395c','#352c48']};
function fit(floors){
  const r=$('view').getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  V.w=r.width;V.h=r.height;V.dpr=dpr;
  const kFull=Math.min(r.width/25.2,r.height/(floors*FH+2.4)),kZoom=Math.min(r.height/(floors*FH+2.4),r.width/9.6);
  V.zoom=r.width<r.height*1.15&&kZoom>kFull*1.3;V.k=Math.max(4,V.zoom?kZoom:kFull);
  if(V.zoom){const half=r.width/V.k/2;if(V.camX==null)V.camX=half;V.camX=clamp(V.camX,half-0.6,W-half+0.6);V.ox=r.width/2-V.camX*V.k}
  else{V.camX=null;V.ox=(r.width-W*V.k)/2}
  V.base=r.height/2+floors*FH*V.k/2+0.25*V.k;
}
// on a narrow screen the view is zoomed in and pans to keep the player (or a tapped spot) in sight
function follow(x,margin=3){if(!V.zoom)return;if(V.pan){if(Math.abs(x-V.pan.px)<0.05)return;V.pan=null}const half=V.w/V.k/2;if(V.camX==null)V.camX=x;
  if(x<V.camX-half+margin)V.camX=x+half-margin;else if(x>V.camX+half-margin)V.camX=x-half+margin;V.camX=clamp(V.camX,half-0.6,W-half+0.6)}
const SX=x=>V.ox+x*V.k,SY=y=>V.base-y*V.k;
function drawIcon(name,cx,cy,size){const I=P2D[name];if(!I)return;ctx.save();ctx.translate(cx-size/2,cy-size/2);ctx.scale(size/20,size/20);
  ctx.fillStyle=I.c;ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.fill(I.f,'evenodd');ctx.stroke(I.f);if(I.s){ctx.lineWidth=2.6;ctx.lineCap='round';ctx.stroke(I.s)}ctx.restore()}
const TELLP={};for(const k of['calm','rattled','edge','lost']){const m=tellPath(k).match(/d="([^"]+)"/);TELLP[k]=m?new Path2D(m[1]):null}
function drawTell(T,cx,cy,size){ctx.save();ctx.translate(cx-size/2,cy-size/2);ctx.scale(size/20,size/20);ctx.fillStyle=T.c;ctx.strokeStyle='#000';ctx.lineWidth=1.6;
  if(T.k==='calm'){ctx.beginPath();ctx.arc(10,10,7,0,7);ctx.fill();ctx.stroke()}else{ctx.fill(TELLP[T.k]);ctx.stroke(TELLP[T.k])}ctx.restore()}
function label(t,x,y,col='#fff6e8',px=12,align='center'){ctx.font=`600 ${px}px system-ui,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(x<0||x>V.w)return;{const w=ctx.measureText(t).width,l=align==='center'?x-w/2:align==='right'?x-w:x;if(l<3)x+=3-l;else if(l+w>V.w-3)x-=l+w-(V.w-3)}
  ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}
function drawFurniture(q,k){
  const x=SX(q.x),y=SY(q.f*FH);ctx.fillStyle='#6b5a86';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
  if(q.kind==='seat'){ctx.fillRect(x-0.5*k,y-0.9*k,1*k,0.22*k);ctx.fillRect(x+0.35*k,y-1.7*k,0.18*k,1*k);ctx.fillRect(x-0.45*k,y-0.7*k,0.12*k,0.7*k);ctx.fillRect(x+0.33*k,y-0.7*k,0.12*k,0.7*k)}
  else if(q.kind==='floor'){ctx.fillStyle='rgba(140,200,255,.35)';ctx.beginPath();ctx.ellipse(x,y-0.06*k,0.9*k,0.14*k,0,0,7);ctx.fill()}
  else if(q.kind==='counter'){ctx.fillStyle='#7a6696';ctx.fillRect(x-0.9*k,y-1.2*k,1.8*k,1.2*k);ctx.strokeRect(x-0.9*k,y-1.2*k,1.8*k,1.2*k);ctx.fillStyle='#9a86b6';ctx.fillRect(x-1*k,y-1.3*k,2*k,0.16*k)}
  else if(q.kind==='door'){ctx.fillStyle='#5a4a78';ctx.fillRect(x-0.55*k,y-2.6*k,1.1*k,2.6*k);ctx.strokeRect(x-0.55*k,y-2.6*k,1.1*k,2.6*k);ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(x+0.3*k,y-1.3*k,0.08*k,0,7);ctx.fill()}
  else if(q.kind==='cupboard'){ctx.fillStyle='#6f5c8c';ctx.fillRect(x-0.6*k,y-2.2*k,1.2*k,2.2*k);ctx.strokeRect(x-0.6*k,y-2.2*k,1.2*k,2.2*k);ctx.beginPath();ctx.moveTo(x,y-2.2*k);ctx.lineTo(x,y);ctx.stroke()}
}
function drawPerson(a,col,h,k,face,extra){
  const x=SX(a.x),y=SY(actorY(a)),bob=reducedMotion()?0:Math.abs(Math.sin((a.walkT||G.s.t*3)*9))*0.06*k;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,0.4*k,0.1*k,0,0,7);ctx.fill();
  ctx.fillStyle=col;ctx.strokeStyle='#000';ctx.lineWidth=2;
  const bw=0.62*k,bh=(h-0.6)*k;ctx.beginPath();ctx.roundRect(x-bw/2,y-bh-bob,bw,bh,0.25*k);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffd9b8';ctx.beginPath();ctx.arc(x,y-bh-0.3*k-bob,0.3*k,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+face*0.12*k,y-bh-0.33*k-bob,0.05*k,0,7);ctx.fill();
  if(extra)extra(x,y-bh-0.3*k-bob)}
function draw(){
  const s=G.s,si=s?s.set:C&&C.set!=null?C.set:0,set=SETS[si],floors=set.floors;
  fit(floors);if(s&&V.zoom){follow(s.p.x);fit(floors)}const k=V.k;ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  ctx.fillStyle='#14111f';ctx.fillRect(0,0,V.w,V.h);
  let sx=0,sy=0;if(shakeT>0){sx=(Math.random()-.5)*shakeT*14;sy=(Math.random()-.5)*shakeT*10}
  ctx.save();ctx.translate(sx,sy);
  const pal=PAL[set.key]||PAL.cafe,cams=s?s.cams:[];
  // street and ground
  ctx.fillStyle='#231d36';ctx.fillRect(0,SY(0),V.w,V.h-SY(0));
  for(let f=0;f<floors;f++)for(let r=0;r<3;r++){const room=f*3+r,x0=SX(r*RW),y1=SY((f+1)*FH);
    ctx.fillStyle=pal[r];ctx.fillRect(x0,y1,RW*k,FH*k);
    if(cams.includes(room)){ctx.fillStyle='rgba(255,90,90,.10)';ctx.fillRect(x0,y1,RW*k,FH*k)}
    {const fs=Math.max(10,Math.min(13,k*0.55)),lx=Math.max(x0,0)+0.3*k,rx=Math.min(x0+RW*k,V.w)-4;ctx.font=`600 ${fs}px system-ui,sans-serif`;
    if(lx+ctx.measureText(set.rooms[room]).width<rx)label(set.rooms[room],lx,y1+0.55*k,'#d6cce6',fs,'left');
    if(cams.includes(room)&&lx+ctx.measureText('● REC').width<rx)label('● REC',lx,y1+1.25*k,'#ff8a8a',fs,'left')}}
  // walls with doorways, floor slabs, roof
  ctx.strokeStyle='#0c0a14';ctx.lineWidth=Math.max(2,0.22*k);
  for(let f=0;f<floors;f++){for(const wx of[RW,2*RW]){ctx.beginPath();ctx.moveTo(SX(wx),SY((f+1)*FH));ctx.lineTo(SX(wx),SY(f*FH+2.8));ctx.stroke()}}
  for(let f=0;f<=floors;f++){ctx.beginPath();ctx.moveTo(SX(0),SY(f*FH));ctx.lineTo(SX(W),SY(f*FH));ctx.stroke()}
  ctx.beginPath();ctx.moveTo(SX(0),SY(floors*FH));ctx.lineTo(SX(0),SY(2.8));ctx.moveTo(SX(W),SY(floors*FH));ctx.lineTo(SX(W),SY(0));ctx.stroke();
  // stairs
  if(floors>1)for(let f=0;f<floors-1;f++){ctx.strokeStyle='#9a86b6';ctx.lineWidth=Math.max(1.5,0.12*k);ctx.beginPath();
    const n=8;for(let i=0;i<=n;i++){const x=STAIR.x0+(STAIR.x1-STAIR.x0)*i/n,y=f*FH+FH*i/n;if(i===0)ctx.moveTo(SX(x),SY(y));else{ctx.lineTo(SX(x),SY(y-FH/n));ctx.lineTo(SX(x),SY(y))}}ctx.stroke();
    ctx.fillStyle='#14111f';ctx.fillRect(SX(STAIR.x0+1),SY((f+1)*FH)-0.12*k,(STAIR.x1-STAIR.x0-1)*k,0.24*k);
    label('Stairs',SX((STAIR.x0+STAIR.x1)/2),SY(f*FH+0.5),'#d6cce6',Math.max(10,Math.min(12,k*0.5)))}
  label('Way in',SX(0.9),SY(3.3),'#d6cce6',Math.max(10,Math.min(12,k*0.5)));
  if(s){
    const rig=G.phase==='rig'||G.pauseFrom==='rig'&&G.phase==='pause';
    for(const q of s.spots){if(q.kind==='entry')continue;
      if(q.kind==='mount'){const x=SX(q.x),y=SY(q.f*FH+FH-0.5),on=cams.includes(q.room);
        ctx.fillStyle=on?'#2b2b2b':'rgba(0,0,0,.25)';ctx.strokeStyle=on?'#000':'#8a7aa8';ctx.lineWidth=1.5;ctx.setLineDash(on?[]:[3,3]);
        ctx.beginPath();ctx.roundRect(x-0.45*k,y-0.25*k,0.9*k,0.5*k,0.1*k);ctx.fill();ctx.stroke();ctx.setLineDash([]);
        if(on){ctx.fillStyle=(reducedMotion()||Math.sin(performance.now()/300)>0)?'#ff4a4a':'#7a2020';ctx.beginPath();ctx.arc(x+0.25*k,y-0.05*k,0.09*k,0,7);ctx.fill();
          ctx.fillStyle='#555';ctx.beginPath();ctx.arc(x-0.1*k,y,0.15*k,0,7);ctx.fill()}
        continue}
      drawFurniture(q,k);
      const ix=SX(q.x),iy=SY(q.f*FH)-(q.kind==='door'?3.05:q.kind==='cupboard'?2.65:q.kind==='counter'?1.85:q.kind==='seat'?1.25:0.55)*k;
      if(!q.gag&&rig){ctx.strokeStyle='#ffe066';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(ix,iy,0.42*k,0,7);ctx.stroke();ctx.setLineDash([]);label('+',ix,iy,'#ffe066',Math.max(11,0.6*k))}}
    // marks
    for(const m of s.marks){if(m.state==='waiting'||m.gone)continue;const F=FOLKBY[m.voice]||FOLK[0];
      drawPerson(m,m.star?'#ffd84a':F.c,F.h,k,m.face||1,(hx,hy)=>{
        if(m.star){ctx.fillStyle='#000';ctx.fillRect(hx-0.28*k,hy-0.08*k,0.56*k,0.12*k)}
        const T=tellOf(m.fluster/m.line);
        if(m.state==='onset'){drawTell(T,hx,hy-0.75*k,Math.max(12,0.62*k));label(m.name,hx,hy-1.35*k,m.star?'#ffe066':'#fff6e8',Math.max(10,Math.min(13,k*0.55)))
          if(m.suspicion>0)label('?'.repeat(Math.min(5,m.suspicion)),hx+0.6*k,hy-0.2*k,'#ff9a9a',Math.max(10,k*0.5),'left');
          if(m.pending>0)label('Signing…',hx,hy-1.9*k,'#9be37a',Math.max(10,k*0.5))}
        else label(m.state==='revealed'?'Signed':m.state==='stormed'?'Stormed off':m.state==='blown'?'Spotted!':'',hx,hy-0.75*k,m.state==='revealed'?'#9be37a':'#ff9a9a',Math.max(10,Math.min(13,k*0.55)))})}
    if(V.zoom){const stack={};for(const m of s.marks){if(m.state!=='onset'||m.gone)continue;const mx=SX(m.x);if(mx>=0&&mx<=V.w)continue;
      const L=mx<0,fl=m.climb?m.cf:m.f,key=(L?'L':'R')+fl,n=stack[key]=(stack[key]||0)+1,ex=L?10:V.w-10,ey=SY(fl*FH)-1.2*k-(n-1)*20,T=tellOf(m.fluster/m.line);
      ctx.fillStyle=m.star?'#ffe066':'#fff6e8';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex+(L?-6:6),ey);ctx.lineTo(ex+(L?6:-6),ey-8);ctx.lineTo(ex+(L?6:-6),ey+8);ctx.closePath();ctx.fill();ctx.stroke();
      drawTell(T,ex+(L?16:-16),ey,14);label(m.name,ex+(L?26:-26),ey,m.star?'#ffe066':'#fff6e8',12,L?'left':'right')}}
    // the player: the producer in a headset
    const p=s.p;drawPerson(p,'#ffb02e',1.95,k,p.face||1,(hx,hy)=>{ctx.strokeStyle='#000';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(hx,hy,0.34*k,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
      label('You',hx,hy-0.75*k,'#ffb02e',Math.max(10,Math.min(13,k*0.55)))});
    // rigged gags drawn over people so they never hide
    for(const q of s.spots)if(q.gag){const ix=SX(q.x),iy=SY(q.f*FH)-(q.kind==='door'?3.05:q.kind==='cupboard'?2.65:q.kind==='counter'?1.85:q.kind==='seat'?1.25:0.55)*k;drawIcon(GAGS[q.gag].icon,ix,iy,Math.max(14,0.9*k))}
    if(marker){ctx.strokeStyle='rgba(255,224,102,'+Math.min(1,marker.t*2)+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(SX(marker.x),SY(marker.f*FH)-2,0.5*k*(1.4-marker.t),0.15*k,0,0,7);ctx.stroke()}
    for(const f of G.fx){const a=Math.min(1,f.t/0.4),up=(f.t0-f.t)*0.8;ctx.globalAlpha=a;label(f.text,SX(f.x),SY(f.y+up),f.c,Math.max(11,Math.min(14,k*0.6)));ctx.globalAlpha=1}
  }
  ctx.restore();
}

/* ============ the loop ============ */
function stepSim(dt){
  if(G.phase==='live')tickLive(dt);
  else if(G.phase==='rig'){tickPlayer(dt);for(let i=G.fx.length-1;i>=0;i--)if((G.fx[i].t-=dt)<=0)G.fx.splice(i,1)}
  botTick(dt)}
let lastT=performance.now(),acc=0,errShown=false;
function frame(now){requestAnimationFrame(frame);
  try{const dt=Math.min(0.25,Math.max(0,(now-lastT)/1000));lastT=now;pollPads(dt);
    if(inPlay()){acc+=dt;let n=0;while(acc>=TICK&&n++<30){acc-=TICK;stepSim(TICK)}if(n>=30)acc=0}else{acc=0;if(G.bot&&C)botTick(dt)}
    if(marker){marker.t-=dt;if(marker.t<=0)marker=null}if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
    if(!G.fast)for(let i=G.fx.length-1;i>=0;i--)if(G.phase!=='live'&&G.phase!=='rig'&&(G.fx[i].t-=dt)<=0)G.fx.splice(i,1);
    tutorialTick();renderUI();draw()}
  catch(e){if(!errShown){errShown=true;console.error(e)}}}

/* ============ test hook ============ */
function hashState(){const j=JSON.stringify({c:C,s:G.s,ph:G.phase},(k,v)=>typeof v==='number'?Math.round(v*1000)/1000:v);let h=0x811c9dc5;
  for(let i=0;i<j.length;i++){h^=j.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
function hookStep(sec){G.fast=true;try{const n=Math.max(1,Math.round(sec/TICK));
  for(let i=0;i<n;i++){const ph=G.phase;if(ph==='live'||ph==='rig')stepSim(TICK);else if((ph==='shop'||ph==='dare')&&G.bot)botTick(TICK);else break}}
  finally{G.fast=false}uiDirty=true;renderUI()}
function nearMark(id){const m=G.s&&markById(id);if(m&&G.s)teleportNear(m);return m}
window.__prank={
  start(seed=1){G.bot=false;startCareer(seed|0,false);return true},
  get phase(){return G.phase},
  buy(id){return buyItem(id)===true},
  pickSet(i=0){if(G.phase!=='shop')return false;chooseSet(i);return toDare()},
  dare(i=-1){if(G.phase!=='dare')return false;chooseDare(i);return toRig()},
  place(spotId,gag){if(!G.s)return false;const q=spotById(spotId);if(!q)return false;const p=G.s.p;p.climb=0;p.goal=null;p.f=q.f;p.x=q.x;return placeGag(q,gag)===true},
  mount(r){return mountCam(r)===true},
  open(){return openDoors()},
  stepBy(sec){hookStep(sec);return G.phase},
  fastForward(){if(G.phase!=='live')return G.phase;G.fast=true;try{let n=0;while(G.phase==='live'&&n++<(LIVE_LEN+30)/TICK)stepSim(TICK)}finally{G.fast=false}renderUI();return G.phase},
  marks(){return G.s?G.s.marks.slice():[]},
  steer(id,spotId){const m=nearMark(id);if(!m)return false;return doSteer(m,spotById(spotId))===true},
  calm(id){const m=nearMark(id);if(!m)return false;return doCalm(m)===true},
  reveal(id){const m=nearMark(id);if(!m)return false;return doReveal(m)===true},
  bot(on){G.bot=on==='random'?'random':!!on;G.botT=0;return G.bot},
  next(){if(G.phase!=='wrap')return false;nextEp();return true},
  career(){return C?JSON.parse(JSON.stringify(C)):null},
  save(){return saveCareer()},
  load(){return loadCareer()},
  fingerprint(){return hashState()},
  spotScreen(id){const q=G.s&&spotById(id);if(!q)return null;const r=$('view').getBoundingClientRect();fit(G.s.floors);follow(q.x,2);fit(G.s.floors);return{x:r.left+SX(q.x),y:r.top+SY(q.f*FH+0.8)}},
  get state(){return G.s},
  get lastRefusal(){return G.lastRefusal},
};
{const q=new URLSearchParams(location.search);if(q.get('play')==='1'){startCareer(+(q.get('seed')||1)|0,false)}else setPhase('title')}
G.tut=settings.tutorialDone?-1:G.tut;
requestAnimationFrame(frame);
</script>
